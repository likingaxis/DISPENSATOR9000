- section_id: sec-c9ea8086
  heading: INGEGNERIA DEL SOFTWARE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > INGEGNERIA DEL SOFTWARE
  blocks:
  - block_id: backbone-b9089cf90
    type: paragraph
    content: L'ingegneria del software è una disciplina che si occupa della progettazione,
      sviluppo e gestione del software in modo strutturato e metodico. Si basa sui
      principi dell'ingegneria tradizionale e mira a trattare la produzione del software
      come un processo industriale, simile all'ingegneria meccanica o elettrica. Questo
      significa applicare approcci di progettazione, validazione, gestione del progetto
      e controllo di qualità per creare software affidabile ed efficiente. Se l'approccio
      di ingegneria del software non viene seguito, possono verificarsi problemi come
      scarsa qualità del software, mancanza di competitività nel mercato e conseguenze
      finanziarie come costi e tempi di sviluppo superiori a quanto previsto. Questi
      problemi sono spesso chiamati "cost overrun" (superamento dei costi previsti)
      e "time overrun" (ritardi nello sviluppo). In passato, la produzione di software
      non veniva considerata una disciplina ingegneristica, ma più come un'attività
      tecnica o di programmazione. L'abilità di scrivere codice e l'uso delle ultime
      tecnologie erano considerati sufficienti per creare software. Tuttavia, negli
      anni è emersa la necessità di trattare la produzione del software come una vera
      e propria disciplina ingegneristica. Quello tra la teoria della programmazione
      e i principi dell’ingegneria è stato definito “matrimonio non consumato”, questo
      si riferisce alla necessità di unire la teoria della programmazione con i principi
      dell'ingegneria. Questo significa che gli ingegneri del software dovrebbero
      avere una solida comprensione dei fondamenti teorici della programmazione, mentre
      i teorici dell'informatica dovrebbero comprendere i principi di progettazione
      e validazione dell'ingegneria. Ingegneria del software è un termine coniato
      nel 1968 durante la conferenza NATO, in Germania, per testimoniare l’esigenza
      che il software fosse inquadrato all’interno di una disciplina ingegneristica.
- section_id: sec-32cdacad
  heading: ASPETTI TIPICI DELL’INGEGNERIA DEL SOFTWARE – PROBLEMI ACCIDENTALI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ASPETTI TIPICI DELL’INGEGNERIA DEL SOFTWARE
    – PROBLEMI ACCIDENTALI
  blocks:
  - block_id: backbone-b359ec4e0
    type: list
    content: '- **Accidentali del prodotto software:** Questi sono problemi o difetti
      nel software che possono essere superati con il progresso della tecnologia.
      Sono errori non legati alla natura intrinseca del software, ma piuttosto a situazioni
      temporanee o fattori contingenti.

      - **Accidentali di attitudine:** Si riferisce ai problemi causati dalle competenze
      o dall''esperienza limitata del team di sviluppo. Questi possono essere superati
      con la formazione e l''acquisizione di competenze migliori.

      - **Accidentali di manutenzione:** Questi riguardano le sfide legate alla manutenzione
      del software dopo il suo rilascio. La manutenzione è spesso una parte significativa
      del ciclo di vita del software e richiede risorse a lungo termine.

      - **Accidentali di specifica e progetto:** Rappresentano le difficoltà nell''ottenere
      requisiti chiari e ben definiti e nel tradurli in un progetto adeguato. Una
      cattiva definizione dei requisiti può portare a risultati insoddisfacenti.

      - **Accidentali di teaming:** Questi problemi riguardano la gestione delle dinamiche
      di squadra, la comunicazione interna, le divergenze di opinioni e altri aspetti
      legati alla collaborazione del team di sviluppo.'
- section_id: sec-3b367336
  heading: CICLO DI VITA DEL SW
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CICLO DI VITA DEL SW
  blocks:
  - block_id: backbone-b625c6910
    type: paragraph
    content: 'Il ciclo di vita del software è diviso in tre stadi e sei fasi:'
  - block_id: backbone-b0a6d3a6f
    type: list
    content: '- **Stadio di Sviluppo:**'
  - block_id: backbone-b949b4a89
    type: list
    content: '1. Requisiti: Identificare e definire i requisiti del software.

      2. Specifiche: Analizzare e definire in dettaglio i requisiti raccolti.

      3. Pianificazione: Pianificare il processo di sviluppo, definendo tempi e risorse.

      4. Progetto: Creare progetti preliminari e dettagliati per l''architettura e
      il design del software.

      5. Codifica: Scrivere il codice sorgente del software.

      6. Integrazione: Integrare i moduli o componenti del software in un''unica soluzione.

      - **Stadio di Manutenzione:** Gestire e correggere eventuali problemi nel software
      dopo il rilascio. Questa fase rappresenta una parte significativa dei costi
      del ciclo di vita del software.

      - **Stadio di Dismissione:** Questo stadio coinvolge la rimozione del software
      obsoleto o non più supportato. Le 6 fasi sono molto importanti perché l’effetto
      delle modifiche varia secondo la fase in cui vengono introdotte. In fasi avanzate,
      una modifica può comportare rivolgimenti che richiedono nuove risorse o correzioni
      importanti al progetto, cioè costi supplementari. Se si svolge una modifica
      durante la fase dei requisiti, la correzione costerà 1; se invece avviene tra
      la fase di pianificazione e progettazione, costerà tra 1.5 a 6 volte; se avviene
      dopo il rilascio, costerà tra le 60 e 100 volte.'
  - block_id: backbone-b52ae99f7
    type: paragraph
    content: <!-- Pagina PDF 4 -->
  - block_id: backbone-b736f8984
    type: paragraph
    content: 'Il testing è un''attività cruciale nel ciclo di sviluppo del software,
      ma non è considerato una fase separata. Viene svolto lungo l''intero ciclo in
      due modi:'
  - block_id: backbone-b939de3dc
    type: list
    content: '- **Verifica:** Alla fine di ogni fase, si verifica se quella fase è
      stata eseguita correttamente e se i risultati sono in linea con i requisiti.

      - **Validazione:** Alla fine dello sviluppo, il prodotto finale viene validato
      per assicurarsi che soddisfi i requisiti del cliente. Il Defect Removal Efficiency
      (DRE) è una misura della percentuale di difetti che vengono trovati e risolti
      prima del rilascio del software. Un alto valore di DRE indica che molti difetti
      sono stati identificati e corretti durante lo sviluppo. Questa misura riflette
      l''efficacia del processo di controllo della qualità.'
- section_id: sec-91d2b2ab
  heading: ASPETTI TIPICI DELL’INGEGNERIA DEL SOFTWARE – PROBLEMI ESSENZIALI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ASPETTI TIPICI DELL’INGEGNERIA DEL SOFTWARE
    – PROBLEMI ESSENZIALI
  blocks:
  - block_id: backbone-b547686d7
    type: paragraph
    content: I problemi essenziali del prodotto sw sono quelli non superabili col
      progresso dei mezzi e conoscenze.
  - block_id: backbone-b438ee0a4
    type: list
    content: '- **Complessità:** Rappresenta il livello di intricazione e interconnessione
      dei componenti del software. La gestione della complessità è fondamentale per
      sviluppare software facilmente comprensibili, manutenibili ed estendibili.

      - **Conformità:** Si riferisce alla capacità del software di rispettare standard,
      linee guida e specifiche. La conformità è importante per garantire che il software
      sia compatibile con altri sistemi e che soddisfi requisiti di sicurezza e qualità.

      - **Cambiabilità:** Riguarda la capacità di apportare modifiche al software
      senza dover riscrivere l''intero sistema. Un software facilmente adattabile
      alle nuove esigenze o ai cambiamenti del contesto è cruciale per il suo successo
      a lungo termine.

      - **Invisibilità:** Si riferisce al fatto che gli utenti finali interagiscono
      principalmente con l''interfaccia utente del software e spesso non sono consapevoli
      della complessità interna. L''obiettivo è fornire un''esperienza utente intuitiva
      ed efficiente.'
- section_id: sec-680e85e1
  heading: ASPETTI TIPICI DELL’INGEGNERIA DEL SOFTWARE – PROBLEMI DI COSTO
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ASPETTI TIPICI DELL’INGEGNERIA DEL SOFTWARE
    – PROBLEMI DI COSTO
  blocks:
  - block_id: backbone-b3094cfb7
    type: list
    content: '- **Costo verso Dimensione (Size):** Il costo di sviluppo del software
      è in parte proporzionale alla sua dimensione. Tuttavia, il costo aumenta in
      modo non lineare con la dimensione del software. Aumentando la dimensione, il
      costo potrebbe crescere in modo quadratico, come descritto dalla formula C=aS^2,
      dove C è il costo, a è una costante e S è la dimensione.

      - **Costo verso Repliche:** Creare copie aggiuntive di un software già sviluppato
      comporta costi minimi, poiché gran parte dell''investimento iniziale è già stato
      effettuato.

      - **Costo verso Ampiezza di Mercato:** Aumentare l''ampiezza di mercato, cioè
      cercare di vendere il software a un pubblico più vasto, può comportare costi
      significativi. Un prodotto di dimensioni doppie richiederebbe un prezzo quattro
      volte superiore e un mercato quattro volte più grande per garantire la stessa
      redditività.'
- section_id: sec-38b4a762
  heading: DEFINIZIONI E CONCETTI CHIAVE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DEFINIZIONI E CONCETTI CHIAVE
  blocks:
  - block_id: backbone-b14436523
    type: list
    content: '- **Prodotto Sw (Software):** Si riferisce al software stesso, che comprende
      sia il codice sorgente che la documentazione associata.

      - **Artefatto:** È un prodotto software intermedio che può essere un documento
      di requisiti, un documento di specifica o un documento di progetto.

      - **Codice:** Rappresenta il prodotto software finale, ovvero il programma informatico
      scritto in un linguaggio di programmazione.

      - **Sistema Sw (Software System):** È l''insieme organizzato di prodotti software
      che lavorano insieme per raggiungere uno scopo specifico.

      - **Cliente:** È il soggetto che richiede e ordina il prodotto software. In
      alcuni casi, il cliente può essere lo stesso sviluppatore.

      - **Sviluppatore:** È il soggetto o l''organizzazione che produce il prodotto
      software in risposta alle richieste del cliente.

      - **Utente:** È il soggetto o l''organizzazione che utilizza il prodotto software
      dopo che è stato sviluppato e consegnato.

      - **Sw Interno:** Si riferisce a situazioni in cui il cliente e lo sviluppatore
      sono la stessa persona o organizzazione.

      - **Sw a Contratto:** Si verifica quando il cliente e lo sviluppatore sono soggetti
      distinti e il prodotto software è sviluppato su base contrattuale.

      - **Difetto (Defect):** È un''anomalia o un errore presente nel prodotto software.

      - **Guasto (Failure):** Si verifica quando il software presenta un comportamento
      anomalo dovuto alla presenza di un difetto, risultando in un funzionamento non
      corretto o imprevisto.

      - **Errore:** Si riferisce all''azione sbagliata di chi, per ignoranza, distrazione
      o altri motivi, introduce un difetto nel software.'
  - block_id: backbone-b1550d1f8
    type: paragraph
    content: <!-- Pagina PDF 5 -->
- section_id: sec-78f6d86f
  heading: AFFIDABILITA’ - RELIABILITY
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > AFFIDABILITA’ - RELIABILITY
  blocks:
  - block_id: backbone-b79868bb6
    type: paragraph
    content: 'Informalmente, l’affidabilità si riferisce alla credibilità del prodotto
      software nel suo funzionamento. In altre parole, quanto è affidabile secondo
      la percezione comune. Mentre, formalmente, è una misura quantitativa della probabilità
      che il prodotto software funzioni correttamente entro un certo intervallo temporale.
      L''affidabilità del software è legata alla quantità di difetti presenti. Un
      software con molti difetti è considerato meno affidabile. In generale, l''affidabilità
      aumenta man mano che il numero di difetti diminuisce. Un software affidabile
      è meno incline a guasti e problemi imprevisti e rappresenta un elemento cruciale
      per il successo e l''efficacia di un''applicazione o di un sistema software.
      Relazione Complessa tra Affidabilità e Difetti: L''affidabilità del software
      presenta una relazione non semplice tra l''affidabilità osservata e il numero
      di difetti latenti (difetti presenti ma non ancora scoperti). Non è sempre possibile
      stabilire un rapporto diretto tra la presenza di difetti latenti e l''affidabilità
      osservata. Regola 10-90: La regola 10-90 afferma che in programmi di notevoli
      dimensioni, il 90% del tempo di esecuzione totale è dedicato all''esecuzione
      del solo 10% delle istruzioni. Questa porzione del programma è chiamata "core"
      o "nucleo" del programma. Questo concetto sottolinea che alcune parti del software
      sono più critiche e usate più frequentemente rispetto ad altre. Localizzazione
      del Difetto e Affidabilità: Il miglioramento dell''affidabilità derivante dall''eliminazione
      di un difetto dipende dalla posizione di quel difetto all''interno del software.
      In particolare, se un difetto appartiene al nucleo del programma, il suo impatto
      sull''affidabilità sarà maggiore rispetto a un difetto in una parte meno critica
      del software. Affidabilità e Profilo Operativo: L''affidabilità osservata del
      software dipende da come viene utilizzato, ovvero dal suo profilo operativo.
      Il profilo operativo rappresenta come il software è effettivamente utilizzato
      dagli utenti in termini di frequenza e modalità di utilizzo. Dipendenza dall''Utente:
      Poiché gli utenti utilizzano il software in modi diversi in base ai loro profili
      operativi, i difetti che si manifestano per un utente potrebbero non manifestarsi
      per un altro. Pertanto, l''affidabilità di un prodotto software dipende anche
      dall''utente e da come lo utilizza.'
- section_id: sec-d115ebdb
  heading: CONFRONTO TRA AFFIDABILITA’ HW E SW
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CONFRONTO TRA AFFIDABILITA’ HW E SW
  blocks:
  - block_id: backbone-b58772ae4
    type: list
    content: '- **Guasti Sw (Software):** Questi si verificano a causa di difetti
      nei programmi. Ad esempio, un bug o un errore nel codice può causare il malfunzionamento
      del software. Inoltre, il software non si "consuma" fisicamente, ma può subire
      problemi legati alla sua esecuzione.

      - **Guasti Hw (Hardware):** Questi sono spesso causati dal consumo o deterioramento
      dei componenti hardware, dalla deviazione rispetto alle specifiche o dalla rottura
      di componenti. A differenza del software, l''hardware fisico è soggetto a usura
      nel tempo. I difetti software sono spesso "latenti", il che significa che possono
      rimanere nascosti fino a quando non si manifestano. Il software potrebbe continuare
      a guastarsi fino a quando i difetti non vengono corretti tramite aggiornamenti
      o correzioni. A causa della differenza degli effetti dei difetti hardware e
      software, le metriche utilizzate per valutare l''affidabilità dell''hardware
      non possono essere facilmente estese al software. Dopo la riparazione dell''hardware,
      la sua affidabilità torna generalmente allo stato precedente. Dopo la riparazione
      del software, l''affidabilità può variare: potrebbe aumentare o diminuire a
      seconda delle correzioni effettuate. L''obiettivo dell''affidabilità dell''hardware
      è la "stabilità", cioè mantenere costante la frequenza di guasti nel tempo.
      L''obiettivo dell''affidabilità del software è la "crescita di affidabilità",
      cioè ridurre la frequenza di guasti nel tempo attraverso aggiornamenti e migliorie.'
  - block_id: backbone-b96c843dd
    type: paragraph
    content: <!-- Pagina PDF 6 -->
- section_id: sec-e362a931
  heading: ANDAMENTO FREQUENZA DI GUASTO HW
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ANDAMENTO FREQUENZA DI GUASTO HW
  blocks:
  - block_id: backbone-b7f12d8b8
    type: paragraph
    content: Sulle ascisse c’è il tempo, l’istante 0 corrisponde al momento in cui
      il prodotto viene rilasciato al cliente o sul mercato. Sulle ordinate c’è la
      frequenza di guasto. Quando viene rilasciato un prodotto è molto probabile che
      questo manifesti dei malfunzionamenti (mortalità infantile – corrisponde ai
      10 giorni per il cambio). Dopo, se si segue un corretto piano di manutenzione,
      l’affidabilità rimane stabile. Passato un certo numero di anni entra in gioco
      l’usura che incrementa la frequenza di guasto.
- section_id: sec-7293eecc
  heading: ANDAMENTO FREQUENZA DI GUASTO SW
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ANDAMENTO FREQUENZA DI GUASTO SW
  blocks:
  - block_id: backbone-b4a8f7a33
    type: paragraph
    content: Il comportamento ideale è una curva che parte con una frequenza di guasto
      molto alta in corrispondenza del lancio, poi dopo le modifiche del sw la frequenza
      di guasto diminuisce tendendo a zero. Il comportamento reale, invece, ha la
      mortalità infantile ma, in corrispondenza di ogni modifica del sw, la frequenza
      di guasto ritorna a come se fosse un prodotto appena rilasciato.
- section_id: sec-048ebd27
  heading: DISPONIBILITA’ - AVAILABILITY
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DISPONIBILITA’ - AVAILABILITY
  blocks:
  - block_id: backbone-b7954d5ef
    type: paragraph
    content: La disponibilità del software si riferisce alla percentuale di tempo
      in cui il software è utilizzabile durante la sua vita. Questo dipende dal numero
      di guasti che si verificano e dal tempo necessario per ripararli. L’affidabilità
      e la disponibilità sono fondamentali per quei prodotti sw detti critici, ovvero
      per sistemi in cui il malfunzionamento del servizio può causare perdita di efficienza
      e sicurezza (perdite economiche e sociali), come ad esempio sistemi di trasporto,
      di governo del traffico aereo, di governo del volo, di produzione e distribuzione
      di energia, di comunicazione, etc.
  - block_id: backbone-b382a4309
    type: list
    content: '- THERAC 25 - è stata una macchina per la radioterapia che venne installata
      in 11 esemplari in alcuni ospedali degli Stati Uniti e del Canada; è stata affetta
      da una serie di bug nel programma informatico responsabile del suo funzionamento,
      che provocarono sei incidenti durante i quali ai pazienti venne somministrata
      una dose di radiazioni 100 volte superiore a quella necessaria (in alcuni casi
      l''apparecchio si attivò anche senza aver ricevuto l''apposito comando), causando
      un avvelenamento da radiazioni e, direttamente, il decesso di tre dei sei pazienti.

      - ARIANE ESA - il razzo si autodistrusse dopo 40 secondi dal lancio per via
      di un malfunzionamento del software di controllo; un dato a 64 bit in virgola
      mobile venne convertito in un intero a 16 bit con segno, questa operazione causò
      una trap del processore (operazione errata). Motivi di efficienza avevano spinto
      i progettisti a disabilitare il controllo software sulle trap, anche se altre
      conversioni simili nel codice erano corrette.'
  - block_id: backbone-b06eaace4
    type: paragraph
    content: <!-- Pagina PDF 7 -->
- section_id: sec-61355d2f
  heading: PROCESSO SOFTWARE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > PROCESSO SOFTWARE
  blocks:
  - block_id: backbone-b05da8413
    type: paragraph
    content: 'Il processo software è una sequenza di attività che sono necessarie
      per sviluppare un prodotto software con le caratteristiche di qualità desiderate,
      rispettando i tempi e i costi previsti. Nel processo, vengono applicati metodi,
      tecniche e strumenti, si producono prodotti intermedi e finali, si controlla
      il progetto e si gestiscono le modifiche. Il processo software si sviluppa attraverso
      un ciclo di vita che comprende tre stadi: sviluppo, manutenzione e dismissione.
      Nello stadio di sviluppo, ci sono due tipi di fasi:'
  - block_id: backbone-bcefc8139
    type: list
    content: '- Le fasi di definizione si concentrano su cosa il software deve fare,
      includendo la definizione dei requisiti e la produzione delle specifiche.

      - Le fasi di produzione si concentrano su come realizzare ciò che è stato definito
      nelle fasi precedenti. Qui si progetta, si codifica, si integra e si consegna
      il software al cliente. Lo stadio di manutenzione è dedicato al supporto del
      software realizzato e coinvolge fasi sia di definizione che di produzione. Durante
      ogni fase si procede ad effettuare il testing di quanto prodotto, mediante opportune
      tecniche di verifica e validazione (V&V) applicate sia ai prodotti intermedi
      che al prodotto finale.'
- section_id: sec-a421b0e1
  heading: TIPI DI MANUTENZIONE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > TIPI DI MANUTENZIONE
  blocks:
  - block_id: backbone-b8af4d6a1
    type: list
    content: '- **Manutenzione Correttiva:** Ha l''obiettivo di eliminare i difetti
      nel software che causano guasti o malfunzionamenti.

      - **Manutenzione Adattativa:** Si concentra sull''adattamento del software a
      cambiamenti nell''ambiente operativo in cui il software è in uso.

      - **Manutenzione Perfettiva:** Si occupa di estendere il software per aggiungere
      nuove funzionalità o miglioramenti.

      - **Manutenzione Preventiva (o Software Reengineering):** Coinvolge modifiche
      al software per semplificare le future correzioni, adattamenti e miglioramenti.'
- section_id: sec-8bd2ee95
  heading: MODELLI DI CICLO DI VITA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLI DI CICLO DI VITA
  blocks:
  - block_id: backbone-be6f7f021
    type: paragraph
    content: Secondo la definizione dello standard IEEE Std 610-12, il ciclo di vita
      del software è l'intervallo di tempo che va dall'origine dell'esigenza di costruire
      un prodotto software fino al momento in cui il prodotto stesso viene dismesso.
      Questo intervallo include una serie di fasi attraverso le quali il software
      progredisce, tra cui definizione dei requisiti, specifica, pianificazione, progettazione
      preliminare, progettazione dettagliata, codifica, integrazione, testing, uso,
      manutenzione e dismissione. È importante notare che queste fasi possono sovrapporsi
      o essere eseguite in modo iterativo, a seconda del modello di sviluppo adottato.
      Un modello di ciclo di vita del software definisce la sequenza di fasi che il
      prodotto software attraversa, dall'inizio alla fine del suo sviluppo, inclusi
      gli ordini di esecuzione di tali fasi. La scelta di un modello di ciclo di vita
      dipende da vari fattori, come la natura dell'applicazione, la maturità dell'organizzazione,
      i metodi e le tecnologie utilizzate e i vincoli imposti dal cliente. RETTANGOLI
      = attività/fasi di sviluppo FRECCE CONTINUE = attività condotte in fase sviluppo
      FRECCE TRATTEGGIATE = attività condotte in fase di manutenzione
- section_id: sec-5f64d672
  heading: BUILD & FIX
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > BUILD & FIX
  blocks:
  - block_id: backbone-b044c8555
    type: paragraph
    content: L'assenza di un modello del ciclo di vita corrisponde ad una modalità
      di sviluppo detta "Build & Fix" (o "fix-it-later"), in cui il prodotto software
      viene sviluppato e successivamente rilavorato fino a soddisfare le necessità
      del cliente. Questa è una modalità di sviluppo molto costosa e poco utilizzata.
      BUILD FIRST VERSION = codifica prodotto MODIFY UNTIL CLIENT IS SATISFIED = prodotto
      rilasciato al cliente e rilavorato fino a quando il cliente non è soddisfatto
      OPERATION MODE = prodotto entra in modalità operativa quando è accettato dal
      cliente RETIREMENT = prodotto viene dismesso
  - block_id: backbone-bfd1c8134
    type: paragraph
    content: <!-- Pagina PDF 8 -->
- section_id: sec-e9f0b5e7
  heading: MODELLO WATERFALL
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO WATERFALL
  blocks:
  - block_id: backbone-b9243e65b
    type: paragraph
    content: 'Il modello Waterfall è uno dei primi e più noti modelli di ciclo di
      vita del software. Esso rappresenta un approccio sequenziale allo sviluppo del
      software, dove le attività vengono eseguite in modo lineare e sequenziale, come
      una cascata, passando da una fase all''altra in modo graduale e unidirezionale.
      Ecco una spiegazione dettagliata di ciascuna fase:'
  - block_id: backbone-b495fd119
    type: list
    content: '- **Definizione dei Requisiti:**'
  - block_id: backbone-bc37bc1b2
    type: list
    content: '- Inizia con la raccolta dei requisiti del sistema, ovvero i bisogni
      e le specifiche dell''applicazione che si sta sviluppando.

      - I requisiti vengono documentati in dettaglio, in modo da creare una base chiara
      per lo sviluppo successivo.

      - **Progettazione:**'
  - block_id: backbone-bc7dd97ce
    type: list
    content: '- Basandosi sui requisiti, si progetta l''architettura del sistema e
      si definiscono i dettagli tecnici.

      - Questa fase si concentra sul "come" il sistema soddisferà i requisiti stabiliti
      nella fase precedente.

      - **Sviluppo:**'
  - block_id: backbone-b7990e9b9
    type: list
    content: '- Qui, il codice sorgente viene scritto sulla base del progetto stabilito
      nella fase di progettazione.

      - I programmatori traducono il design in codice eseguibile.

      - **Testing:**'
  - block_id: backbone-b990e1f07
    type: list
    content: '- Il software sviluppato viene sottoposto a rigorosi test per identificare
      difetti e verificare che il software funzioni come previsto.

      - Si effettuano test di unità, integrazione e sistema.

      - **Validazione:**'
  - block_id: backbone-bd04c2b82
    type: list
    content: '- In questa fase, il software viene validato rispetto ai requisiti iniziali.

      - Ciò implica verificare che il software soddisfi le esigenze degli utenti finali
      e funzioni correttamente nell''ambiente di utilizzo.

      - **Consegna e Manutenzione:**'
  - block_id: backbone-b6c79e63f
    type: list
    content: '- Una volta che il software ha superato con successo il testing e la
      validazione, viene rilasciato ai clienti o utenti finali.

      - Inizia la fase di manutenzione, che comprende la correzione di eventuali bug
      e l''implementazione di modifiche richieste o nuove funzionalità. Il modello
      Waterfall è caratterizzato dalla natura sequenziale delle fasi, dove ciascuna
      fase è completata prima di passare alla successiva. Questo modello è particolarmente
      adatto per progetti con requisiti chiari e stabili fin dall''inizio. Tuttavia,
      può essere inflessibile in caso di cambiamenti dei requisiti, poiché tornare
      indietro in una fase precedente può richiedere notevole tempo e sforzo. Questo
      modello è spesso utilizzato in progetti di piccole dimensioni o in situazioni
      in cui i requisiti sono ben definiti e non soggetti a cambiamenti significativi.
      Nel modello Waterfall, il processo di V&V avviene alla fine di ciascuna fase,
      prima di passare alla successiva. Lo scopo di questo processo è quello di individuare
      eventuali errori o problemi prima che diventino problemi più significativi nelle
      fasi successive dello sviluppo.'
  - block_id: backbone-b6d57b117
    type: list
    content: '- La verifica è il processo di conferma che il software è stato sviluppato
      in conformità con i requisiti specificati e che è stato eseguito correttamente.
      Coinvolge il controllo e la revisione dei prodotti software per identificare
      errori, difetti o discrepanze rispetto ai requisiti stabiliti.

      - La validazione è il processo di conferma che il software soddisfi effettivamente
      le esigenze dell''utente e sia in grado di funzionare in modo efficace nell''ambiente
      operativo previsto. Si concentra sulla comprensione delle esigenze dell''utente
      e sulla verifica che il software risponda a tali esigenze.'
  - block_id: backbone-b8f18327d
    type: paragraph
    content: <!-- Pagina PDF 9 -->
- section_id: sec-1a385bc4
  heading: RAPID PROTOTYPING MODEL
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > RAPID PROTOTYPING MODEL
  blocks:
  - block_id: backbone-b855a611a
    type: paragraph
    content: 'Il modello Rapid Prototyping è un approccio di sviluppo del software
      che si concentra sulla creazione di prototipi rapidi e iterativi del software
      per ottenere un feedback tempestivo dal cliente o dagli utenti finali. Questo
      approccio è particolarmente utile quando i requisiti non sono ben definiti o
      possono cambiare durante lo sviluppo.

      - **Definizione dei Requisiti Iniziali:** o Inizia con la raccolta dei requisiti
      iniziali, ma questi possono essere meno dettagliati'
  - block_id: backbone-b54120f18
    type: paragraph
    content: 'rispetto ad altri modelli poiché il focus è sulla creazione rapida di
      prototipi.

      - **Creazione del Prototipo:** o In questa fase, viene creato un prototipo rapido
      del software che include solo le'
  - block_id: backbone-be772a9ec
    type: paragraph
    content: funzionalità chiave o i requisiti principali. o Il prototipo è una versione
      semplificata del software che può essere sviluppata
  - block_id: backbone-b5d189c74
    type: paragraph
    content: 'rapidamente per ottenere un''idea iniziale del prodotto.

      - **Valutazione e Feedback:** o Il prototipo viene presentato al cliente o agli
      utenti finali per ottenere feedback.'
  - block_id: backbone-b999b6d0a
    type: paragraph
    content: 'Questo è un passo critico in cui gli stakeholder* possono esprimere
      opinioni sulle funzionalità, l''usabilità e altre caratteristiche.

      - **Raffinamento e Iterazione:** o In base al feedback ricevuto, il prototipo
      viene raffinato e ulteriormente sviluppato.'
  - block_id: backbone-b3b4230c2
    type: paragraph
    content: 'Nuove funzionalità possono essere aggiunte o modificate in base alle
      esigenze emerse.

      - **Cicli di Prototipazione:**'
  - block_id: backbone-bdc2767e3
    type: list
    content: '- Questo processo di creazione, valutazione e raffinamento può essere
      iterato più volte fino a quando il prototipo si avvicina alle aspettative degli
      utenti.

      - **Sviluppo Completo:**'
  - block_id: backbone-b3534846c
    type: list
    content: '- Dopo diverse iterazioni di prototipazione e feedback, il prototipo
      viene progressivamente sviluppato in un prodotto completo e pronto per il rilascio.
      * Gli stakeholder sono individui, gruppi o entità che hanno un interesse o un
      coinvolgimento nel processo di sviluppo del software* Il modello Rapid Prototyping
      è adatto quando i requisiti sono incerti, non ben definiti o possono cambiare
      durante lo sviluppo. Il processo è altamente iterativo, con cicli rapidi di
      creazione, valutazione e raffinamento del prototipo. I prototipi non sono versioni
      finali del software, ma versioni semplificate e funzionali per ottenere un feedback
      tempestivo. L''approccio enfatizza la comunicazione con il cliente o gli utenti
      finali e l''adattamento continuo alle loro esigenze e preferenze. Vantaggi:'
  - block_id: backbone-bf81a01d0
    type: list
    content: '- **Rilevare Malintesi:** I prototipi aiutano a rilevare eventuali malintesi
      tra gli utenti e gli sviluppatori, in quanto mostrano in modo tangibile come
      il software risponderà alle esigenze degli utenti.

      - **Individuare Servizi Mancanti o Confusi:** L''interazione con il prototipo
      può rivelare aree in cui i servizi offerti dal sistema non sono chiari o mancanti.

      - **Sistema Funzionante Precoce:** I prototipi forniscono una versione funzionante
      del sistema in una fase precoce dello sviluppo, consentendo agli utenti di vedere
      e interagire con il software in anticipo.

      - **Base per la Specifica Software:** Il prototipo può servire come base per
      derivare una specifica software più dettagliata, poiché offre un''idea concreta
      di come il software dovrebbe funzionare.

      - **Supporto alla Formazione e ai Test:** Il prototipo può essere utilizzato
      per formare gli utenti sul funzionamento del software e per condurre test preliminari.'
- section_id: sec-7bf69624
  heading: THROW-AWAY PROTOTYPING
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > THROW-AWAY PROTOTYPING
  blocks:
  - block_id: backbone-bdbdb4197
    type: paragraph
    content: 'La prototipizzazione "throw-away" è un approccio in cui viene creato
      un prototipo pratico del prodotto con l''obiettivo principale di identificare
      problemi nei requisiti. Alcuni punti importanti su questo approccio:'
  - block_id: backbone-b66a61c84
    type: list
    content: '- **Scarto del Prototipo:** Una volta identificati i problemi e ottenute
      le informazioni necessarie, il prototipo viene scartato. Non viene utilizzato
      come base per lo sviluppo del prodotto finale.

      - **Minimizzare i Rischi:** Questo approccio è utilizzato per ridurre i rischi
      associati ai requisiti errati o poco chiari. Il prototipo aiuta a individuare
      questi problemi in modo tempestivo.

      - **Processo di Sviluppo Diverso:** Dopo aver creato il prototipo e compreso
      meglio i requisiti, il processo di sviluppo del prodotto finale può utilizzare
      un approccio diverso.'
  - block_id: backbone-b09ef4b5b
    type: paragraph
    content: <!-- Pagina PDF 10 -->
  - block_id: backbone-be77b9574
    type: list
    content: '- **Focus sui Requisiti Iniziali:** Il prototipo "throw-away" si basa
      sui requisiti iniziali, il che significa che potrebbero mancare alcune caratteristiche
      o aspetti più complessi del sistema.

      - **Limitazioni del Prototipo:** Non è da considerare un prodotto finale, poiché
      potrebbe mancare la piena funzionalità e non è stato progettato per la manutenzione
      a lungo termine. Consegna del Prototipo "Throw-away": Quando si parla di consegnare
      un prototipo "throw-away" come prodotto finale, si tratta di un''idea che può
      presentare delle sfide e rischi significativi. Ecco perché questa pratica non
      è raccomandata:'
  - block_id: backbone-bb233515e
    type: list
    content: '- **Impossibilità di Soddisfare Requisiti Non Funzionali:** I prototipi
      potrebbero non essere progettati per soddisfare requisiti non funzionali cruciali,
      come prestazioni, scalabilità o sicurezza. Pertanto, consegnare un prototipo
      "throw- away" come prodotto finale potrebbe non essere in grado di soddisfare
      questi aspetti critici.

      - **Mancanza di Documentazione:** I prototipi "throw-away" sono spesso creati
      con lo scopo di esplorare idee e requisiti, quindi potrebbero mancare documentazione
      e dettagli essenziali che sono necessari per la manutenzione futura e la comprensione
      del funzionamento del sistema.

      - **Degrado della Struttura:** Durante lo sviluppo di un prototipo, potrebbero
      essere apportate modifiche rapide per esplorare diverse possibilità. Queste
      modifiche potrebbero non rispettare le migliori pratiche di strutturazione del
      codice e potrebbero influire negativamente sulla qualità complessiva del software.

      - **Norme di Qualità Mancanti:** Poiché un prototipo "throw-away" non è destinato
      a essere un prodotto finale, potrebbero non essere applicate le normali norme
      di qualità organizzative e di sviluppo. Questo potrebbe portare a un software
      di bassa qualità. Punti Chiave sul Prototipaggio:'
  - block_id: backbone-b2269ec55
    type: list
    content: '- **Dare un''Impressione Concreta:** L''utilizzo dei prototipi dà agli
      utenti finali un''idea tangibile delle capacità e delle funzionalità del prodotto,
      consentendo loro di fornire feedback più dettagliati.

      - **Utilizzo Crescente del Prototipaggio:** Nell''attuale ambiente di sviluppo,
      in cui la velocità è spesso cruciale, il prototipaggio è sempre più utilizzato
      poiché consente uno sviluppo più rapido e iterativo.

      - **Prototipaggio "Throw-away" per Comprendere i Requisiti:** Il prototipaggio
      "throw-away" è particolarmente utile per esplorare e comprendere meglio i requisiti
      del prodotto, identificando lacune e problematiche fin dalle fasi iniziali.

      - **Sviluppo Rapido:** Lo sviluppo rapido dei prototipi è fondamentale, ma potrebbe
      richiedere alcune scelte come l''omissione di funzionalità non essenziali o
      il rilassamento temporaneo di vincoli non funzionali.

      - **Programmazione Visuale:** La programmazione visuale è spesso utilizzata
      nei metodi di sviluppo dei prototipi perché consente di rappresentare in modo
      intuitivo le interazioni e le funzionalità del sistema. In sintesi, i prototipi
      "throw-away" hanno un ruolo importante nell''esplorare e comprendere i requisiti,
      ma non sono adatti come prodotti finali a causa di problemi legati alla qualità,
      mancanza di documentazione e impossibilità di soddisfare requisiti non funzionali
      critici. Il prototipaggio in generale rimane uno strumento prezioso per lo sviluppo
      software rapido e iterativo, che aiuta a coinvolgere gli utenti e a comprendere
      meglio le esigenze del prodotto finale.'
- section_id: sec-85d6fee7
  heading: VISUAL PROGRAMMING
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > VISUAL PROGRAMMING
  blocks:
  - block_id: backbone-bbc3c8cdd
    type: paragraph
    content: La programmazione visuale rappresenta un approccio allo sviluppo software
      che si basa sull'uso di elementi grafici e interfacce utente per creare il codice.
  - block_id: backbone-bb15bcf79
    type: list
    content: '- **Sviluppo di Interfacce Utente:** Nel contesto della programmazione
      visuale, il prototipo viene creato mediante la progettazione di un''interfaccia
      utente utilizzando elementi grafici standard. I componenti vengono associati
      a questi elementi per definire il comportamento del prototipo.

      - **Librerie di Componenti:** Esistono librerie di componenti che supportano
      il processo di sviluppo visuale. Questi componenti possono essere adattati alle
      specifiche esigenze dell''applicazione in fase di sviluppo. Problemi con lo
      Sviluppo Visuale:'
  - block_id: backbone-bf2f81c54
    type: list
    content: '- **Difficoltà nel Coordinamento:** L''approccio visuale potrebbe comportare
      difficoltà nel coordinare lo sviluppo quando più membri del team lavorano su
      diverse parti dell''applicazione.

      - **Assenza di un''Architettura Esplicita:** La programmazione visuale potrebbe
      mancare di un''architettura software esplicita, il che potrebbe complicare la
      gestione e la manutenzione a lungo termine del progetto.

      - **Dipendenze Complesse:** Le dipendenze complesse tra le varie parti del programma
      possono portare a problemi di manutenzione e rendere difficile l''apportare
      modifiche senza causare effetti collaterali indesiderati.'
  - block_id: backbone-bb4d495c4
    type: paragraph
    content: <!-- Pagina PDF 11 -->
- section_id: sec-807bc6a4
  heading: ITERAZIONE DEL PROCESSO
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ITERAZIONE DEL PROCESSO
  blocks:
  - block_id: backbone-bade91203
    type: paragraph
    content: 'È comune che i requisiti di un progetto evolvano nel corso del tempo.
      L''iterazione è il processo di ritornare a fasi precedenti del ciclo di sviluppo
      per adattarsi a questi cambiamenti. L''iterazione può essere applicata a vari
      modelli di processo ed esistono due approcci: modello incrementale e modello
      a spirale.'
- section_id: sec-93f563d3
  heading: MODELLO INCREMENTALE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO INCREMENTALE
  blocks:
  - block_id: backbone-be143f836
    type: paragraph
    content: 'Il modello incrementale è un approccio allo sviluppo software in cui
      il prodotto viene sviluppato e rilasciato per incrementi successivi. Ogni incremento
      aggiunge nuove funzionalità al prodotto. Questo modello include aspetti tipici
      del modello basato su rapid prototyping (l’utente può sperimentare l’utilizzo
      del prodotto contenente gli incrementi consegnati, mentre i restanti sono ancora
      in fase di sviluppo). Può essere implementato in due versioni: con o senza overall
      architecture (architettura generale).'
  - block_id: backbone-bcd7ced90
    type: paragraph
    content: 'La versione con overall architecture si riferisce a un approccio nel
      modello incrementale in cui viene stabilita una struttura di architettura generale
      prima dell''inizio dello sviluppo incrementale. In altre parole, prima di iniziare
      a creare i singoli incrementi, si definisce un quadro architetturale che fornisce
      una visione globale di come il prodotto finale sarà strutturato.

      - **Definizione dell''Architettura:** Prima di iniziare a sviluppare i singoli
      incrementi, viene definita un''architettura generale che stabilisce come le
      diverse parti del sistema interagiranno tra loro.

      - **Guida per lo Sviluppo:** L''architettura generale funge da guida durante
      il processo di sviluppo. Gli sviluppatori hanno una visione chiara di come le
      parti del sistema si collegheranno e lavoreranno insieme, consentendo loro di
      sviluppare gli incrementi in modo coerente.

      - **Minimizzazione dei Problemi di Integrazione:** L''approccio con overall
      architecture mira a minimizzare i problemi di integrazione che potrebbero emergere
      quando gli incrementi vengono combinati. Poiché l''architettura è già stata
      definita, è più probabile che i singoli incrementi si adattino in modo coeso
      all''interno della struttura complessiva.

      - **Rischio e Complessità:** Sebbene l''approccio con overall architecture possa
      ridurre il rischio di problemi di integrazione e aiutare a stabilire una base
      solida, richiede una pianificazione e un''analisi più approfondite iniziali
      per stabilire l''architettura generale. Questo può rendere l''avvio del progetto
      più lungo rispetto a un approccio meno pianificato.

      - **Adattabilità:** Nonostante l''architettura globale venga definita all''inizio,
      è importante considerare che il modello incrementale prevede ancora flessibilità
      e adattabilità. Gli incrementi possono essere soggetti a modifiche in base al
      feedback degli utenti e all''evoluzione dei requisiti.'
  - block_id: backbone-b9aa65790
    type: paragraph
    content: 'La versione senza overall architecture nel contesto del modello incrementale
      si riferisce a un approccio in cui non viene definita un''architettura generale
      completa prima di iniziare lo sviluppo incrementale.

      - **Inizio Diretto con Incrementi:** In questo approccio, il processo di sviluppo
      inizia direttamente con la creazione dei singoli incrementi, senza una fase
      preliminare dedicata alla definizione di un''architettura generale.

      - **Flessibilità e Adattabilità:** Questo approccio privilegia la flessibilità
      e la capacità di adattarsi rapidamente ai cambiamenti. Gli sviluppatori sono
      in grado di concentrarsi su funzionalità specifiche e adattarsi alle esigenze
      in evoluzione dei requisiti e del feedback degli utenti.

      - **Rischio di Integrazione:** Poiché manca un quadro architetturale generale,
      potrebbero sorgere problemi di integrazione quando gli incrementi vengono combinati.
      La mancanza di una guida architetturale potrebbe portare a una struttura complessiva
      meno coerente.

      - **Risultati Iniziali più Veloci:** Poiché l''attenzione si concentra direttamente
      sugli incrementi e sulle funzionalità specifiche, è possibile ottenere risultati
      iniziali più rapidi rispetto a un approccio con overall architecture.

      - **Complessità Futura:** Mentre la mancanza di un''architettura globale potrebbe
      semplificare l''inizio dello sviluppo, potrebbe anche portare a una maggiore
      complessità in seguito quando gli incrementi dovessero essere integrati.'
  - block_id: backbone-b4604d73a
    type: paragraph
    content: <!-- Pagina PDF 12 -->
  - block_id: backbone-b6e8ea163
    type: paragraph
    content: 'Confronto con il Modello a Cascata:'
  - block_id: backbone-b56d35f39
    type: paragraph
    content: '| MODELLO A CASCATA | MODELLO INCREMENTALE |

      | --- | --- |

      | Il feedback del cliente è otetnuto solo alla fine del processo di sviluppo.
      | Il feedback del cliente è continuo durante tutot il processo di sviluppo grazie
      ai rilasci incrementali. |

      | Le fasi procedono in una sequenza rigida (l’output di una costituisce input
      per la successiva). | Le fasi possono essere condotet in parallelo. |

      | Le fasi di progetot detatgliato e codifica sono efefttuate per l''intero prodotto.
      | La progetatzione detatgliata e la codifica vengono efefttuate su ogni singolo
      incremento. |

      | Il team di sviluppo può essere composto da un numero elevato di persone. |
      Il lavoro è svolto da differenti team di sviluppo, ciascuno di piccole dimensioni.
      |

      | I requisiti sono generalmente fissati dopo la fase di specifica. | I requisiti
      sono suddivisi in classi di priorità e possono essere facilmente modificati
      in base alle iterazioni. |'
- section_id: sec-0c364893
  heading: MODELLO A SPIRALE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO A SPIRALE
  blocks:
  - block_id: backbone-be3a525ef
    type: paragraph
    content: 'Il modello a spirale è un approccio di sviluppo software che incorpora
      iterazione e valutazione continua per affrontare i rischi e i problemi nel corso
      del progetto. Viene rappresentato come una serie di fasi a spirale, ciascuna
      delle quali rappresenta un ciclo di sviluppo. Queste fasi sono:

      - **Determinazione degli Obiettivi:** Definizione degli obiettivi del progetto,
      identificazione dei vincoli e delle restrizioni.

      - **Identificazione e Risoluzione dei Rischi:** Identificazione dei rischi potenziali
      associati agli obiettivi del progetto. Si cercano modi per affrontarli e risolverli.

      - **Sviluppo e Test:** Sviluppo del software e creazione di prototipi, seguiti
      da test per valutare la funzionalità e la robustezza.

      - **Valutazione del Cliente:** Valutazione del cliente dei risultati dell''iterazione
      corrente, inclusi i prototipi e i progressi.

      - **Pianificazione:** Basandosi sulla valutazione del cliente, si decide se
      procedere con la prossima iterazione, pianificando ulteriori sviluppi e risoluzione
      dei rischi. Il modello a spirale è adatto per progetti complessi in cui i rischi
      possono essere difficili da identificare fin dall''inizio. Ogni ciclo rappresenta
      un passaggio attraverso queste fasi, con l''obiettivo di migliorare il prodotto
      e affrontare i rischi prima che diventino problematici. Modello a Spirale Semplificato
      (Versione Lineare): In questa variante semplificata, il modello a spirale è
      semplificato a una sequenza lineare di attività. Manca la natura ciclica dei
      cicli a spirale. Le fasi sono simili a quelle del modello a spirale completo
      ma vengono eseguite in sequenza. Modello a Spirale Semplificato: Questa variante
      conserva le fasi a spirale ma riduce il numero di cicli. Invece di eseguire
      molteplici cicli a spirale, vengono eseguite solo poche iterazioni per coprire
      le diverse fasi. Questo riduce la complessità e il numero complessivo di cicli.
      Modello Full-Spiral: Il modello full-spiral è il modello a spirale completo,
      come descritto in precedenza. Prevede iterazioni multiple attraverso le diverse
      fasi in un approccio continuo e iterativo.'
- section_id: sec-da501417
  heading: GESTIONE DEI RISCHI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > GESTIONE DEI RISCHI
  blocks:
  - block_id: backbone-b493a91ff
    type: paragraph
    content: 'La gestione dei rischi è un processo essenziale nello sviluppo software
      che mira a identificare, valutare e affrontare i rischi che possono influenzare
      un progetto. Un rischio è una possibile circostanza sfavorevole o evento che
      potrebbe influenzare il successo del progetto. Categorie di Rischi:'
  - block_id: backbone-be115f8fa
    type: list
    content: '- **Project Risks:** Questi riguardano le variabili interne al progetto
      stesso, come la gestione del personale, le modifiche nell''organizzazione o
      la disponibilità dei mezzi necessari.'
  - block_id: backbone-ba7bfac84
    type: list
    content: '- Ad esempio, la perdita di personale esperto, il cambiamento della
      gestione dell''organizzazione o la disponibilità ritardata dell''hardware essenziale.'
  - block_id: backbone-bb7641e07
    type: paragraph
    content: <!-- Pagina PDF 13 -->
  - block_id: backbone-bc3662a8f
    type: list
    content: '- **Product Risks:** Questi riguardano gli aspetti del prodotto in sviluppo,
      come cambiamenti nelle specifiche, ritardi nel completamento o problemi di prestazione
      con gli strumenti utilizzati per lo sviluppo.'
  - block_id: backbone-b1d457bc8
    type: list
    content: '- Ad esempio, cambiamenti e ritardi nelle specifiche, sottostima delle
      dimensioni del sistema o prestazioni non soddisfacenti degli strumenti CASE
      (Computer-Aided Software Engineering).

      - **Business Risks:** Questi sono legati al contesto commerciale in cui l''organizzazione
      opera, come cambiamenti tecnologici che potrebbero renderlo obsoleto o la competizione
      di prodotti simili sul mercato.'
  - block_id: backbone-b2aa0dc3a
    type: list
    content: '- Ad esempio, il cambiamento della tecnologia sottostante o la competizione
      di prodotti concorrenti. Processo di Gestione dei Rischi:'
  - block_id: backbone-b73ca6014
    type: list
    content: '- **Identificazione dei Rischi:** In questa fase, si individuano e si
      elencano i potenziali rischi che potrebbero influire sul progetto, il prodotto
      o l''organizzazione. Questa fase richiede una visione approfondita del progetto
      e del suo ambiente.

      - **Analisi dei Rischi:** Si valuta la probabilità che ciascun rischio si verifichi
      e le conseguenze che avrebbero se si verificassero. Questo aiuta a classificare
      i rischi in base alla loro gravità e impatto.

      - **Pianificazione dei Rischi:** Per ciascun rischio identificato, si sviluppano
      piani per affrontarlo. Questi piani possono includere azioni preventive per
      evitare che il rischio si verifichi o contromisure per ridurne l''impatto se
      si verifica.

      - **Monitoraggio dei Rischi:** Questa è una fase continua in cui i rischi vengono
      monitorati durante tutto il corso del progetto. Se nuove informazioni emergono
      o se cambiano le circostanze, i piani possono essere aggiornati o modificati
      di conseguenza. Identificazione dei Rischi: I rischi possono essere categorizzati
      in diverse categorie, ognuna delle quali rappresenta un''area di potenziale
      incertezza o problematica all''interno di un progetto. Le categorie includono
      tecnologici, umani, organizzativi, legati agli strumenti, ai requisiti e alle
      stime. Ogni categoria può avere rischi specifici associati ad essa. Analisi
      dei Rischi: L''analisi dei rischi coinvolge la valutazione della probabilità
      che un rischio si verifichi e degli effetti che avrebbe se si verificasse. La
      probabilità può essere classificata in categorie come molto bassa (<10%), bassa
      (10-25%), moderata (25-50%), alta (50-75%) o molto alta (>75%). Gli effetti
      possono essere categorizzati come catastrofici, gravi, tollerabili o insignificanti.
      Ad esempio, il rischio di tagli al budget a causa di problemi finanziari dell''organizzazione
      è valutato come basso in probabilità ma con effetti catastrofici. Questo esempio
      dimostra come un rischio può essere valutato in base alla sua probabilità di
      verificarsi e all''entità dei danni che potrebbe causare. Selezione dei Rischi
      Più Importanti: Per individuare i rischi più importanti, è possibile considerare
      i rischi catastrofici e i rischi gravi con una probabilità superiore alla moderata.
      Questi rischi selezionati vengono poi classificati in ordine di importanza,
      consentendo al team di concentrare le risorse e l''attenzione sui rischi che
      potrebbero avere il maggiore impatto sul progetto. Pianificazione dei Rischi:
      La pianificazione dei rischi è il processo di sviluppare strategie per affrontare
      i rischi identificati durante il progetto. Queste strategie sono finalizzate
      a ridurre la probabilità di occorrenza dei rischi, minimizzarne l''impatto o
      affrontarli in modo efficace in caso di occorrenza. Ecco alcune strategie di
      gestione dei rischi in relazione a diversi tipi di rischi:'
  - block_id: backbone-bbf3f9992
    type: list
    content: '- **Problemi Finanziari dell''Organizzazione:** Preparare un documento
      che dimostri come il progetto contribuisce agli obiettivi aziendali, al fine
      di sensibilizzare la direzione aziendale sull''importanza del progetto.

      - **Problemi di Reclutamento:** Comunicare al cliente le possibili difficoltà
      di reclutamento e valutare l''opzione di acquistare componenti esterni per evitare
      ritardi.

      - **Malattia del Personale:** Riorganizzare il team in modo da condividere il
      lavoro in modo più ampio e migliorare la comprensione dei compiti reciproci
      per affrontare l''assenza di personale.

      - **Componenti Difettosi:** Sostituire i componenti potenzialmente difettosi
      con componenti affidabili ottenuti da fonti affidabili.

      - **Cambiamenti nei Requisiti:** Creare un sistema di tracciabilità per valutare
      l''impatto dei cambiamenti dei requisiti e massimizzare l''isolamento delle
      informazioni durante la fase di progettazione.

      - **Ristrutturazione Organizzativa:** Simile all''esempio precedente, preparare
      un documento per dimostrare come il progetto contribuisce agli obiettivi aziendali
      e sensibilizzare la direzione sull''importanza del progetto.

      - **Prestazioni del Database:** Esaminare l''opzione di acquistare un database
      con prestazioni migliori per affrontare i problemi di prestazioni del database.

      - **Sottostima del Tempo di Sviluppo:** Valutare l''acquisto di componenti esterni
      o l''uso di un generatore di programmi per accelerare lo sviluppo e affrontare
      la sottostima del tempo.'
  - block_id: backbone-b298eccda
    type: paragraph
    content: <!-- Pagina PDF 14 -->
  - block_id: backbone-bc3bfb955
    type: paragraph
    content: 'Monitoraggio dei Rischi: Il monitoraggio dei rischi è un processo cruciale
      per garantire che i rischi identificati vengano valutati regolarmente nel corso
      del progetto. Coinvolge l''analisi costante di ciascun rischio per determinare
      se la sua probabilità di occorrenza sta diminuendo o aumentando. Questo processo
      aiuta a mantenere un controllo costante sui rischi e ad affrontarli in modo
      tempestivo.'
- section_id: sec-16d30c23
  heading: MODELLO OBJECT-ORIENTED
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO OBJECT-ORIENTED
  blocks:
  - block_id: backbone-bee0c4627
    type: paragraph
    content: Questo modello è incentrato sull'approccio di sviluppo orientato agli
      oggetti, in cui il software è progettato e strutturato intorno a oggetti, classi
      e relazioni. Questo approccio consente di creare software modulare, riutilizzabile
      e flessibile. Le fasi di sviluppo si concentrano sulla creazione e interazione
      degli oggetti, promuovendo la modularità e la gestione semplificata dei cambiamenti
      nei requisiti.
- section_id: sec-cf20d946
  heading: MODELLO DI INGEGNERIA SIMULTANEA O CONCORRENTE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO DI INGEGNERIA SIMULTANEA O CONCORRENTE
  blocks:
  - block_id: backbone-bad31aab8
    type: paragraph
    content: Questo modello mira a ridurre tempi e costi di sviluppo attraverso un
      approccio sistematico e concorrente al progetto di un prodotto software e dei
      processi associati. A differenza dei modelli sequenziali, le fasi di sviluppo
      non si susseguono in ordine sequenziale, ma coesistono contemporaneamente. Questo
      favorisce la collaborazione tra le diverse fasi e consente di ottenere risultati
      più rapidamente.
- section_id: sec-a99c0750
  heading: MODELLO BASATO SU METODI FORMALI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO BASATO SU METODI FORMALI
  blocks:
  - block_id: backbone-b14fc20be
    type: paragraph
    content: Questo modello coinvolge l'applicazione di metodi formali per specificare
      il software in modo matematicamente rigoroso. Lo scopo principale è eliminare
      ambiguità, incompletezze ed inconsistenze nelle specifiche e nel codice, facilitando
      così la verifica e la validazione dei programmi attraverso tecniche matematiche.
      Un esempio di questa filosofia è la Cleanroom Software Engineering, sviluppata
      nel 1987, che si concentra sulla rilevazione tempestiva dei difetti tramite
      rigorosi processi formali.
- section_id: sec-541022ea
  heading: MODELLO MICROSOFT – APPROCCIO SYNCH-AND-STABILIZE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO MICROSOFT – APPROCCIO SYNCH-AND-STABILIZE
  blocks:
  - block_id: backbone-b4ebb0921
    type: paragraph
    content: 'La Microsoft, come molte altre organizzazioni nel settore del software,
      ha affrontato la necessità di migliorare la qualità dei prodotti software e
      di ridurre tempi e costi di sviluppo fin dagli anni ''80. Per far fronte a queste
      sfide, ha sviluppato un modello di sviluppo che combina elementi iterativi,
      incrementali e concorrenti, consentendo di sfruttare la creatività delle persone
      coinvolte nello sviluppo. L''approccio utilizzato dalla Microsoft, noto come
      "synchronize-and-stabilize", si basa su due principi fondamentali:'
  - block_id: backbone-b995c949c
    type: list
    content: '- **Sincronizzazione Quotidiana:** Le attività svolte da singole persone
      e piccoli team (da 3 a 8 persone) vengono sincronizzate quotidianamente. Questo
      avviene attraverso l''assemblaggio dei componenti software sviluppati (anche
      in modo parziale) in un "daily build". Questo build giornaliero rappresenta
      il prodotto in uno stato iniziale che viene sottoposto a test e correzioni per
      individuare e risolvere tempestivamente eventuali problemi.

      - **Stabilizzazione Periodica:** Il prodotto viene stabilizzato in incrementi
      successivi, noti come "milestone", lungo tutto l''arco del progetto. Questo
      significa che il processo di stabilizzazione non avviene solo alla fine del
      progetto, ma periodicamente durante il suo avanzamento. Questo approccio mira
      a gestire in modo più efficace gli aspetti di qualità, rischi e cambiamenti
      nel corso del progetto.'
- section_id: sec-529e8d44
  heading: CICLO DI SVILUPPO A 3 FASI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CICLO DI SVILUPPO A 3 FASI
  blocks:
  - block_id: backbone-b01aef737
    type: paragraph
    content: 'Il ciclo di sviluppo a 3 fasi è un approccio strutturato alla gestione
      del processo di sviluppo del software. Questo modello si basa su tre fasi chiave:'
  - block_id: backbone-b5ddaac4d
    type: list
    content: '- **Fase di Pianificazione:**'
  - block_id: backbone-b15cbb09d
    type: list
    content: '- In questa fase iniziale, viene definita la visione del prodotto, compresi
      gli obiettivi, le specifiche e la pianificazione.

      - Gli obiettivi includono la comprensione chiara di ciò che il prodotto software
      deve realizzare.

      - Le specifiche definiscono i dettagli funzionali e tecnici del prodotto.

      - La pianificazione comprende la stima dei tempi, la suddivisione delle attività
      e la creazione di un piano di sviluppo.

      - **Fase di Sviluppo:**'
  - block_id: backbone-b901b93c8
    type: list
    content: '- La fase di sviluppo è suddivisa in 3 o 4 sottoprogetti sequenziali.

      - Ogni sottoprogetto è orientato alla realizzazione di una parte specifica del
      prodotto e culmina in un rilascio di milestone.

      - Questa fase è incentrata sulla progettazione, lo sviluppo e l''integrazione
      delle funzionalità del prodotto.

      - Ogni sottoprogetto viene completato con il rilascio di una versione funzionante
      del software.

      - **Fase di Stabilizzazione:**'
  - block_id: backbone-b457150cc
    type: list
    content: '- La fase di stabilizzazione segue la fase di sviluppo e si concentra
      sulla verifica e sulla validazione del prodotto.

      - Vengono eseguiti test interni ed esterni approfonditi per identificare difetti
      e assicurare che il software funzioni come previsto.'
  - block_id: backbone-b7d7b466b
    type: paragraph
    content: <!-- Pagina PDF 15 -->
  - block_id: backbone-be9a7672d
    type: list
    content: '- Una volta completati i test e risolti i problemi, il prodotto è portato
      a uno stato stabile e pronto per il rilascio.

      - Alla fine di questa fase, il software è pronto per essere distribuito agli
      utenti finali.'
- section_id: sec-2cf35b7b
  heading: STRATEGIE E PRINCIPI – MODELLO MICROSOFT
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > STRATEGIE E PRINCIPI – MODELLO MICROSOFT
  blocks:
  - block_id: backbone-b3d535d78
    type: paragraph
    content: 'Strategia per Definire Prodotto e Processo: Questa strategia pone l''accento
      sulla creatività come elemento essenziale nello sviluppo del software.'
  - block_id: backbone-b20baed9f
    type: list
    content: '- Dividere il progetto in milestone (fasi chiave).

      - Definire una "product vision" e una specifica funzionale in evoluzione.

      - Selezionare funzionalità e priorità in base alle esigenze dell''utente.

      - Definire un''architettura modulare per riflettere la struttura del prodotto.

      - Assegnare task elementari e limitare le risorse. Strategia per Sviluppo e
      Consegna dei Prodotti: Questa strategia mira a lavorare in modo parallelo con
      frequenti sincronizzazioni.'
  - block_id: backbone-bf70cdec1
    type: list
    content: '- Definire team paralleli e utilizzare il "daily build" per la sincronizzazione.

      - Avere sempre un prodotto pronto per la consegna, con versioni per diverse
      piattaforme e mercati.

      - Utilizzare lo stesso linguaggio di programmazione all''interno dello stesso
      sito di sviluppo.

      - Testare continuamente il prodotto durante lo sviluppo.

      - Utilizzare metriche per supportare le decisioni.'
- section_id: sec-50e89390
  heading: CONFRONTO TRA SYNCH-AND-STABILIZE E MODELLO A CASCATA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CONFRONTO TRA SYNCH-AND-STABILIZE E MODELLO
    A CASCATA
  blocks:
  - block_id: backbone-b93e1c0a7
    type: paragraph
    content: '| SYNC-AND-STABILIZE | MODELLO A CASCATA |

      | --- | --- |

      | È iterativo e incrementale. | È sequenziale. |

      | Coinvolge milestone periodiche di stabilizzazione. | Le fasi si susseguono
      in un flusso lineare. |

      | Lavora in modo parallelo e sincronizzato. | Richiede il completamento di una
      fase prima di passare alla successiva. |

      | Promuove la creatività e l''evoluzione delle specifiche. | Si basa su specifcihe
      complete e fisse all''inizio. |

      | Abbraccia il concetot di "daily build" e test continui. | Può essere meno
      adattabile ai cambiamenti dei requisit.i |

      | Adatot a proget tiche richiedono flessibilità e adattamento. | Adatot a proget
      ticon requisiti chiari e stabili. |'
- section_id: sec-b181f9ba
  heading: MODELLO NETSCAPE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO NETSCAPE
  blocks:
  - block_id: backbone-b765b403e
    type: paragraph
    content: 'Il processo di sviluppo software adottato dalla Netscape Communications
      Corporation, noto come il Modello Netscape segue un approccio di tipo "synchronize-and-stabilize"
      (sincronizzazione e stabilizzazione) e si adatta allo sviluppo di applicazioni
      Internet come browser e prodotti server. Questo significa che il processo di
      sviluppo è suddiviso in due fasi principali:'
  - block_id: backbone-ba5fbeddc
    type: list
    content: '- **Fase di Sincronizzazione (Synchronize):** Durante questa fase, l''attenzione
      è rivolta a sviluppare e introdurre nuove funzionalità. Gli sviluppatori lavorano
      per creare e implementare nuove idee e caratteristiche nel software.

      - **Fase di Stabilizzazione (Stabilize):** Dopo aver aggiunto le nuove funzionalità,
      la fase di stabilizzazione si concentra sulla risoluzione dei bug, sull''ottimizzazione
      delle prestazioni e sulla migliorare la qualità generale del software. In questa
      fase, il focus si sposta dalla creazione di nuove funzionalità alla correzione
      degli errori e all''assicurazione che il software sia affidabile e stabile.'
- section_id: sec-714be735
  heading: METODI AGILI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > METODI AGILI
  blocks:
  - block_id: backbone-b321fe0c8
    type: paragraph
    content: 'Agile è un approccio allo sviluppo software che si è evoluto nei primi
      anni 2000 come reazione ai processi di sviluppo software rigidamente pianificati.
      Gli sviluppatori agili sostengono che questi processi possono essere troppo
      restrittivi e incapaci di adattarsi rapidamente ai cambiamenti. L''approccio
      Agile è incentrato sulla flessibilità, la collaborazione e la consegna rapida
      di valore. Il Manifesto Agile, formulato nel 2001, definisce quattro valori
      fondamentali che gli sviluppatori agili ritengono di grande importanza:'
  - block_id: backbone-b921fcb29
    type: list
    content: '- **Individui e interazioni più che processi e strumenti:** Gli aspetti
      umani e la comunicazione efficace sono prioritari rispetto a procedure rigide
      e strumenti tecnologici.

      - **Software funzionante più che documentazione esaustiva:** L''obiettivo principale
      è consegnare software che funzioni correttamente, anziché dedicarsi a una documentazione
      eccessivamente dettagliata.

      - **Collaborazione con il cliente più che negoziazione di contratti:** La collaborazione
      continua con il cliente è essenziale per comprendere le sue esigenze e soddisfarle,
      piuttosto che concentrarsi solo su contratti formali.

      - **Rispondere ai cambiamenti più che seguire un piano:** L''Agile si basa sulla
      capacità di adattarsi rapidamente ai cambiamenti nelle esigenze o nelle circostanze,
      invece di attenersi rigidamente a piani prefissati.'
  - block_id: backbone-b7934e6c4
    type: paragraph
    content: <!-- Pagina PDF 16 -->
  - block_id: backbone-b0e2449f9
    type: paragraph
    content: Oltre ai valori, il Manifesto Agile include dodici principi che guidano
      l'implementazione degli approcci agili. Questi principi enfatizzano l'importanza
      della consegna continua di software funzionante, della collaborazione attiva
      con i clienti, dell'accoglienza dei cambiamenti nei requisiti e molto altro.
- section_id: sec-a77019a2
  heading: SCRUM – METODO AGILE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SCRUM – METODO AGILE
  blocks:
  - block_id: backbone-b76ad9087
    type: paragraph
    content: 'Scrum è uno dei framework* agili più popolari che aiuta i team a lavorare
      insieme in modo più efficiente e flessibile per produrre prodotti di alta qualità.
      Il suo obiettivo principale è quello di consegnare valore* in modo iterativo
      e incrementale, consentendo ai team di adattarsi rapidamente ai cambiamenti
      nelle esigenze dei clienti e nel contesto del progetto. Ruoli:'
  - block_id: backbone-b3382ab3b
    type: list
    content: '- **Product Owner:** La persona responsabile di definire le esigenze
      del prodotto e di mantenere il Product Backlog aggiornato con le funzionalità
      e le attività da realizzare.

      - **Scrum Master:** Il facilitatore del team, responsabile di aiutare il team
      a seguire Scrum e rimuovere gli ostacoli che potrebbero impedire il progresso.

      - **Team di sviluppo:** Il gruppo di persone che effettivamente realizzano il
      lavoro, sviluppando le funzionalità e completando le attività. Eventi:'
  - block_id: backbone-b2a500f6a
    type: list
    content: '- **Sprint:** Un periodo di tempo fisso (solitamente da una a quattro
      settimane) in cui il team lavora per consegnare un insieme di funzionalità.

      - **Sprint Planning:** Una riunione all''inizio di ogni sprint in cui il team
      seleziona le attività dal Product Backlog da completare durante lo sprint.

      - **Daily Scrum:** Una riunione quotidiana in cui il team condivide rapidamente
      cosa ha fatto, cosa farà e se ci sono ostacoli.

      - **Sprint Review:** Una riunione alla fine di ogni sprint in cui il team mostra
      ciò che ha completato al Product Owner e agli stakeholder.

      - **Sprint Retrospective:** Una riunione dopo la Sprint Review in cui il team
      riflette su ciò che è andato bene e su come migliorare. Artefatti:'
  - block_id: backbone-b3ccb6fea
    type: list
    content: '- **Product Backlog:** È una "lista di cose da fare" per il prodotto.
      Contiene tutte le funzionalità, i miglioramenti e le attività da realizzare
      in futuro, in ordine di priorità.

      - **Sprint Backlog:** Una lista di attività selezionate dal Product Backlog
      per essere completate durante lo sprint corrente.

      - **Incremento:** Il risultato del lavoro dello sprint, che include tutte le
      funzionalità e le attività completate. L''approccio Scrum prevede cicli ripetitivi
      chiamati "sprint", in cui il team pianifica, sviluppa, testa e consegna un incremento
      di prodotto. Questo approccio consente al team di adattarsi rapidamente ai cambiamenti,
      ricevere feedback regolare e consegnare valore in modo continuo. *Un framework
      è un''infrastruttura di supporto predefinita e strutturata che fornisce un insieme
      di strumenti, librerie, linee guida e componenti riutilizzabili per semplificare
      lo sviluppo di software, applicazioni o altre soluzioni. In altre parole, è
      come un set di strumenti e istruzioni già pronte che ti aiutano a costruire
      qualcosa.* *Quando si parla di "consegnare valore" in un contesto come lo sviluppo
      software o il project management, si intende sviluppare e rilasciare funzionalità
      o componenti che apportino un impatto positivo al destinatario finale.* Sprint:
      Uno "sprint" è un periodo di tempo definito (tipicamente da 2 a 4 settimane)
      durante il quale il team di sviluppo lavora per consegnare un incremento funzionante
      del software. Gli sprint iniziano con una riunione di pianificazione durante
      la quale il team seleziona gli elementi da sviluppare dal Product Backlog e
      li sposta nello Sprint Backlog. Durante lo sprint, si tengono brevi riunioni
      quotidiane chiamate "stand-up meeting" per sincronizzare il lavoro e risolvere
      eventuali problemi. Alla fine di uno sprint, viene effettuata una revisione
      in cui l''incremento viene mostrato al Product Owner e agli stakeholder. Infine,
      si tiene una riunione di retrospettiva per riflettere sullo sprint e identificare
      possibili miglioramenti per il prossimo. Definizione di "Done" (Fatto): Nel
      contesto di Scrum e dell''approccio Agile, la "definizione di done" è un concetto
      fondamentale. Rappresenta un insieme di criteri che il team di sviluppo stabilisce
      per definire quando un elemento di lavoro è considerato completato e pronto
      per l''integrazione nel ramo principale del progetto. Questo aiuta a garantire
      che il lavoro consegnato sia di alta qualità e soddisfi gli standard stabiliti.'
  - block_id: backbone-bbb87db3e
    type: paragraph
    content: <!-- Pagina PDF 17 -->
  - block_id: backbone-b1c72e0be
    type: paragraph
    content: 'User Stories (Storie Utente): Le "storie utente" sono un metodo comune
      utilizzato nello sviluppo Agile, spesso in combinazione con Scrum, per catturare
      ed esprimere i requisiti di un progetto in un formato semplice e comprensibile.
      Una "storia utente" è una breve descrizione di una funzionalità o un requisito
      del sistema dal punto di vista dell''utente finale. La struttura tipica di una
      storia utente è la seguente: As a [ruolo dell''utente], I want [obiettivo dell''utente]
      so that [beneficio ottenuto] Le storie utente sono brevi, concise e mirano a
      focalizzare l''attenzione sui bisogni degli utenti finali. Sono uno strumento
      chiave per comprendere e soddisfare i requisiti degli utenti in modo iterativo
      ed efficiente. Le "storie utente" possono essere chiamate "epiche" quando rappresentano
      requisiti complessi che richiedono una suddivisione ulteriore in storie più
      piccole.'
- section_id: sec-20e8a649
  heading: CAPABILITY MATURITY MODEL – CMM
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CAPABILITY MATURITY MODEL – CMM
  blocks:
  - block_id: backbone-bc8b53c80
    type: paragraph
    content: Il Capability Maturity Model (CMM) è un framework di valutazione e miglioramento
      dei processi sviluppato dal Software Engineering Institute (SEI) negli anni
      '90. È stato progettato per valutare e migliorare la maturità dei processi di
      sviluppo software all'interno delle organizzazioni. Il CMM fornisce una scala
      a cinque livelli di maturità, ognuno dei quali rappresenta un grado crescente
      di disciplina e controllo nei processi di sviluppo.
  - block_id: backbone-b546ffd6b
    type: list
    content: '1. Initial (Iniziale): I processi sono imprevedibili, non documentati
      e variano notevolmente. Il successo è spesso basato'
  - block_id: backbone-b6d312768
    type: paragraph
    content: 'sull''eroismo individuale.

      2. Repeatable (Ripetibile): I processi sono documentati in modo da poter essere
      ripetuti. Tuttavia, la gestione di progetti'
  - block_id: backbone-babbcbbd1
    type: paragraph
    content: 'potrebbe essere ancora reattiva.

      3. Defined (Definito): I processi sono definiti e standardizzati in tutta l''organizzazione.
      L''organizzazione compie sforzi per'
  - block_id: backbone-bc9fde1cb
    type: paragraph
    content: 'istituire pratiche coerenti e formali.

      4. Managed (Gestito): I processi sono misurati e controllati. L''organizzazione
      usa metriche per il monitoraggio e il'
  - block_id: backbone-b53f584c1
    type: paragraph
    content: 'miglioramento continuo dei processi.

      5. Optimizing (Ottimizzato): I processi sono soggetti a miglioramenti continui
      e innovazioni. L''organizzazione cerca'
  - block_id: backbone-b0d8f52ec
    type: paragraph
    content: 'costantemente modi per ottimizzare i processi esistenti e adattarsi
      ai cambiamenti. Key Process Areas (KPA): Ogni livello di maturità nel CMM è
      associato a diverse Key Process Areas (KPA), che rappresentano gli aspetti chiave
      che un''organizzazione deve affrontare per raggiungere quel livello di maturità.
      Ogni KPA viene descritta attraverso obiettivi, responsabilità, risorse necessarie,
      attività da svolgere e metodi per monitorare e verificare l''implementazione.'
  - block_id: backbone-b660960aa
    type: paragraph
    content: <!-- Pagina PDF 18 -->
- section_id: sec-5b44cd1a
  heading: REQUISITI SOFTWARE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > REQUISITI SOFTWARE
  blocks:
  - block_id: backbone-b90c718d8
    type: paragraph
    content: 'I requisiti software rappresentano le descrizioni dei servizi che un
      sistema software deve fornire, insieme ai vincoli da rispettare durante il processo
      di sviluppo e nell''operatività del software stesso. Sono essenziali per comprendere
      le necessità degli utenti, guidare lo sviluppo e garantire che il sistema soddisfi
      le aspettative e i requisiti del cliente. Secondo la definizione dello standard
      IEEE Std 610.12 del 1990, i requisiti software possono essere visti come condizioni
      o capacità necessarie per risolvere un problema o raggiungere un obiettivo da
      parte dell''utente o come condizioni o capacità che devono essere soddisfatte
      o possedute da un sistema o componente di sistema per adempiere a un contratto,
      standard, specifica o altro documento formalmente imposto. I requisiti vengono
      generati attraverso il processo di ingegneria dei requisiti, che coinvolge la
      comprensione delle esigenze degli utenti, la loro traduzione in requisiti specifici
      e la documentazione di tali requisiti in modo accurato e completo. Tipi di Requisiti:'
  - block_id: backbone-bb5bd4154
    type: list
    content: '- **Requisiti Utente (User Requirements):** Questi requisiti sono descritti
      in linguaggio naturale e possono essere arricchiti con l''uso di diagrammi.
      Definiscono i servizi che il sistema deve fornire e i vincoli operativi. Sono
      scritti in collaborazione con il cliente e rappresentano la base per capire
      le aspettative dell''utente finale.

      - **Requisiti di Sistema (System Requirements):** Questi requisiti sono specificati
      in dettaglio attraverso un documento strutturato. Questo documento descrive
      in modo approfondito i servizi che il sistema software deve fornire. Il documento
      dei requisiti di sistema diventa una sorta di "contratto" tra il cliente e il
      fornitore, definendo in modo chiaro cosa il sistema dovrà realizzare. Definizioni:'
  - block_id: backbone-b8aaaa1f8
    type: list
    content: '- **Cliente (Customer, Client):** È la persona o l''organizzazione che
      paga per la fornitura del prodotto software. Il cliente stabilisce le esigenze
      e i requisiti del software.

      - **Fornitore (Supplier, Contractor):** È la persona o l''organizzazione che
      sviluppa il software per il cliente. Deve realizzare il software in linea con
      i requisiti stabiliti.

      - **Utente Finale (End-User):** È la persona che interagisce direttamente con
      il prodotto software. Non è necessariamente il cliente, ma è colui che userà
      effettivamente il sistema. Categorie di Requisiti:'
  - block_id: backbone-bbe723025
    type: list
    content: '- **Requisiti Funzionali:** Questi requisiti descrivono le funzionalità
      specifiche che il sistema software deve fornire. Si concentrano su cosa il sistema
      deve fare e come deve rispondere a determinati input o scenari.'
  - block_id: backbone-be3612fa0
    type: list
    content: '- Ad esempio, la fornitura di un visualizzatore per i documenti, la
      possibilità di effettuare ricerche e l''associazione di un identificatore unico
      a ciascun ordine.

      - **Requisiti Non Funzionali:** Questi requisiti descrivono le proprietà del
      sistema in relazione alle prestazioni, all''affidabilità, alla sicurezza e ad
      altre caratteristiche che non riguardano direttamente le funzionalità. Essi
      possono anche riguardare il processo di sviluppo, gli standard da seguire e
      le normative da rispettare.'
  - block_id: backbone-b2e67b0a7
    type: list
    content: '- Ad esempio, tempi di risposta specifici, conformità agli standard
      di progetto e restrizioni sulla divulgazione di informazioni personali.

      - **Requisiti di Dominio:** Questi requisiti derivano dal contesto applicativo
      specifico in cui il sistema verrà utilizzato. Possono includere requisiti funzionali
      e non funzionali correlati a normative, procedure o regolamenti specifici del
      dominio applicativo.'
  - block_id: backbone-ba5f7e4b2
    type: list
    content: '- Ad esempio, la conformità alle normative contabili o agli standard
      di interfaccia utente specifici per il dominio. In sintesi, le categorie di
      requisiti aiutano a organizzare e distinguere diverse tipologie di informazioni
      necessarie per la definizione e lo sviluppo di un sistema software. I requisiti
      funzionali definiscono ciò che il sistema farà, i requisiti non funzionali definiscono
      come lo farà e le proprietà del sistema, mentre i requisiti di dominio tengono
      conto delle caratteristiche specifiche dell''ambiente in cui il sistema verrà
      utilizzato. Classificazione dei Requisiti Non Funzionali:'
  - block_id: backbone-be97ef25b
    type: list
    content: '- **Requisiti di Performance:** Definiscono le prestazioni richieste
      dal sistema, come tempi di risposta, velocità di elaborazione o capacità di
      gestire un certo volume di dati.

      - **Requisiti di Sicurezza:** Riguardano la protezione dei dati, l''accesso
      autorizzato, l''integrità dei dati e la protezione da attacchi.

      - **Requisiti di Affidabilità:** Definiscono quanto il sistema deve essere affidabile,
      inclusa la capacità di evitare guasti o di recuperarsi da essi.

      - **Requisiti di Usabilità:** Si riferiscono all''esperienza dell''utente durante
      l''interazione con il sistema, come l''interfaccia utente intuitiva e la facilità
      d''uso.

      - **Requisiti di Compatibilità:** Definiscono la capacità del sistema di operare
      con altre applicazioni o piattaforme.'
  - block_id: backbone-bf84f2bd4
    type: paragraph
    content: <!-- Pagina PDF 19 -->
  - block_id: backbone-bf51272c0
    type: list
    content: '- **Requisiti di Scalabilità:** Indicano la capacità del sistema di
      adattarsi a un aumento del carico o dei dati senza perdita di prestazioni.

      - **Requisiti di Manutenibilità:** Definiscono quanto sia facile modificare,
      estendere o correggere il sistema nel tempo.

      - **Requisiti di Conformità:** Si riferiscono alla necessità di rispettare normative,
      leggi o standard specifici. Problemi con i Requisiti Software:'
  - block_id: backbone-b29de701d
    type: list
    content: '- **Ambiguità:** I requisiti possono essere interpretati in modi diversi
      da diverse parti interessate. Gli utenti e gli sviluppatori possono interpretare
      i requisiti in modi diversi, portando a risultati diversi.

      - **Incompletezza:** I requisiti potrebbero non includere tutte le caratteristiche
      necessarie, portando a mancanze nel sistema finale.

      - **Inconsistenza:** I requisiti potrebbero entrare in conflitto tra loro o
      contraddirsi, creando confusione e difficoltà nell''implementazione. Verificabilità
      dei Requisiti: I requisiti non funzionali devono essere espressi in modo misurabile
      e quantificabile per poter essere verificati. Ad esempio, l''espressione "easy-to-use"
      è troppo generica e difficile da verificare, mentre una misura come "il tempo
      di risposta deve essere inferiore a 2 secondi" è quantificabile e verificabile.'
- section_id: sec-081a57cd
  heading: DOCUMENTO DI SPECIFICA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DOCUMENTO DI SPECIFICA
  blocks:
  - block_id: backbone-b1cdad35f
    type: paragraph
    content: 'Il documento di analisi dei requisiti, spesso chiamato "documento di
      specifica", è un documento ufficiale che rappresenta un aspetto cruciale nella
      fase di sviluppo del software. Esso contiene una descrizione dettagliata delle
      caratteristiche e dei requisiti del sistema che deve essere sviluppato. È un
      punto di riferimento essenziale per i team di sviluppo, gli utenti finali e
      altre parti coinvolte nel processo di sviluppo. Il documento di specifica segue
      una struttura organizzata per assicurare chiarezza e coerenza. La struttura
      seguente è basata sullo standard IEEE 830-1998, "IEEE Recommended Practice for
      Software Requirements Specifications":'
  - block_id: backbone-b330378f9
    type: list
    content: '- **Prefazione:** Questa sezione include informazioni sul pubblico previsto
      per il documento, la cronologia delle versioni precedenti e un riepilogo delle
      modifiche effettuate.

      - **Introduzione:** Qui viene fornito uno scopo generale del sistema, una breve
      descrizione delle funzionalità principali e come il sistema interagisce con
      altri sistemi all''interno del contesto aziendale.

      - **Glossario:** Una raccolta di definizioni di termini tecnici utilizzati all''interno
      del documento per garantire una comprensione uniforme da parte di tutti i lettori.

      - **Definizione dei Requisiti Utente:** Questa sezione contiene i requisiti
      funzionali e non funzionali dal punto di vista degli utenti. Sono descritte
      le funzionalità che gli utenti si aspettano dal sistema.

      - **Architettura del Sistema:** Fornisce una panoramica ad alto livello dei
      componenti del sistema e della loro interazione.

      - **Specifiche dei Requisiti di Sistema:** Questa sezione dettaglia i requisiti
      funzionali e non funzionali del sistema. Definisce cosa il sistema deve fare
      e quali caratteristiche deve avere.

      - **Modelli del Sistema:** Descrive i modelli che rappresentano le relazioni
      tra i componenti del sistema e l''ambiente in cui opera.

      - **Evoluzione del Sistema:** Indica le supposizioni su cui si basa il sistema
      e le modifiche previste nel tempo, ad esempio, i cambiamenti nell''hardware
      o nelle esigenze degli utenti.

      - **Appendici:** Questa sezione può contenere informazioni specifiche relative
      all''applicazione in sviluppo, come descrizioni dettagliate dell''hardware o
      del database utilizzati.

      - **Indice:** Include una tabella dei contenuti, un indice alfabetico o altre
      indicazioni che facilitano la navigazione nel documento.'
  - block_id: backbone-b6dd89ccf
    type: paragraph
    content: <!-- Pagina PDF 20 -->
- section_id: sec-514dbab2
  heading: PROCESSO DI INGEGNERIA DEI REQUISITI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > PROCESSO DI INGEGNERIA DEI REQUISITI
  blocks:
  - block_id: backbone-be03a966f
    type: paragraph
    content: 'Il processo di ingegneria dei requisiti (requirements engineering) è
      una fase cruciale nello sviluppo del software in cui si raccolgono, analizzano
      e documentano le esigenze degli utenti e si traducono in requisiti chiari e
      dettagliati. Questo processo può variare in base al dominio applicativo, alle
      persone coinvolte e all''organizzazione che sviluppa il sistema software. Tuttavia,
      ci sono una serie di attività comuni a tutti i processi di ingegneria dei requisiti:'
  - block_id: backbone-b78670fa8
    type: list
    content: '- Studio di Fattibilità (Feasibility Study)

      - Identificazione e Analisi dei Requisiti (Requirements Elicitation and Analysis)

      - Specifica dei Requisiti (Requirements Specification)

      - Convalida dei Requisiti (Requirements Validation)

      - Gestione dei Requisiti (Requirements Management)'
- section_id: sec-81a28978
  heading: STUDIO DI FATTIBILITA’
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > STUDIO DI FATTIBILITA’
  blocks:
  - block_id: backbone-b05f5951b
    type: paragraph
    content: 'Lo studio di fattibilità è la fase iniziale del processo di ingegneria
      dei requisiti. Durante questa fase, vengono valutate le possibilità di sviluppo
      del sistema in base a considerazioni strategiche, tecniche ed economiche. Le
      informazioni necessarie per lo studio di fattibilità vengono raccolte attraverso
      colloqui con diverse parti coinvolte, tra cui client manager, esperti di settore,
      esperti tecnologici e utenti finali. Report di Fattibilità: Lo studio di fattibilità
      produce un report che fornisce un''analisi approfondita dell''opportunità di
      sviluppare il sistema software. Il report risponde a domande cruciali, come
      se il sistema contribuirà agli obiettivi strategici del cliente, se può essere
      sviluppato con le tecnologie e rispettando vincoli di tempo e costo, e se può
      essere integrato con altri sistemi esistenti.'
- section_id: sec-4e6b7842
  heading: ATTIVITA’ DI IDENTIFICAZIONE E ANALISI DEI REQUISITI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ATTIVITA’ DI IDENTIFICAZIONE E ANALISI DEI
    REQUISITI
  blocks:
  - block_id: backbone-b25d23451
    type: paragraph
    content: L'identificazione e l'analisi dei requisiti sono fondamentali nella fase
      di ingegneria dei requisiti e comportano la comprensione dettagliata delle esigenze
      degli utenti e la loro traduzione in requisiti specifici e chiari. Queste attività
      sono spesso svolte attraverso interazioni con il cliente e gli utenti finali,
      coinvolgendo vari ruoli all'interno e all'esterno dell'organizzazione.
  - block_id: backbone-bcb13d44b
    type: list
    content: '- **Comprensione del Dominio:** L''analista deve acquisire conoscenze
      approfondite sul dominio applicativo in cui il sistema sarà utilizzato. Questo
      può implicare la comprensione dei processi aziendali, delle esigenze degli utenti
      e delle sfide specifiche del settore.

      - **Raccolta dei Requisiti:** Gli stakeholder vengono coinvolti per identificare
      e definire i requisiti utente. Questo coinvolge interviste, sondaggi, workshop
      e altre tecniche per raccogliere informazioni dettagliate sulle esigenze.

      - **Classificazione:** I requisiti raccolti vengono suddivisi in gruppi logici
      e coerenti. Questo aiuta a organizzare i requisiti e a gestirli in modo più
      efficace.

      - **Risoluzione dei Conflitti:** Eventuali conflitti o contraddizioni tra requisiti
      vengono identificati e risolti. Questo assicura che i requisiti siano coerenti
      e allineati tra loro.

      - **Assegnazione delle Priorità:** Gli stakeholder assegnano priorità ai requisiti
      in base all''importanza e all''urgenza. Questo aiuta a stabilire quali requisiti
      devono essere soddisfatti prima.

      - **Verifica dei Requisiti:** I requisiti vengono controllati per assicurarsi
      che siano completi, non ambigui e coerenti. Ciò include anche la verifica che
      soddisfino le esigenze degli stakeholder. Tecniche di Identificazione dei Requisiti:'
  - block_id: backbone-b12b4f7ff
    type: list
    content: '- **Ethnography:** Un metodo che coinvolge l''osservazione diretta e
      l''interazione con gli utenti per comprendere le loro esigenze e il contesto
      in cui operano.

      - **Casi d''Uso (Basati su Scenari):** Scenari dettagliati di come il sistema
      verrà utilizzato, aiutando a identificare i requisiti funzionali.

      - **Prototipazione:** Creazione di prototipi di parti del sistema per mostrare
      agli utenti e ai clienti potenziali funzionalità e interazioni, raccogliendo
      feedback per definire meglio i requisiti. Tecniche di Analisi dei Requisiti:'
  - block_id: backbone-b19db8179
    type: list
    content: '- Semi-formali, basate su modelli del sistema e usate dai metodi di
      analisi strutturata o analisi orientata agli oggetti

      - Formali (basate su Petri Net, FSM, Z, etc.)'
  - block_id: backbone-bcb211adf
    type: paragraph
    content: <!-- Pagina PDF 21 -->
- section_id: sec-8e4df203
  heading: CONVALIDA DEI REQUISITI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CONVALIDA DEI REQUISITI
  blocks:
  - block_id: backbone-b496d4529
    type: paragraph
    content: 'La convalida dei requisiti è una fase cruciale nella fase di ingegneria
      dei requisiti. L''obiettivo principale è verificare se il documento dei requisiti,
      derivato dall''analisi, rappresenta correttamente le aspettative del cliente
      e se contiene requisiti chiari, completi e coerenti. Scoprire errori in questa
      fase è essenziale per evitare costosi rework e problemi nelle fasi successive
      del ciclo di vita del progetto. Controlli da Effettuare:'
  - block_id: backbone-bdc8475ae
    type: list
    content: '- **Validità:** I requisiti devono rappresentare correttamente le esigenze
      degli stakeholder e del cliente. Devono rispondere alle vere necessità e obiettivi.

      - **Consistenza:** I requisiti non devono entrare in conflitto tra loro o contraddirsi.
      Devono essere armoniosi e in accordo tra loro.

      - **Completezza:** Tutti gli aspetti rilevanti del sistema devono essere coperti
      dai requisiti. Non dovrebbero esserci omissioni significative.

      - **Realizzabilità:** I requisiti devono essere tecnologicamente fattibili e
      realizzabili entro i vincoli del progetto.

      - **Verificabilità:** Deve essere possibile verificare se i requisiti sono stati
      soddisfatti attraverso test e altre attività di verifica. Tecniche di Convalida
      dei Requisiti:'
  - block_id: backbone-beeeba1c6
    type: list
    content: '- **Revisioni Informali:** Incontri informali in cui gli stakeholder
      esaminano il documento dei requisiti e forniscono feedback.

      - **Revisioni Formali:** Processi strutturati di revisione che includono walkthrough*
      e ispezioni per analizzare in modo dettagliato il documento dei requisiti.

      - **Prototipazione:** Creazione di prototipi di parti del sistema per ottenere
      feedback dagli utenti e dai clienti sulla correttezza dei requisiti.

      - **Generazione dei Test-Case:** Sviluppo di casi di test che riflettono i requisiti.
      La loro generazione può evidenziare eventuali ambiguità o mancanze.

      - **Analisi di Consistenza Automatizzata:** Per requisiti formali, possono essere
      utilizzati strumenti di analisi formale per verificare la consistenza e la correttezza
      dei requisiti. *Un walkthrough è un processo in cui un gruppo di persone, come
      sviluppatori, tester o stakeholder, esaminano attentamente un prodotto, un documento
      o una parte del progetto per identificare errori, problemi o miglioramenti potenziali.*'
- section_id: sec-64ea04b4
  heading: GESTIONE DEI REQUISITI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > GESTIONE DEI REQUISITI
  blocks:
  - block_id: backbone-b2ea86549
    type: paragraph
    content: 'La gestione dei requisiti è un processo di identificazione e controllo
      delle modifiche che i requisiti subiscono durante il ciclo di vita del progetto.
      I requisiti di un sistema possono possono essere classificati in base alla loro
      evoluzione:'
  - block_id: backbone-b15a02079
    type: list
    content: '- **Requisiti stabili:** Sono i requisiti che hanno una bassa probabilità
      di subire modifiche nel tempo. Questi sono spesso i requisiti principali e fondamentali
      che non dovrebbero cambiare frequentemente.

      - **Requisiti volatili:** Sono i requisiti che hanno una probabilità elevata
      di subire modifiche nel tempo. Questi possono essere ulteriormente suddivisi
      in:'
  - block_id: backbone-b6a42ab1a
    type: list
    content: '- **Mutabili:** Le modifiche sono legate a cambiamenti nell''ambiente
      operativo, come nuovi requisiti legali o normativi.

      - **Emergenti:** Le modifiche sono causate da una migliore comprensione del
      sistema software, poiché il team acquisisce una visione più chiara delle esigenze
      degli utenti o dei dettagli tecnici.

      - **Consequenziali:** Le modifiche sono legate all''introduzione di sistemi
      informatici nel flusso di lavoro aziendale, che richiedono adeguamenti nel sistema
      software.

      - **Di compatibilità:** Le modifiche sono legate a cambiamenti nei sistemi e
      nei processi aziendali, che possono richiedere modifiche per garantire che il
      sistema software rimanga compatibile con l''ambiente circostante. Gestione delle
      Modifiche di Requisiti: Le modifiche dei requisiti vanno opportunamente pianificate
      mediante:'
  - block_id: backbone-bee056a25
    type: list
    content: '- **Identificazione Univoca dei Requisiti:** Ciascun requisito deve
      avere un''identificazione univoca per semplificare la tracciabilità e il controllo
      delle modifiche.

      - **Gestione delle Modifiche:** Le modifiche vanno gestite in modo strutturato,
      includendo analisi dei costi, analisi dell''impatto e analisi della realizzazione.

      - **Politiche di Tracciabilità:** Deve essere possibile tracciare le relazioni
      tra i requisiti e tra i requisiti e il progetto software. Ciò aiuta a capire
      come le modifiche influenzano l''intero sistema.

      - **Uso di Tool CASE:** Strumenti di ingegneria del software (CASE) possono
      essere utilizzati per supportare la gestione delle modifiche, tracciabilità
      e controllo dei requisiti nel ciclo di vita del progetto.'
  - block_id: backbone-b7baad17e
    type: paragraph
    content: <!-- Pagina PDF 22 -->
- section_id: sec-ec79a8e2
  heading: SPECIFICHE FORMALI VS INFORMALI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SPECIFICHE FORMALI VS INFORMALI
  blocks:
  - block_id: backbone-ba7164bbf
    type: paragraph
    content: 'Le specifiche dei requisiti possono essere espresse sia in forma formale
      che informale. Ogni approccio ha vantaggi e svantaggi, a seconda delle esigenze
      del progetto e delle preferenze dell''organizzazione. Ecco una panoramica delle
      due approcci:'
  - block_id: backbone-b9f423034
    type: paragraph
    content: '|  | INFORMALI | FORMALI |

      | --- | --- | --- |

      | VANTAGGI |  Facili da comprendere per gli stakeholder non tecnici.  Flessibilità
      nell''espressione dei requisit.i  Facilitano la comunicazione diretat con gli
      utenti e il cliente.  Semplici da scrivere e da interpretare inizialmente.
      |  Elevato grado di precisione e detatglio.  Riducono l''ambiguità e le interpretazioni
      diverse.  Supportano l''analisi formale e l''automazione della verifica. 
      Adatet per sistemi critici o complessi. |

      | SVANTAGGI |  Possono essere ambigue o soggetet a interpretazioni diverse.
       Manca di precisione matematica e detatglio tecnico.  Non è adatat per requisit
      icomplessi che richiedono chiarezza assoluta. |  Potrebbero essere difcfiili
      da comprendere per gli stakeholder non tecnici.  Richiedono competenze specializzate
      per la scrittura e l''interpretazione.  Potrebbero richiedere più tempo per
      essere create e gestite. |'
- section_id: sec-782eeb46
  heading: SPECIFICHE FORMALI CON PETRI NET
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SPECIFICHE FORMALI CON PETRI NET
  blocks:
  - block_id: backbone-bc9f5a75c
    type: paragraph
    content: 'Le reti di Petri sono un modello matematico e grafico utilizzato per
      descrivere sistemi concorrenti*. Sono costituite da i seguenti elementi principali:

      - **Posti:** I posti rappresentano le condizioni o gli stati in cui può trovarsi
      un sistema. Possono contenere un certo numero di "gettoni" che rappresentano
      risorse, oggetti o stato.

      - **Transizioni:** Le transizioni rappresentano gli eventi o le azioni che possono
      verificarsi all''interno del sistema. Per attivare una transizione, i posti
      devono contenere abbastanza gettoni per soddisfare i "pre-requisiti" di attivazione
      della transizione.

      - **Archi:** Gli archi collegano i posti alle transizioni e viceversa. Gli archi
      indicano il flusso dei gettoni tra posti e transizioni, determinando quale condizione
      deve essere soddisfatta per attivare una transizione. Le reti di Petri possono
      essere rappresentate graficamente attraverso diagrammi in cui i posti sono rappresentati
      da cerchi, le transizioni da rettangoli e gli archi da frecce. * I sistemi concorrenti,
      anche noti come sistemi paralleli, sono sistemi informatici o reali in cui diverse
      attività, processi o entità vengono eseguiti simultaneamente o in parallelo.
      Questi sistemi gestiscono più attività contemporaneamente, consentendo loro
      di condividere risorse, lavorare insieme o agire indipendentemente.* Le specifiche
      formali con le reti di Petri implicano l''utilizzo delle reti di Petri come
      strumento per descrivere e definire in modo preciso il comportamento di un sistema.
      Questo approccio consente di rappresentare il funzionamento del sistema in modo
      dettagliato e accurato, fornendo una base per l''analisi, la verifica e la simulazione
      delle proprietà del sistema stesso. Marked Petri Net: Una Marked Petri Net (rete
      di Petri marcata) è un tipo di rete di Petri che incorpora il concetto di "marcature".
      Le marcature rappresentano l''assegnazione di "gettoni" (di solito rappresentati
      come punti) ai posti all''interno della rete di Petri. Questi gettoni indicano
      la presenza di risorse, dati o lo stato del sistema in un determinato momento.
      In una Marked Petri Net:'
  - block_id: backbone-b643b3e3a
    type: list
    content: '- **Posti:** Rappresentano condizioni, stati o posizioni nel sistema.
      Ogni posto può contenere un certo numero di gettoni (marcature), che simboleggiano
      risorse o oggetti.

      - **Transizioni:** Rappresentano eventi, azioni o processi che possono verificarsi
      nel sistema. Le transizioni vengono attivate quando hanno il numero necessario
      di gettoni nei posti di input.

      - **Archetti:** Collegano posti a transizioni e transizioni a posti. Indicano
      il flusso dei gettoni e stabiliscono le condizioni necessarie affinché una transizione
      possa scattare.'
  - block_id: backbone-b8a51e790
    type: paragraph
    content: <!-- Pagina PDF 23 -->
  - block_id: backbone-b1410f97b
    type: list
    content: '- **Marcature:** Una marcatura è una distribuzione specifica di gettoni
      tra i posti nella Rete di Petri. Rappresenta lo stato attuale del sistema. Le
      marcature cambiano quando le transizioni vengono attivate, i gettoni vengono
      consumati e ne vengono creati di nuovi. Le Marked Petri Nets sono utili per
      comprendere la concorrenza, l''allocazione di risorse, la sincronizzazione e
      i potenziali punti critici nei sistemi. Sono particolarmente utili quando si
      vuole studiare come i gettoni si spostano attraverso una rete di posti e transizioni
      e come il sistema reagisce a diverse sequenze di eventi.'
- section_id: sec-daa5a3e4
  heading: SPECIFICHE FORMALI CON FINITE STATE MACHINE (FSM)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SPECIFICHE FORMALI CON FINITE STATE MACHINE
    (FSM)
  blocks:
  - block_id: backbone-ba0dfd90e
    type: paragraph
    content: Le Finite State Machine (FSM), o Macchine a Stati Finiti, sono un modello
      matematico utilizzato per rappresentare il comportamento di sistemi che possono
      trovarsi in uno dei diversi stati finiti. In questo contesto, le FSM possono
      essere utilizzate per esprimere specifiche formali dei requisiti in modo preciso.
      Nel contesto delle specifiche formali, una FSM può essere utilizzata per rappresentare
      il comportamento di un sistema attraverso gli stati che può assumere e le transizioni
      tra di essi. Ogni stato rappresenta una condizione specifica del sistema, mentre
      le transizioni rappresentano gli eventi o le azioni che causano il passaggio
      da uno stato all'altro. Le FSM possono essere utilizzate per specificare sequenze
      di azioni, condizioni di errore e comportamenti del sistema in modo dettagliato.
- section_id: sec-c9754321
  heading: SPECIFICHE FORMALI CON LINGUAGGIO Z
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SPECIFICHE FORMALI CON LINGUAGGIO Z
  blocks:
  - block_id: backbone-b379cd754
    type: paragraph
    content: Il linguaggio Z è un linguaggio formale basato sulla logica dei predicati
      del primo ordine e utilizzato per la specifica formale dei requisiti e il design
      di sistemi software. Il linguaggio Z è noto per la sua capacità di esprimere
      specifiche in modo preciso e non ambiguo, consentendo la rappresentazione formale
      di proprietà del sistema. È ampiamente utilizzato nell'ingegneria del software
      per specificare i requisiti dei sistemi, modellare il loro comportamento e verificare
      le proprietà desiderate. Le specifiche formali con il linguaggio Z sono un modo
      per descrivere in modo preciso e rigoroso i requisiti e il comportamento di
      un sistema utilizzando la notazione matematica del linguaggio Z. Queste specifiche
      consentono di eliminare ambiguità, fraintendimenti e interpretazioni erronee
      durante lo sviluppo e la verifica dei sistemi.
- section_id: sec-b95a43c1
  heading: 'SPECIFICHE SEMI-FORMALI: MODELLI DEL SISTEMA'
  level: 2
  heading_path: 'INGEGNERIA DEL SOFTWARE > SPECIFICHE SEMI-FORMALI: MODELLI DEL SISTEMA'
  blocks:
  - block_id: backbone-b3fc090d1
    type: paragraph
    content: 'Le specifiche semi-formali rappresentano un approccio intermedio tra
      le specifiche informali e quelle completamente formali. Queste specifiche utilizzano
      modelli astratti per descrivere le proprietà e il comportamento di un sistema
      software in un modo più strutturato rispetto alle specifiche informali, ma meno
      rigoroso delle specifiche completamente formali. I modelli del sistema vengono
      utilizzati per rappresentare diverse prospettive e aspetti del sistema stesso.
      Un modello del sistema è una rappresentazione astratta del sistema software
      che si intende sviluppare. Questo modello cattura le caratteristiche essenziali
      del sistema, come le sue funzioni, il comportamento e le interazioni con l''ambiente.
      L''uso di modelli dei sistemi software è formalizzato all''interno di metodi
      di analisi dei requisiti (specifica) del software che fanno uso di tecniche
      semi-formali. Esistono diversi approcci per analizzare i requisiti del software.
      Alcuni sono orientati alle procedure (analisi strutturata), mentre altri si
      basano sull''orientamento agli oggetti (analisi orientata agli oggetti). Per
      ottenere una comprensione completa di un sistema, è spesso necessario creare
      diversi modelli che rappresentano il sistema da diversi punti di vista. Questi
      possono includere la rappresentazione delle informazioni, delle funzioni e del
      comportamento dinamico. Tipi di Modelli del Sistema: Per descrivere la specifica
      semi-formale di un sistema software si usano 3 tipi di modelli:'
  - block_id: backbone-bd76f0b18
    type: list
    content: '- **Modello dei Dati:** Questo modello rappresenta gli aspetti statici
      e strutturali dei dati all''interno del sistema. Include entità, attributi,
      relazioni e strutture dati. I modelli dei dati sono utilizzati per definire
      i requisiti relativi ai dati e alla loro organizzazione.'
  - block_id: backbone-bbaf52978
    type: list
    content: '- **Esempi:** Entity-Relationship Diagrams (ERD), Class Diagrams (UML).

      - **Modello Comportamentale:** Questo modello rappresenta gli aspetti funzionali
      e comportamentali del sistema, descrivendo come il sistema interagisce con gli
      utenti e come le diverse parti del sistema interagiscono tra loro.'
  - block_id: backbone-b41463a62
    type: list
    content: '- **Esempi:** Data Flow Diagrams (DFD), Use Case Diagrams, Activity
      Diagrams, Interaction Diagrams (UML).

      - **Modello Dinamico:** Questo modello rappresenta gli aspetti dinamici del
      sistema, cioè come il sistema cambia e reagisce alle varie condizioni e eventi.
      È utilizzato per descrivere lo stato e il comportamento del sistema nel tempo.'
  - block_id: backbone-b82ca9f01
    type: list
    content: '- **Esempi:** State Diagrams (UML).'
  - block_id: backbone-b0e40903a
    type: paragraph
    content: <!-- Pagina PDF 24 -->
- section_id: sec-8e031e30
  heading: ENTITY RELATIONSHIP DIAGRAM (ERD)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ENTITY RELATIONSHIP DIAGRAM (ERD)
  blocks:
  - block_id: backbone-b4a6d02db
    type: paragraph
    content: 'L''Entity Relationship Diagram (ERD) è un tipo di diagramma utilizzato
      per rappresentare graficamente le relazioni tra le entità in un sistema o in
      un database. Gli ERD sono comunemente utilizzati nel contesto della progettazione
      dei database per visualizzare come le diverse tabelle (enti) sono collegate
      tra loro attraverso le relazioni. Gli ERD sono costituiti da tre componenti
      principali: entità, attributi e relazioni.'
  - block_id: backbone-b7eac959c
    type: list
    content: '- **Relazioni Uno-a-Molti:** Questa relazione indica che ogni istanza
      dell''entità da un lato può essere associata a molte istanze dell''entità dall''altro
      lato, ma ogni istanza dell''entità dall''altro lato è associata solo a un''istanza
      dell''entità da un lato.

      - **Relazioni Molti-a-Molti:** Questa relazione indica che molte istanze dell''entità
      da un lato possono essere associate a molte istanze dell''entità dall''altro
      lato. Spesso, nelle implementazioni reali, le relazioni molti-a-molti vengono
      gestite attraverso l''introduzione di una terza tabella (detta tabella di giunzione
      o tabella di associazione) per gestire l''associazione tra le entità.'
- section_id: sec-b9a2360a
  heading: DATA FLOW DIAGRAM (DFD)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DATA FLOW DIAGRAM (DFD)
  blocks:
  - block_id: backbone-b9f4e88e7
    type: paragraph
    content: 'I Data Flow Diagram (DFD) sono strumenti grafici utilizzati per rappresentare
      visivamente il flusso dei dati attraverso un sistema o un processo. Sono spesso
      utilizzati nell''analisi dei sistemi e nell''ingegneria del software per modellare
      come i dati vengono acquisiti, elaborati, trasformati e distribuiti all''interno
      di un sistema. I DFD sono costituiti da quattro elementi principali:

      - **Processi:** Sono le attività o le operazioni che trasformano i dati. I processi
      sono rappresentati da cerchi o rettangoli con una descrizione breve del loro
      scopo.

      - **Flussi di dati:** Sono le frecce che rappresentano il movimento dei dati
      tra i processi, gli entità esterne e i depositi dei dati. I flussi di dati indicano
      il percorso dei dati e spesso sono etichettati con il nome del dato.

      - **Entità esterne:** Rappresentano le fonti o le destinazioni dei dati esterne
      al sistema in esame. Possono essere altre applicazioni, utenti, database, ecc.

      - **Depositi dati:** Sono le posizioni in cui i dati vengono memorizzati. Questi
      possono essere database, file o altre forme di archiviazione dei dati. I DFD
      sono utili per comprendere il flusso dei dati all''interno di un sistema, identificare
      aree di miglioramento, individuare potenziali problemi di progettazione e stabilire
      una base per la progettazione e lo sviluppo successivo. Sono particolarmente
      efficaci per modellare sistemi complessi in modo chiaro e strutturato.'
  - block_id: backbone-b0d9bf4bf
    type: list
    content: '- **Primo Raffinamento:** Nei DFD, il primo raffinamento comporta la
      suddivisione dei processi di alto livello in processi più dettagliati. Questo
      livello di raffinamento mostra come i processi principali vengono suddivisi
      in sotto-processi più piccoli e dettagliati. Questo aiuta a definire meglio
      le attività che avvengono all''interno del sistema.

      - **Secondo Raffinamento:** Nel secondo raffinamento, i sotto-processi ottenuti
      dal primo raffinamento vengono ulteriormente suddivisi in attività più dettagliate.
      Questo livello di dettaglio aiuta a definire con precisione le operazioni che
      avvengono all''interno di ogni processo.'
- section_id: sec-33b4f4f7
  heading: STRUCTURED SYSTEM ANALYSIS (SSA)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > STRUCTURED SYSTEM ANALYSIS (SSA)
  blocks:
  - block_id: backbone-b25ae7d6d
    type: paragraph
    content: 'L''Analisi Strutturata dei Sistemi (Structured System Analysis - SSA)
      è un metodo di analisi strutturata introdotto da Gane e Sarson nel 1979. Questo
      metodo è progettato per analizzare e progettare sistemi complessi suddividendoli
      in componenti più piccole. L''approccio di SSA prevede un processo graduale
      di perfezionamento, in cui ogni passaggio affina l''analisi e la progettazione
      del sistema. Ecco una panoramica dei 9 passaggi coinvolti nel metodo SSA:'
  - block_id: backbone-beb126f16
    type: list
    content: 1. Disegnare il Diagramma di Flusso dei Dati (DFD)
  - block_id: backbone-b59fef15a
    type: paragraph
    content: 'a. Identificare flussi di dati, fonti, destinazioni e processi in base
      ai requisiti. b. Perfezionare il DFD aggiungendo nuovi flussi di dati e dettagli
      ai flussi esistenti.

      2. Decidere Quali Sezioni Computerizzare e Come'
  - block_id: backbone-be2ee358d
    type: paragraph
    content: 'a. Utilizzare l''analisi costo-beneficio per determinare quali sezioni
      del DFD automatizzare. b. Decidere tra operazioni batch* ed elaborazione online*.

      3. Determinare i Dettagli dei Flussi di Dati'
  - block_id: backbone-be39482e6
    type: paragraph
    content: 'a. Specificare elementi dati per ogni flusso di dati e perfezionarli
      passo dopo passo.

      4. Definire la Logica dei Processi'
  - block_id: backbone-b3533214e
    type: paragraph
    content: 'a. Definire la logica dei processi utilizzando tecniche come gli alberi
      decisionali.

      5. Determinare i Depositi di Dati'
  - block_id: backbone-b4f9fe18a
    type: paragraph
    content: 'a. Definire il contenuto di ciascun deposito di dati e la sua rappresentazione.
      b. Specificare livelli di accesso dati usando un diagramma di accesso immediato
      ai dati (DIAD).

      6. Definire le Risorse Fisiche'
  - block_id: backbone-b997f2634
    type: paragraph
    content: a. Specificare l'organizzazione e la struttura di file, supporti di archiviazione
      e tabelle di database.
  - block_id: backbone-b9ed8b878
    type: paragraph
    content: <!-- Pagina PDF 25 -->
  - block_id: backbone-b80339eba
    type: list
    content: 7. Determinare le Specifiche di Input/Output
  - block_id: backbone-bc6bbd5a7
    type: paragraph
    content: 'a. Specificare moduli di input, schermate di output e dettagli delle
      stampe.

      8. Determinare le Dimensioni'
  - block_id: backbone-bec9d3919
    type: paragraph
    content: 'a. Calcolare il volume di input, la frequenza dei report, le dimensioni
      dei record e dei file.

      9. Determinare i Requisiti Hardware'
  - block_id: backbone-b376eb094
    type: paragraph
    content: 'a. Determinare le necessità di archiviazione massiva, i requisiti di
      backup, le caratteristiche dei terminali e altro. b. Valutare l''hardware esistente
      e stimare i costi per il nuovo hardware. * Le operazioni in batch (batch operations)
      si riferiscono a un metodo di elaborazione in cui un gruppo di attività o operazioni
      viene raccolto ed eseguito insieme in un''unica sequenza, senza intervento diretto
      dell''utente. L''elaborazione online (on-line processing) si riferisce all''esecuzione
      immediata di operazioni in risposta alle azioni dell''utente o agli eventi del
      sistema. In questo caso, l''utente interagisce direttamente con il sistema e
      ottiene una risposta immediata dopo aver inviato un''operazione o un''azione.*
      Output di SSA: Il risultato del processo SSA è un documento di specifica dettagliato
      che delinea la progettazione e i requisiti del sistema. Una volta approvato
      dal cliente, questo documento viene consegnato al team di progettazione per
      procedere con lo sviluppo del software. Limitazioni di SSA: Nonostante fornisca
      un approccio strutturato all''analisi e alla progettazione, SSA ha limitazioni:'
  - block_id: backbone-b08202de3
    type: list
    content: '- Non può determinare con precisione i tempi di risposta o le dimensioni
      della CPU.

      - Gli aspetti di tempistica e prestazioni non sono affrontati con precisione.'
