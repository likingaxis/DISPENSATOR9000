- section_id: sec-e543ad75
  heading: GESTIONE DI PROGETTI SOFTWARE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > GESTIONE DI PROGETTI SOFTWARE
  blocks:
  - block_id: backbone-bbf43340d
    type: paragraph
    content: 'La gestione di progetti software è un''attività fondamentale nel processo
      di sviluppo di software. Lo sviluppo di un prodotto software è un''operazione
      complessa che coinvolge molte persone, processi e risorse. La gestione di un
      progetto software implica la pianificazione, il monitoraggio e il controllo
      di tutte queste componenti durante l''intero ciclo di vita del progetto, dall''inizio
      alla consegna del software finito. Il Software Project Management Plan (SPMP)
      è un documento chiave in questo contesto. Esso guida la gestione del progetto
      software, definendo obiettivi, vincoli, risorse disponibili, pianificazione
      delle attività e le responsabilità dei membri del team. Le quattro "P" nella
      gestione di progetti software: La gestione efficace di un progetto software
      si basa su quattro aspetti chiave, spesso chiamati "quattro P":'
  - block_id: backbone-b8efad207
    type: list
    content: '- **Persone:** Le persone sono l''elemento più importante in un progetto
      software di successo. La gestione delle risorse umane è fondamentale per assegnare
      ruoli e responsabilità ai membri del team, garantendo che abbiano le competenze
      necessarie e motivandoli per ottenere risultati di alta qualità. La gestione
      delle persone è spesso basata su modelli come il "People Management - Capability
      Maturity Model".

      - **Prodotto:** Questo riguarda l''identificazione delle caratteristiche del
      software da sviluppare. Questo include definire obiettivi, specifiche di dati,
      funzionalità, comportamenti principali, alternative e vincoli tecnici o di progetto.

      - **Processo:** Questo riguarda la definizione del quadro di riferimento all''interno
      del quale viene pianificato e sviluppato il prodotto software. In altre parole,
      si tratta di stabilire il metodo e le pratiche di sviluppo che saranno utilizzate
      per raggiungere gli obiettivi del progetto.

      - **Progetto:** Questo riguarda l''organizzazione e la pianificazione delle
      attività specifiche necessarie per sviluppare il software. Questo include l''allocazione
      delle risorse, la definizione dei compiti, la stima dei tempi e dei costi, e
      il monitoraggio costante del progresso. L''organizzazione dei team è un aspetto
      critico della gestione di progetti software. È importante assegnare il lavoro
      in modo efficiente, tenendo conto delle capacità e delle interazioni tra i membri
      del team. L''obiettivo è ottenere il miglior risultato possibile in termini
      di qualità e tempistiche, evitando ritardi dovuti a eccessive interazioni o
      alla mancanza di competenze specifiche. La legge di Brooks sottolinea che l''aggiunta
      di più risorse in un progetto non sempre accelererà lo sviluppo e potrebbe persino
      ritardarlo a causa delle complessità aggiuntive. Pianificazione di progetti
      software: La pianificazione dei progetti software è un processo chiave nell''ambito
      della gestione dei progetti software. Il suo obiettivo è fornire un quadro di
      riferimento che consenta di controllare, determinare l''avanzamento e monitorare
      lo sviluppo del progetto software. Questo processo è motivato dalla necessità
      di sviluppare prodotti software nei tempi e nei costi previsti, rispettando
      al contempo i requisiti di qualità desiderati. Le componenti fondamentali della
      pianificazione dei progetti software includono:'
  - block_id: backbone-b075832ee
    type: list
    content: '- **Scoping (raggio d''azione):** Questo step consiste nell''acquisire
      una comprensione completa del problema da risolvere e del lavoro da svolgere.
      È fondamentale definire chiaramente l''ambito del progetto per evitare cambiamenti
      e allargamenti eccessivi durante lo sviluppo.

      - **Stime:** Durante questa fase, vengono previsti tempi, costi e sforzi necessari
      per completare il progetto. Queste stime servono come base per la pianificazione
      delle risorse e per valutare la fattibilità del progetto.

      - **Rischi:** È importante identificare i rischi potenziali associati al progetto
      software e definire strategie per gestirli. La gestione dei rischi aiuta a prevenire
      problemi imprevisti che potrebbero causare ritardi o costi aggiuntivi.

      - **Schedule:** Questa parte della pianificazione coinvolge l''allocazione delle
      risorse disponibili e la definizione dei punti di controllo temporali nel progetto.
      La creazione di una timeline chiara aiuta a monitorare l''andamento del progetto.

      - **Strategia di controllo:** Qui si stabilisce un quadro di riferimento per
      il controllo della qualità e il controllo dei cambiamenti nel corso del progetto.
      È importante garantire che il prodotto software mantenga gli standard di qualità
      desiderati e che i cambiamenti vengano gestiti in modo controllato per evitare
      impatti negativi sul progetto.'
- section_id: sec-5e35c1a1
  heading: STIME NEI PROGETTI SOFTWARE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > STIME NEI PROGETTI SOFTWARE
  blocks:
  - block_id: backbone-b1c97c04c
    type: paragraph
    content: 'Le stime nei progetti software sono un aspetto fondamentale della pianificazione
      e della gestione dei progetti. L''obiettivo principale delle stime di tempi,
      costi ed effort è ridurre al minimo l''incertezza e limitare i rischi associati
      a una stima errata. Ci sono diverse tecniche utilizzate per migliorare l''affidabilità
      e l''accuratezza delle stime nei progetti software:'
  - block_id: backbone-b78ec7b28
    type: list
    content: '- **Stime basate su progetti simili (Expert Judgment by Analogy):**
      Questa tecnica si basa sull''esperienza di esperti nel settore. Gli esperti
      confrontano il progetto attuale con progetti simili già completati in passato
      e utilizzano queste analogie per effettuare stime. Questo metodo è utile quando
      ci sono progetti precedenti con caratteristiche simili che possono servire da
      punto di riferimento.'
  - block_id: backbone-bb6d2f075
    type: paragraph
    content: <!-- Pagina PDF 42 -->
  - block_id: backbone-b81a0949e
    type: list
    content: '- **Tecniche di scomposizione (Approccio bottom-up):** Queste tecniche
      coinvolgono la suddivisione del progetto in componenti più piccole, come task
      o funzioni, e la stima di allocazione dell''effort per ciascuna componente.
      Le stime possono basarsi su metriche come il numero di righe di codice (LOC)
      o i Function Point (FP) per valutare la complessità e l''effort richiesto per
      ciascuna parte del progetto. Questo approccio è particolarmente utile per progetti
      complessi e dettagliati.

      - **Modelli algoritmici empirici:** Queste tecniche di stima si basano su dati
      storici raccolti da progetti software precedenti. I modelli utilizzano relazioni
      matematiche tra variabili indipendenti (come LOC o FP stimati) e la variabile
      da stimare (come l''effort, il costo o la durata del progetto). Un esempio comune
      è il modello COCOMO (COnstructive COst MOdel) che utilizza LOC stimati per calcolare
      il costo e l''effort.'
- section_id: sec-2a41a3a7
  heading: FUNCTION POINT - FP
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > FUNCTION POINT - FP
  blocks:
  - block_id: backbone-b2da02503
    type: paragraph
    content: 'I Function Point (FP) sono una misura ponderata della funzionalità del
      software proposta da Albrecht negli anni ''70 e ''80. I Function Point misurano
      la quantità di funzionalità in un sistema software basandosi sulla specifica
      del sistema (stima prima dell''implementazione effettiva del software). Il calcolo
      dei Function Point avviene in due fasi principali:'
  - block_id: backbone-b2bc5e98b
    type: list
    content: '- **Calcolo dell''Unadjusted Function Point Count (UFC):** Questa fase
      coinvolge il conteggio delle diverse categorie di dati e transazioni presenti
      nel sistema software.

      - **Moltiplicazione dell''UFC per un Technical Complexity Factor (TCF):** Una
      volta calcolato l''UFC, viene applicato un fattore di complessità tecnica per
      riflettere la complessità aggiuntiva del sistema. Questo fattore considera vari
      aspetti come la complessità dell''architettura, la performance, l''usabilità
      e altri fattori tecnici che influenzano la complessità complessiva del progetto.
      Il risultato finale, il Function Point (FP), è ottenuto moltiplicando l''UFC
      per il TCF: FP = UFC × TCF Categorie di conteggio dei dati (UFC):'
  - block_id: backbone-bccc8f228
    type: list
    content: '- **Internal Logical Files (ILF):** Questi rappresentano gruppi di dati
      o informazioni di controllo generate, utilizzate o mantenute dal sistema software
      stesso.

      - **External Interface Files (EIF):** Questi rappresentano gruppi di dati o
      informazioni di controllo condivise o scambiate tra applicazioni, inclusi gli
      input e gli output provenienti da altre applicazioni o sistemi. Categorie di
      conteggio delle transazioni (TCF):'
  - block_id: backbone-b0e737777
    type: list
    content: '- **External Inputs (EI):** Questi rappresentano gli elementi forniti
      dall''utente che descrivono dati orientati all''applicazione, informazioni di
      controllo o output di altri sistemi che entrano in un''applicazione e cambiano
      lo stato dei suoi file logici interni.

      - **External Outputs (EO):** Questi rappresentano tutti i dati o le informazioni
      di controllo unici prodotti dal sistema software, ad esempio rapporti e messaggi.

      - **External Inquiries (EQ):** Questi rappresentano tutte le combinazioni uniche
      di input/output, in cui un input genera un output immediato senza cambiare lo
      stato dei file logici interni. Il calcolo del Technical Complexity Factor (TCF)
      coinvolge l''assegnazione di un valore numerico a ciascuno dei 14 fattori di
      degree of influence, in base al grado di influenza che hanno sul progetto software.
      Questi valori numerici variano da 0 (nessuna influenza) a 5 (influenza essenziale).
      Una volta assegnati i valori, si può calcolare il TCF sommando questi valori.'
  - block_id: backbone-be4fb53a7
    type: list
    content: '1. Affidabile backup e ripristino

      2. Comunicazione dati

      3. Elaborazione dati distribuita

      4. Prestazioni

      5. Configurazione ad utilizzo intensivo

      6. Inserimento dati online

      7. Facilità operativa

      8. Aggiornamento online

      9. Interfaccia complessa

      10. Elaborazione complessa

      11. Riutilizzabilità

      12. Facilità di installazione

      13. Siti multipli

      14. Agevolare il cambiamento

      Una volta assegnati i valori a ciascun fattore, si sommano per ottenere il TCF.'
  - block_id: backbone-b5b21ae6b
    type: paragraph
    content: ଵସ
  - block_id: backbone-bf7be856e
    type: paragraph
    content: 𝑇𝐶𝐹= 0.65 + 0.01 ෍𝐹௝
  - block_id: backbone-b8fcd6fdf
    type: paragraph
    content: ௝ୀଵ
  - block_id: backbone-b9b7df6e9
    type: paragraph
    content: <!-- Pagina PDF 43 -->
  - block_id: backbone-bd1ddc415
    type: paragraph
    content: La formula indica che il TCF varia da 0.65 (se tutti i 𝐹௝ sono impostati
      a 0) a 1.35 (se tutti i 𝐹௝ sono impostati a 5). In altre parole, il TCF può
      essere regolato in base alla complessità tecnica attraverso i valori dei fattori
      𝐹௝. La somma di 𝐹௝∗0.01 contribuisce all'aggiustamento complessivo della formula.
      Quindi, il risultato del TCF sarà nell'intervallo da 0.65 a 1.35, con una possibile
      variazione del ±35% a seconda dei valori specifici dei fattori 𝐹௝ utilizzati
      nel calcolo.
- section_id: sec-90c79903
  heading: FP vs LOC
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > FP vs LOC
  blocks:
  - block_id: backbone-bb5e3b764
    type: list
    content: '- **Function Points (FP):** Misurano la funzionalità e la complessità
      funzionale di un sistema software in base alle sue caratteristiche e ai suoi
      requisiti funzionali. Sono indipendenti dal linguaggio di programmazione e rappresentano
      una misura più astratta della dimensione del software.

      - **Lines of Code (LOC):** Misurano la dimensione del software contando il numero
      di linee di codice sorgente scritte. Questa metrica è fortemente dipendente
      dal linguaggio di programmazione utilizzato e non tiene conto della funzionalità
      o della complessità del software. Relazione tra FP e LOC: Molti studi hanno
      cercato di stabilire una relazione tra FP e LOC per aiutare a stimare il lavoro
      necessario per sviluppare il software. Tuttavia, questa relazione non è diretta
      o costante, poiché dipende da vari fattori, tra cui la complessità del software,
      le pratiche di programmazione, il linguaggio di programmazione e altro ancora.
      Classificazione dei linguaggi di programmazione: Per facilitare il confronto
      tra FP e LOC, i linguaggi di programmazione sono stati classificati in diverse
      categorie o livelli in base alla loro relazione media tra LOC e FP. Ad esempio,
      alcuni linguaggi possono richiedere più LOC per implementare una funzionalità
      equivalente a un certo numero di FP, mentre altri linguaggi possono richiederne
      meno. Questa classificazione può essere utile per stimare la dimensione del
      software in LOC sulla base dei FP calcolati e viceversa. Jones'' Backfiring:
      Il termine "Jones'' Backfiring" si riferisce a una situazione in cui l''uso
      esclusivo delle LOC come metrica per la dimensione del software può portare
      a risultati errati o a previsioni inaccurate in termini di sforzo di sviluppo.
      Questo fenomeno può verificarsi quando si ignorano i fattori di complessità
      e funzionalità che non sono catturati dalle LOC. In sintesi, sebbene ci siano
      sforzi per stabilire una relazione tra FP e LOC, queste due metriche rappresentano
      concetti diversi nella misurazione del software. FP è orientato alla funzionalità
      e alla complessità, mentre LOC è una misura della dimensione del codice sorgente.
      La scelta tra FP e LOC come metrica dipende dagli obiettivi specifici di misurazione
      e di gestione del progetto, nonché dalle caratteristiche del software in questione.'
- section_id: sec-b6b8789c
  heading: COCOMO
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > COCOMO
  blocks:
  - block_id: backbone-b257ff3a5
    type: paragraph
    content: 'Il COCOMO (COnstructive COst MOdel) è un modello introdotto da Boehm
      nel 1981 per determinare il valore dello sforzo (effort) necessario nello sviluppo
      software. Il valore ottenuto per lo sforzo viene successivamente utilizzato
      per determinare la durata e i costi di sviluppo del progetto. COCOMO si compone
      di tre modelli distinti:'
  - block_id: backbone-b05db2d68
    type: list
    content: '- **Basic:** Utilizzato per stime iniziali del progetto.

      - **Intermediate:** Applicato dopo aver suddiviso il sistema in sottosistemi.

      - **Advanced:** Applicato dopo aver suddiviso in moduli ciascun sottosistema.
      La stima dello sforzo viene effettuata sulla base di due fattori principali:'
  - block_id: backbone-bb89a06d1
    type: list
    content: '- **Stima delle dimensioni del progetto in KLOC:** KLOC sta per migliaia
      di linee di codice. Questa stima rappresenta la dimensione del progetto in termini
      di quantità di codice da sviluppare.

      - **Stima del modo di sviluppo del prodotto:** Misura il livello intrinseco
      di difficoltà nello sviluppo e può essere di tre tipi:'
  - block_id: backbone-be1b41595
    type: list
    content: '- Organico (per prodotti di piccole dimensioni)

      - Semidetached (per prodotti di dimensioni intermedie)

      - Embedded (per prodotti complessi) Nel 1995 è stata introdotta una versione
      più flessibile e sofisticata chiamata COCOMO II rispetto alla versione precedente,
      al fine di adattarsi meglio alle dinamiche e alla complessità dei progetti software
      moderni. Ecco un esempio semplificato di utilizzo del modello COCOMO.'
  - block_id: backbone-b6e131762
    type: list
    content: '- Passo 1 - Determinare l''effort nominale Inizialmente, si stima l''effort
      nominale utilizzando la formula seguente: 𝐸𝑓𝑓𝑜𝑟𝑡 𝑁𝑜𝑚𝑖𝑛𝑎𝑙𝑒 = 3.2 × (𝐾𝐿𝑂𝐶)ଵ.଴ହ
      𝑀𝑀 Dove KLOC rappresenta le migliaia di righe di codice e MM sta per "Man-Months"
      (mese-uomo), una misura dell''effort di sviluppo necessario.'
  - block_id: backbone-beecf766c
    type: paragraph
    content: <!-- Pagina PDF 44 -->
  - block_id: backbone-b6bc3452e
    type: paragraph
    content: 'Ad esempio, se si prevede di scrivere un software con 33.000 linee di
      codice (33 KLOC), l''effort nominale sarà calcolato come segue: 𝐸𝑓𝑓𝑜𝑟𝑡 𝑁𝑜𝑚𝑖𝑛𝑎𝑙𝑒
      = 3.2 × (33)ଵ.଴ହ ≈ 126 𝑀𝑀'
  - block_id: backbone-bf77c6100
    type: list
    content: '- Passo 2 - Ottenere la stima dell''effort effettivo Successivamente,
      si applica un fattore moltiplicativo C basato su 15 cost drivers per ottenere
      la stima dell''effort effettivo. Questi cost drivers riflettono varie influenze
      e complessità associate al progetto. L''effort effettivo è calcolato come segue:
      𝐸𝑓𝑓𝑜𝑟𝑡 𝐸𝑓𝑓𝑒𝑡𝑡𝑖𝑣𝑜 = 𝐸𝑓𝑓𝑜𝑟𝑡 𝑁𝑜𝑚𝑖𝑛𝑎𝑙𝑒 × 𝐶 Ad esempio, se si applica un moltiplicatore
      C di 1.15, l''effort effettivo sarà: 𝐸𝑓𝑓𝑜𝑟𝑡 𝐸𝑓𝑓𝑒𝑡𝑡𝑖𝑣𝑜 = 126 𝑀𝑀 × 1.15 ≈ 145
      𝑀𝑀 Il valore del moltiplicatore C dipenderà dalla valutazione dei 15 cost drivers
      specifici del progetto. Questi cost drivers includono fattori come la complessità
      dell''architettura, la produttività del personale, la complessità del software,
      l''esperienza del team e altri. Il modello COCOMO include una stima del tempo
      necessario per la consegna del prodotto (product delivery) in base alla dimensione
      del progetto E. Ecco le formule per la stima del tempo T in mesi per i diversi
      modi di sviluppo:'
  - block_id: backbone-b6b2a1740
    type: list
    content: '- **Modo organico:** 𝑇 = 2.5 ∗𝐸଴.ଷ଼ mesi

      - **Modo semi-detached:** 𝑇 = 2.5 ∗𝐸଴.ଷହ mesi

      - **Modo embedded:** 𝑇 = 2.5 ∗𝐸଴.ଷଶ mesi Dove T è il tempo stimato per la consegna
      del prodotto in mesi ed E rappresenta la dimensione del progetto, spesso misurato
      in KLOC (migliaia di linee di codice). Queste formule consentono di stimare
      il tempo necessario per la consegna del prodotto in base alla complessità intrinseca
      del progetto, che può variare a seconda del modo di sviluppo utilizzato (organico,
      semi-detached o embedded).'
- section_id: sec-c3962d37
  heading: PIANIFICAZIONE TEMPORALE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > PIANIFICAZIONE TEMPORALE
  blocks:
  - block_id: backbone-bc9812cd7
    type: paragraph
    content: 'La pianificazione temporale è una fase cruciale in qualsiasi progetto
      e coinvolge la definizione di un piano dettagliato che indica quando e come
      saranno eseguite le attività pianificate. La pianificazione temporale consiste
      nel definire una "rete di task" in base ai seguenti principi fondamentali:'
  - block_id: backbone-b6b8d957b
    type: list
    content: '- **Ripartizione:** Questo principio implica la suddivisione del processo
      e del prodotto in parti più gestibili. In pratica, significa scomporre il progetto
      in attività più piccole e gestibili, spesso chiamate "task" o "attività".

      - **Interdipendenza:** Identificare le dipendenze tra le diverse attività. Alcuni
      task potrebbero dipendere da altri per essere completati, mentre altri possono
      essere eseguiti parallelamente. Comprendere le relazioni di dipendenza è essenziale
      per stabilire un ordine logico delle attività.

      - **Allocazione di risorse:** Determinare il numero di persone coinvolte nel
      progetto, la quantità di sforzo richiesto e le date di inizio e fine per ciascun
      task. Questo aiuta a stabilire una stima realistica delle risorse necessarie
      per portare a termine il progetto.

      - **Responsabilità definite:** Assegnare chiaramente le responsabilità a ciascun
      task. Ogni attività dovrebbe essere associata a una persona o a un gruppo responsabile
      del suo completamento.

      - **Risultati previsti:** Definire chiaramente i risultati attesi al termine
      di ciascuna attività. Questo contribuisce a mantenere il focus sulle consegne
      e sulla qualità del lavoro svolto.

      - **Punti di controllo (Milestone):** Identificare punti di controllo importanti
      durante il progetto, spesso associati a task specifici o gruppi di task. Le
      milestone sono utilizzate per valutare il progresso, controllare la qualità
      e apportare eventuali correzioni di rotta. Strumenti di pianificazione:'
  - block_id: backbone-b31368ed0
    type: list
    content: '- **Diagramma PERT (Program Evaluation and Review Technique):** È un
      grafo che rappresenta il flusso delle attività in un progetto. Ogni nodo nel
      grafo rappresenta un task, mentre gli archi indicano le dipendenze tra i task.'
  - block_id: backbone-b60a3b2d9
    type: list
    content: '- **Utilizzo:**'
  - block_id: backbone-b2acd4d51
    type: paragraph
    content: ' Determina il cammino critico, che è la sequenza di task che determina
      la durata minima del progetto. Questi task hanno un impatto significativo sulla
      durata totale del progetto.  Fornisce una stima del tempo di completamento
      di ciascun task utilizzando modelli statistici.  Indica i limiti temporali
      di inizio e termine per ciascun task.

      - **Vantaggi:**'
  - block_id: backbone-bd76a8906
    type: paragraph
    content: ' Visualizza chiaramente le dipendenze tra le attività.  Aiuta a identificare
      le attività critiche che influenzano la durata complessiva del progetto.

      - **Carta di Gantt:** È un diagramma a barre che mostra la durata temporale
      delle attività lungo un asse temporale. Ogni barra rappresenta un task e la
      sua lunghezza indica la durata prevista.'
  - block_id: backbone-bce54a81e
    type: list
    content: '- **Utilizzo:**'
  - block_id: backbone-bc1f26f42
    type: paragraph
    content: ' Visualizza l''allocazione temporale delle attività in modo chiaro
      e intuitivo.  Fornisce una panoramica visiva delle date di inizio e fine di
      ciascun task.

      - **Vantaggi:**'
  - block_id: backbone-bbc63ebd7
    type: paragraph
    content: <!-- Pagina PDF 45 -->
  - block_id: backbone-b45114d10
    type: paragraph
    content:  Facile da comprendere e comunicare, sia internamente al team che esternamente
      agli stakeholder.  Permette di individuare sovrapposizioni e ritardi. Entrambi
      gli strumenti sono spesso utilizzati in combinazione. Mentre il Diagramma PERT
      si concentra sulle relazioni di dipendenza tra le attività e sul cammino critico,
      la Carta di Gantt fornisce una visione più semplice e immediata delle scadenze
      e della durata delle attività nel tempo. Integrare i due approcci può offrire
      una visione più completa e dettagliata della pianificazione del progetto.
- section_id: sec-0124546d
  heading: SOFTWARE PROJECT MANAGEMENT PLAN (SPMP)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SOFTWARE PROJECT MANAGEMENT PLAN (SPMP)
  blocks:
  - block_id: backbone-b08852d4c
    type: paragraph
    content: Un piano di gestione del progetto software (SPMP) è un documento dettagliato
      che delinea come il progetto software sarà pianificato, eseguito, controllato
      e chiuso.
  - block_id: backbone-b2c1f7a8d
    type: list
    content: '- **Project Scope (Ambito del Progetto):** Questa sezione definisce
      i limiti e gli obiettivi del progetto. Indica cosa è incluso nel progetto e
      cosa è escluso.'
  - block_id: backbone-be92276a7
    type: list
    content: '- **Contenuti possibili:**'
  - block_id: backbone-bcda422a9
    type: paragraph
    content: ' Dichiarazione del problema o dell''opportunità.  Descrizione dei
      deliverable (prodotti consegnabili) del progetto.  Limitazioni e vincoli del
      progetto.

      - **Estimates (Stime):** Questa sezione affronta le stime relative a diverse
      risorse del progetto, come tempo, costo e sforzo umano.'
  - block_id: backbone-bf6e4d7ab
    type: list
    content: '- Stime di durata per ciascuna attività.

      - Stime di costo per risorse e attrezzature.

      - Stime di sforzo umano necessario.

      - **Risks (Rischi):** Identifica e analizza i rischi potenziali che potrebbero
      influenzare il successo del progetto.'
  - block_id: backbone-b09567018
    type: list
    content: '- Elenco di rischi specifici e delle relative probabilità e impatti.

      - Strategie di mitigazione dei rischi.

      - Piani di risposta a situazioni di emergenza.

      - **Schedule (Pianificazione):** Definisce la sequenza temporale delle attività
      del progetto, indicando quando ogni attività inizia e finisce.'
  - block_id: backbone-b9513f413
    type: list
    content: '- Diagramma di Gantt o altro strumento di visualizzazione temporale.

      - Sequenza delle attività e delle dipendenze tra di esse.

      - Milestone (punti di controllo) critici.

      - **Control strategy (Strategia di Controllo):** Indica come il progetto sarà
      monitorato e controllato durante la sua esecuzione.'
  - block_id: backbone-bc147c987
    type: list
    content: '- Procedure di monitoraggio delle attività.

      - Strumenti e metriche di controllo.

      - Fasi di revisione e valutazione. La struttura generale di un Software Project
      Management Plan (SPMP) basato sugli standard dell''IEEE (Institute of Electrical
      and Electronics Engineers), in particolare lo standard IEEE Std. 1058-1998 è
      costituito dalle seguenti sezioni principali:'
  - block_id: backbone-b64921c26
    type: list
    content: '- **Overview:**'
  - block_id: backbone-bf8a451e7
    type: list
    content: '- **Project Summary:** Una panoramica generale del progetto.

      - **Evolution of the Plan:** Informazioni sulla storia e l''evoluzione del piano.

      - **References:** Elenco di riferimenti e documenti utilizzati nella preparazione
      del piano.

      - **Definitions:** Definizioni di termini chiave utilizzati nel documento.

      - **Project Organization:**'
  - block_id: backbone-bf23af64a
    type: list
    content: '- **External Interfaces:** Descrizione delle interfacce esterne con
      altre entità.

      - **Internal Structure:** Struttura interna del team di progetto.

      - **Roles and Responsibilities:** Descrizione dei ruoli e delle responsabilità
      delle persone coinvolte.

      - **Managerial Process Plans:**'
  - block_id: backbone-bf33a91cd
    type: list
    content: '- **Start-up Plan:** Piani per l''avvio del progetto, inclusi piani
      di stima, pianificazione delle risorse e formazione del personale.

      - **Work Plan:** Piani relativi alle attività di lavoro, inclusi l''allocazione
      di risorse e di budget.

      - **Control Plan:** Piani per il controllo dei requisiti, del cronogramma, del
      budget, della qualità, e la raccolta di metriche.

      - **Risk Management Plan:** ** Piani per la gestione dei rischi nel progetto.

      - **Closeout Plan:** Piani per la chiusura del progetto.

      - **Technical Process Plans:**'
  - block_id: backbone-b8d8349c5
    type: list
    content: '- **Process Model:** Descrizione del modello di processo utilizzato.

      - **Methods, Tools and Techniques:** Utilizzo di metodi, strumenti e tecniche
      nel progetto.

      - **Infrastructure Plan:** Piani relativi all''infrastruttura necessaria per
      il progetto.'
  - block_id: backbone-b6a799732
    type: paragraph
    content: <!-- Pagina PDF 46 -->
  - block_id: backbone-bd2ab8e12
    type: list
    content: '- **Product Acceptance Plan:** Piani per l''accettazione del prodotto
      finale.

      - **Supporting Process Plans:**'
  - block_id: backbone-b3a0c3c0f
    type: list
    content: '- **Configuration Management Plan:** Piani per la gestione della configurazione.

      - **Verification and Validation Plan:** Piani per la verifica e la convalida
      del prodotto.

      - **Documentation Plan:** Piani relativi alla documentazione del progetto.

      - **Quality Assurance Plan:** Piani per garantire la qualità del prodotto.

      - **Reviews and Audits:** Procedure per revisioni e audit.

      - **Problem Resolution Plan:** Piani per la risoluzione dei problemi.

      - **Subcontractor Management Plan:** Piani per la gestione dei subappalti.

      - **Process Improvement Plan:** Piani per il miglioramento continuo dei processi.

      - **Additional Plans:** Altri piani specifici o particolari necessari per il
      progetto.'
  - block_id: backbone-bb996ec71
    type: paragraph
    content: <!-- Pagina PDF 47 -->
