- section_id: sec-eb45a06b
  heading: ANALISI ORIENTATA AGLI OGGETTI (OOA)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ANALISI ORIENTATA AGLI OGGETTI (OOA)
  blocks:
  - block_id: backbone-baf3db89d
    type: paragraph
    content: L'Analisi Orientata agli Oggetti (Object Oriented Analysis - OOA) è una
      fase del processo di sviluppo software che si focalizza sulla definizione di
      COSA un prodotto software deve fare. Questa fase è distinta dalla fase successiva,
      la Progettazione Orientata agli Oggetti (Object Oriented Design - OOD), che
      si concentra su COME implementare ciò che è stato definito in fase di OOA. Insieme,
      OOA e OOD aiutano a sviluppare un sistema orientato agli oggetti che sia ben
      strutturato, modulare e in grado di soddisfare i requisiti dell'utente.
- section_id: sec-4aaf12f8
  heading: METODI DI OOA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > METODI DI OOA
  blocks:
  - block_id: backbone-b852a4861
    type: paragraph
    content: I metodi di Analisi Orientata agli Oggetti (OOA) sono approcci strutturati
      e sistematici utilizzati per guidare lo sviluppo di software orientato agli
      oggetti. Questi metodi offrono un insieme di procedure, tecniche e strumenti
      per affrontare la fase di OOA in modo efficace.
  - block_id: backbone-bb11dc23a
    type: list
    content: '- **Input:** Gli input di un metodo di OOA sono costituiti dall''insieme
      dei requisiti utente, che sono raccolti nel documento di analisi dei requisiti.
      Questi requisiti rappresentano le necessità e le aspettative degli utenti per
      il sistema software.

      - **Output:** Gli output di un metodo di OOA sono rappresentati dai modelli
      del sistema. Questi modelli definiscono la specifica del prodotto software e
      rappresentano gli aspetti statici e funzionali del sistema. Questi modelli sono
      solitamente inclusi nel documento di analisi dei requisiti.

      - **Notazioni Visuali:** I metodi di OOA fanno ampio uso di notazioni visive,
      come i diagrammi UML (Unified Modeling Language), per rappresentare graficamente
      le classi, le relazioni, i casi d''uso, le sequenze e altre informazioni rilevanti.

      - **Parallelismo e Iterazione:** Lo sviluppo dei modelli di OOA non è un processo
      sequenziale. Invece, i vari modelli vengono sviluppati in parallelo e si influenzano
      a vicenda. I metodi di OOA seguono un approccio iterativo. Durante le iterazioni
      successive, i modelli vengono raffinati, dettagliati e migliorati in base ai
      feedback, alle nuove comprensioni e ai cambiamenti dei requisiti. Notazioni
      per OOA e OOD: Nell''Analisi e Progettazione Orientata agli Oggetti (OOA/OOD),
      ciascun metodo fa uso di specifiche notazioni visive per rappresentare i modelli
      del sistema. Queste notazioni aiutano gli sviluppatori a comunicare e visualizzare
      le caratteristiche strutturali e comportamentali del software in modo chiaro
      e conciso. Tuttavia, l''adozione di diverse notazioni da parte dei vari metodi
      poteva creare confusione e difficoltà nell''interazione tra team diversi. Per
      affrontare questa sfida, è stato introdotto il Unified Modeling Language (UML),
      che è diventato uno standard per la rappresentazione visuale dei modelli di
      sistemi software orientati agli oggetti.'
- section_id: sec-74ea21d2
  heading: requisitidisistema
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > requisitidisistema
  blocks: []
- section_id: sec-cfcd4314
  heading: UNIFIED MODELING LANGUAGE (UML)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > UNIFIED MODELING LANGUAGE (UML)
  blocks:
  - block_id: backbone-bc50c3e9a
    type: paragraph
    content: 'UML è un linguaggio standard per la descrizione visuale dei sistemi
      software orientati agli oggetti. È stato introdotto nel 1997 e adottato come
      standard dall''Object Management Group (OMG). UML fornisce un insieme di notazioni
      grafiche, chiamate "diagrammi", che rappresentano diverse prospettive e aspetti
      dei modelli del sistema ed è composto da nove formalismi di base, che corrispondono
      a diversi tipi di diagrammi, ciascuno con una semantica e una notazione specifica.
      Formalismi UML: I diagrammi UML sono rappresentazioni grafiche utilizzate nell''Analisi
      e Progettazione Orientata agli Oggetti per descrivere visivamente diversi aspetti
      e prospettive di un sistema software. Questi diagrammi consentono agli sviluppatori
      di comunicare in modo chiaro e conciso le caratteristiche strutturali e comportamentali
      del sistema.'
  - block_id: backbone-bae35f1df
    type: list
    content: '- **Diagramma dei casi d''uso (Use Case Diagram):** Evidenzia i casi
      d''uso, che rappresentano le interazioni tra gli attori (utenti o altri sistemi)
      e il sistema. Mostra come gli utenti utilizzano il sistema e quali funzionalità
      vengono svolte in risposta a determinati scenari.

      - **Diagramma delle classi (Class Diagram):** Rappresenta le classi del sistema
      con i loro attributi, operazioni e le relazioni tra di esse. Descrive la struttura
      statica del sistema e le associazioni tra le classi.

      - **Diagramma degli stati (State Diagram):** Illustra il comportamento dinamico
      di un oggetto o di una classe attraverso vari stati e transizioni tra di essi
      in risposta agli eventi. È utile per modellare il ciclo di vita degli oggetti
      e il loro comportamento in base alle variazioni di stato.

      - **Diagramma delle attività (Activity Diagram):** Mostra flussi di attività,
      decisioni e azioni nel sistema. È utile per rappresentare processi aziendali,
      workflow o sequenze di attività.

      - **Diagramma di sequenza (Sequence Diagram):** Visualizza le interazioni tra
      oggetti in sequenza temporale, mostrando i messaggi scambiati tra di essi e
      l''ordine in cui avvengono. Evidenzia come le diverse parti del sistema cooperano
      durante l''esecuzione di un caso d''uso.

      - **Diagramma di collaborazione (Collaboration Diagram):** Rappresenta le interazioni
      tra oggetti, mostrando gli oggetti coinvolti e i messaggi scambiati tra di essi.
      Sottolinea le relazioni tra le istanze delle classi coinvolte nell''interazione.'
  - block_id: backbone-b0ff455b0
    type: paragraph
    content: <!-- Pagina PDF 27 -->
  - block_id: backbone-bb0f5605c
    type: list
    content: '- **Diagramma degli oggetti (Object Diagram):** Mostra un''istantanea
      specifica dello stato dei vari oggetti e delle loro relazioni in un determinato
      momento. È simile al diagramma di classe, ma rappresenta oggetti reali invece
      di classi astratte.

      - **Diagramma dei componenti (Component Diagram):** Rappresenta la struttura
      e le dipendenze tra i componenti software, come librerie, moduli o file sorgente.
      Utile per la progettazione e la comunicazione tra sviluppatori.

      - **Diagramma di deployment (Deployment Diagram):** Mostra la disposizione fisica
      dei componenti software su nodi hardware e le connessioni tra di essi. Utile
      per pianificare la distribuzione e l''implementazione del sistema.'
- section_id: sec-45c1ba47
  heading: MODELLO DEI DATI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO DEI DATI
  blocks:
  - block_id: backbone-bbc5a01ff
    type: paragraph
    content: 'Il modello dei dati rappresenta l''organizzazione logica e strutturale
      dei dati che verranno elaborati all''interno di un sistema software. Nel contesto
      dell''approccio ad oggetti, le strutture dati vengono definite attraverso gli
      oggetti, i cui stati sono determinati dai valori degli attributi e dalle associazioni
      tra oggetti. Il modello dei dati è specificato attraverso il formalismo dei
      diagrammi delle classi (Class Diagrams) nell''UML. Questi diagrammi consentono
      di definire:'
  - block_id: backbone-b3e8f6507
    type: list
    content: '- **Classi:** Rappresentano le entità fondamentali del sistema, ciascuna
      delle quali può contenere attributi (dati) e operazioni (comportamenti).

      - **Attributi di ciascuna classe:** Sono le proprietà che definiscono le caratteristiche
      di ciascuna classe.

      - **Operazioni di ciascuna classe:** Rappresentano le azioni che una classe
      può eseguire o le funzioni che può fornire.

      - **Associazioni tra classi:** Indicano come le diverse classi interagiscono
      tra loro e possono essere unidirezionali o bidirezionali. La costruzione del
      modello dei dati è un processo iterativo ed incrementale, il che significa che
      viene sviluppato gradualmente e può essere affinato nel tempo. Questo processo
      è altamente creativo e richiede una profonda comprensione del dominio applicativo.
      Nella fase iniziale di costruzione, è importante concentrarsi sulle entity classes.
      Queste classi definiscono le entità principali nel dominio applicativo e sono
      fondamentali per la creazione di un modello accurato. Le control classes (classi
      di controllo) e le boundary classes (classi di confine) vengono introdotte successivamente
      nel processo di costruzione del modello. Le prime gestiscono la logica interna
      del sistema, mentre le seconde rappresentano l''interfaccia utente del sistema.
      Le operazioni di ciascuna classe vengono identificate progressivamente a partire
      dal modello comportamentale, che evidenzia come gli oggetti interagiscono nel
      sistema. Inizialmente, le operazioni possono essere trascurate in favore di
      una comprensione più approfondita delle interazioni e delle relazioni tra le
      classi.'
- section_id: sec-79007315
  heading: APPROCCIO PER L’IDENTIFICAZIONE DELLE CLASSI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > APPROCCIO PER L’IDENTIFICAZIONE DELLE CLASSI
  blocks:
  - block_id: backbone-b41fb4a17
    type: paragraph
    content: 'Approccio Noun Phrase: Questo approccio si basa sull''analisi delle
      frasi nominali presenti nel documento dei requisiti utente. Una frase nominale*
      è una frase in cui il sostantivo ha un ruolo predominante rispetto alla parte
      verbale. I sostantivi all''interno di queste frasi vengono considerati potenziali
      candidate classes, cioè classi che potrebbero essere parte del sistema da sviluppare.
      L''analisi inizia identificando i sostantivi all''interno delle frasi nominali
      presenti nel documento dei requisiti. Questi sostantivi vengono considerati
      possibili candidati per le classi del sistema software. Successivamente, le
      candidate classi vengono raggruppate in tre categorie:'
  - block_id: backbone-b90ae5248
    type: list
    content: '- **Irrelevant:** Queste sono le classi che non appartengono al dominio
      applicativo del sistema e quindi possono essere scartate. Non hanno rilevanza
      per il progetto.

      - **Relevant:** Queste classi sono rilevanti per il dominio applicativo del
      sistema. Esse evidenziano caratteristiche che sono importanti per la realizzazione
      del software. Possono rappresentare entity classes che definiscono concetti
      chiave all''interno del dominio.

      - **Fuzzy:** Queste classi non possono essere immediatamente classificate come
      rilevanti o irrilevanti. Potrebbero mancare informazioni sufficienti per determinarne
      la rilevanza. Queste classi vengono considerate in modo più approfondito in
      seguito, quando saranno disponibili ulteriori dettagli. È importante sottolineare
      che l''approccio noun phrase si basa sull''assunzione che l''insieme di requisiti
      utente sia completo e corretto. Questo approccio può essere un modo utile per
      identificare le classi in modo iniziale, ma spesso viene affiancato da altri
      approcci per ottenere una visione più completa e accurata delle classi necessarie
      per il sistema.'
  - block_id: backbone-b298455ae
    type: paragraph
    content: <!-- Pagina PDF 28 -->
  - block_id: backbone-befc1b318
    type: paragraph
    content: '*Una frase nominale è una "frase" o gruppo di parole che ruota attorno
      a un sostantivo o a un pronome, dando maggiori dettagli o contesto a quella
      parola chiave. Le frasi nominali sono spesso utilizzate per chiarire o espandere
      il significato di un sostantivo all''interno di una frase più ampia. Esempio.
      "Il grande elefante grigio" - In questa frase nominale, "il grande elefante
      grigio" è la frase che descrive il sostantivo "elefante". Gli aggettivi "grande"
      e "grigio" forniscono dettagli sul tipo di elefante.* Approccio Common Class
      Patterns: Questo approccio si basa sulla teoria della classificazione e si concentra
      sull''identificazione di classi predefinite o pattern comuni che si verificano
      spesso nei sistemi software. Invece di derivare classi dalle frasi nominali
      dei requisiti utente, come nell''approccio noun phrase, questo approccio cerca
      di identificare classi basate su categorie di concetti che sono comunemente
      presenti nei sistemi. Le candidate classes vengono identificate a partire da
      gruppi di classi predefinite, chiamate "common class patterns". Questi pattern
      rappresentano concetti generali che possono essere applicati a vari domini.
      Alcuni esempi di common class patterns potrebbero includere:'
  - block_id: backbone-b8c5bc3ae
    type: list
    content: '- **Concept:** rappresenta la prenotazione di risorse o servizi.

      - **Events:** rappresenta eventi o azioni che si verificano nel sistema.

      - **Organization:** rappresenta organizzazioni o aziende.

      - **People:** rappresenta persone coinvolte nel sistema.

      - **Places:** rappresenta luoghi o sedi. Questo approccio non è necessariamente
      sistematico e può essere utilizzato come guida per identificare classi comuni.
      Tuttavia, a differenza dell''approccio noun phrase, non si basa sul documento
      dei requisiti utente. Poiché i nomi delle classi possono essere interpretati
      in modi diversi, l''approccio common class patterns potrebbe causare problemi
      di interpretazione e richiedere un''adeguata comprensione del dominio applicativo
      per essere efficace. L''approccio common class patterns può essere un punto
      di partenza utile per l''identificazione delle classi, ma spesso viene integrato
      con altri approcci per ottenere una visione completa delle classi necessarie
      per il sistema. Approccio Use Case Driven: Questo approccio si basa sul presupposto
      che gli use case diagram, insieme alla descrizione testuale degli scenari di
      funzionamento dei casi d''uso, forniscono una base solida per identificare le
      classi del sistema. Gli use case diagram rappresentano come gli attori (utenti
      o sistemi esterni) interagiscono con il sistema, mentre le descrizioni testuali
      degli scenari forniscono dettagli su come il sistema deve rispondere a tali
      interazioni. L''approccio use case driven include i seguenti passaggi:'
  - block_id: backbone-bd68f4421
    type: list
    content: '- **Sviluppo degli Use Case Diagram:** Prima di tutto, vengono creati
      gli use case diagram per rappresentare le interazioni tra attori e il sistema.
      Gli use case diagram evidenziano i casi d''uso principali e le interazioni tra
      attori e il sistema stesso.

      - **Descrizione degli Scenari:** Per ciascun caso d''uso, viene fornita una
      descrizione dettagliata degli scenari di funzionamento. Queste descrizioni testuali
      rappresentano una sequenza di azioni che un attore svolge interagendo con il
      sistema e il modo in cui il sistema risponde a tali azioni.

      - **Identificazione delle Classi:** Durante l''analisi degli scenari di funzionamento,
      le classi coinvolte nell''esecuzione degli scenari emergono naturalmente. Le
      classi vengono identificate considerando gli oggetti che compaiono nei vari
      passaggi degli scenari e le loro interazioni.

      - **Associazioni e Attributi:** Oltre all''identificazione delle classi, vengono
      anche considerate le associazioni tra le classi e gli attributi che devono essere
      associati a ciascuna classe per supportare le funzionalità descritte negli scenari.

      - **Raffinamenti Successivi:** L''approccio use case driven è iterativo e prevede
      raffinamenti successivi. Man mano che gli scenari vengono esplorati e dettagliati,
      le classi e le loro relazioni possono essere riviste e aggiornate. Questo approccio
      è simile all''approccio noun phrase nel senso che entrambi si basano sui requisiti
      utente per identificare le classi. Tuttavia, l''approccio use case driven si
      concentra specificamente sugli use case e sugli scenari di funzionamento, garantendo
      che le classi siano direttamente rilevanti per le interazioni degli attori con
      il sistema. Approccio CRC (Class-Responsibility-Collaborators): Questo approccio
      coinvolge una serie di riunioni di gruppo in cui gli analisti, i progettisti
      e gli sviluppatori lavorano insieme per identificare le classi del sistema.
      L''approccio prende il nome dall''acronimo CRC, che sta per Class, Responsibility
      e Collaborators. Il processo segue questi passaggi:'
  - block_id: backbone-be8e72c70
    type: list
    content: '- **Riunioni di Gruppo:** Il processo inizia con riunioni in cui vengono
      coinvolti membri del team di sviluppo. Ogni riunione è focalizzata su un particolare
      aspetto del sistema.

      - **Creazione di Card CRC:** Durante le riunioni, vengono create card CRC per
      rappresentare le classi del sistema. Ogni card CRC include tre compartimenti:'
  - block_id: backbone-bb2c69759
    type: list
    content: '- **Classe:** Il nome della classe che sta per essere identificata.

      - **Responsabilità:** Le responsabilità che la classe avrà nel sistema. Questo
      include le funzioni che la classe dovrà svolgere.'
  - block_id: backbone-b5ff08570
    type: paragraph
    content: <!-- Pagina PDF 29 -->
  - block_id: backbone-b3305484e
    type: list
    content: '- **Collaboratori:** Il nome delle altre classi con cui la classe in
      oggetto collaborerà per svolgere le sue responsabilità.

      - **Discussione e Analisi:** Durante la creazione delle card CRC, il gruppo
      discute e analizza come le classi collaborano tra loro e quali sono le responsabilità
      di ciascuna classe.

      - **Identificazione di Attributi e Operazioni:** Durante le discussioni, vengono
      identificati anche gli attributi e le operazioni associati a ciascuna classe,
      sebbene questi dettagli possano essere ulteriormente rifiniti in fasi successive.

      - **Raffinamenti Successivi:** L''approccio CRC è iterativo, quindi le card
      possono essere riviste e aggiornate in fasi successive a mano a mano che il
      team sviluppa una comprensione più completa delle classi e delle loro interazioni.
      Approccio Misto (Mixed): Questo è un approccio che combina elementi da diversi
      approcci precedenti. Potrebbe iniziare con l''identificazione delle classi basata
      sull''esperienza dell''analista o sui modelli comuni di classi. Successivamente,
      potrebbero essere aggiunte classi utilizzando l''approccio Noun Phrase o Use
      Case Driven. Infine, l''approccio CRC può essere utilizzato per verificare e
      rifinire l''insieme delle classi identificate. L''approccio misto offre un approccio
      flessibile e adattabile all''identificazione delle classi, consentendo al team
      di sviluppo di sfruttare i punti di forza di diverse tecniche per ottenere una
      visione più completa e accurata del sistema in fase di analisi. L''obiettivo
      principale è raggiungere una rappresentazione delle classi che rifletta al meglio
      le esigenze del dominio e le interazioni all''interno del sistema.'
- section_id: sec-cc362c2a
  heading: LINEE GUIDA PER L’IDENTIFICAZIONE DELLE ENTITY CLASSES
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > LINEE GUIDA PER L’IDENTIFICAZIONE DELLE
    ENTITY CLASSES
  blocks:
  - block_id: backbone-be69b57e7
    type: paragraph
    content: Le linee guida per l'identificazione delle entity classes sono fondamentali
      durante la fase di Object-Oriented Analysis (OOA). Le entity classes rappresentano
      le entità principali del dominio applicativo e costituiscono il cuore del modello
      dei dati.
  - block_id: backbone-bfa19740a
    type: list
    content: '- **Statement of Purpose:** Ogni classe deve avere un chiaro e ben definito
      "statement of purpose" o scopo. Questo significa che ogni classe dovrebbe avere
      una ragione specifica per esistere nel sistema. Questo scopo dovrebbe essere
      descritto in modo chiaro e conciso, in modo che sia evidente quale ruolo la
      classe gioca all''interno del sistema.

      - **Insieme di Istanze:** Una classe dovrebbe rappresentare un insieme di oggetti
      o istanze del mondo reale. Questi oggetti dovrebbero condividere le stesse proprietà
      e comportamenti descritti dalla classe. Tuttavia, le "singleton classes", che
      rappresentano oggetti per i quali è prevista una singola istanza, di solito
      non sono considerate entity classes, poiché non rappresentano una collezione
      di istanze simili.

      - **Insieme di Attributi:** Ogni classe dovrebbe prevedere un insieme di attributi
      che rappresentano le proprietà o le caratteristiche degli oggetti della classe.
      Gli attributi descrivono lo stato dell''oggetto e sono utilizzati per memorizzare
      informazioni specifiche. È importante considerare un insieme significativo di
      attributi che siano pertinenti per il dominio.

      - **Differenza tra Classi e Attributi:** È importante distinguere tra le entità
      che dovrebbero essere modellate come classi e quelle che dovrebbero essere modellate
      come attributi. Le classi rappresentano concetti significativi e persistenti
      all''interno del dominio, mentre gli attributi rappresentano caratteristiche
      specifiche di un''istanza di classe.

      - **Insieme di Operazioni:** Sebbene inizialmente le operazioni possano essere
      trascurate nella fase iniziale dell''identificazione delle classi, è importante
      prevedere un insieme di operazioni che una classe può eseguire. Queste operazioni
      rappresentano i servizi che la classe offre per manipolare i dati o interagire
      con altre parti del sistema. Le operazioni possono essere derivate implicitamente
      dallo "statement of purpose" della classe. Seguendo queste linee guida, è possibile
      identificare in modo efficace e accurato le entity classes all''interno del
      modello dei dati, assicurandosi che riflettano il dominio applicativo e le sue
      esigenze.'
- section_id: sec-68d46438
  heading: CASI DI STUDIO
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CASI DI STUDIO
  blocks:
  - block_id: backbone-b27f86cdf
    type: paragraph
    content: 'I casi di studio forniscono scenari di esempio realistici in cui è possibile
      applicare i principi dell''analisi orientata agli oggetti, identificare le classi,
      le relazioni e i comportamenti rilevanti e costruire modelli adeguati per rappresentare
      il sistema. Ogni caso di studio presenta sfide specifiche che richiedono una
      comprensione approfondita delle esigenze del dominio e l''applicazione di tecniche
      di analisi appropriate. University Enrolment: Questo caso di studio riguarda
      un sistema per la gestione delle iscrizioni universitarie. Si tratta di un''applicazione
      che supporta il processo di iscrizione degli studenti a corsi universitari.
      Il sistema deve essere in grado di gestire programmi di studio personalizzati,
      verificare i prerequisiti dei corsi, gestire le iscrizioni e risolvere eventuali
      problemi come sovrapposizioni di orari.'
  - block_id: backbone-b91970c7c
    type: list
    content: '- **Scenari:**'
  - block_id: backbone-bfef9d8be
    type: list
    content: '- L''università offre corsi di laurea di primo e secondo livello (undergraduate
      e postgraduate) sia a studenti a tempo pieno che a studenti part-time.

      - La struttura dell''università prevede divisioni che contengono dipartimenti.
      Ogni corso di laurea è amministrato da una singola divisione, ma un corso di
      laurea può includere corsi provenienti da altre divisioni.'
  - block_id: backbone-ba933acd7
    type: paragraph
    content: <!-- Pagina PDF 30 -->
  - block_id: backbone-b3134ca1f
    type: list
    content: '- **Caratteristiche del Sistema:**'
  - block_id: backbone-be481c613
    type: list
    content: '- Il sistema di iscrizione universitaria deve consentire la creazione
      di programmi di studio personalizzati per gli studenti.

      - I programmi di studio possono avere corsi prerequisiti, corsi obbligatori
      e restrizioni, come sovrapposizioni di orario o dimensioni massime delle classi.

      - **Obiettivi del Sistema:**'
  - block_id: backbone-be55e3dfa
    type: list
    content: '- Aiutare nelle attività pre-iscrizione, come l''invio di voti degli
      esami dell''ultimo semestre agli studenti e fornire istruzioni per l''iscrizione.

      - Gestire le procedure di iscrizione, tra cui l''accettazione dei programmi
      di studio proposti dagli studenti.

      - Effettuare la convalida per i prerequisiti dei corsi, sovrapposizioni di orario,
      dimensioni delle classi e approvazioni speciali.

      - **Considerazioni Aggiuntive:**'
  - block_id: backbone-b09dd61d4
    type: list
    content: '- Alcune problematiche possono richiedere la consultazione con consulenti
      accademici o docenti responsabili delle offerte dei corsi. Questo implica un
      coinvolgimento attivo di docenti esperti nel processo di iscrizione.

      - Il sistema deve gestire i dettagli del programma di studio di ciascuno studente
      in modo accurato e affidabile, considerando tutte le regole e i requisiti specifici.

      - La flessibilità nel sistema è cruciale per adattarsi alle esigenze dei diversi
      studenti e dei diversi corsi. Nell''analisi orientata agli oggetti, questo caso
      di studio richiederebbe l''identificazione delle classi (come "Student", "Course",
      "Program", "Division", ecc.) e delle loro proprietà, associazioni e comportamenti.
      I diagrammi UML, come i diagrammi dei casi d''uso, i diagrammi delle classi
      e i diagrammi di sequenza, possono essere utilizzati per rappresentare in modo
      chiaro ed esaustivo il sistema e le sue dinamiche. Video Store: In questo caso
      di studio, il sistema riguarda una videoteca che offre il noleggio di film in
      formato fisico (videocassette e dischi). Il sistema deve gestire l''inventario
      dei film, i dati dei clienti, le prenotazioni dei film, il noleggio e la restituzione
      dei film. È anche necessario gestire le richieste dei clienti e fornire informazioni
      sui film disponibili.'
  - block_id: backbone-bd0cc7173
    type: list
    content: '- **Scenari:**'
  - block_id: backbone-bdb390779
    type: list
    content: '- Il negozio di noleggio offre noleggio di videocassette e dischi a
      clienti.

      - Ogni videocassetta e disco ha un codice a barre univoco.

      - Anche i membri del negozio hanno codici a barre univoci per identificare i
      loro account.

      - **Funzionalità del Sistema:**'
  - block_id: backbone-b2f86a676
    type: list
    content: '- Il sistema deve consentire ai clienti di noleggiare videocassette
      e dischi.

      - I clienti possono effettuare prenotazioni su video specifici da ritirare in
      una data specifica.

      - Deve rispondere alle richieste dei clienti, inclusa la possibilità di rispondere
      a domande sui film che il negozio non ha in magazzino, ma potrebbe ordinare
      su richiesta.

      - **Caratteristiche del Sistema:**'
  - block_id: backbone-ba608caad
    type: list
    content: '- Il sistema deve essere in grado di tenere traccia delle videocassette
      e dei dischi disponibili, nonché delle copie noleggiate e delle prenotazioni.

      - Deve gestire gli account dei clienti e tenere traccia dei video noleggiati
      da ciascun cliente.

      - Deve gestire le prenotazioni dei video e assicurarsi che i clienti ricevano
      le copie prenotate in tempo.

      - **Considerazioni Aggiuntive:**'
  - block_id: backbone-ba3aadfd1
    type: list
    content: '- Il sistema deve essere in grado di gestire la complessità delle prenotazioni,
      delle copie noleggiate e delle restituzioni, considerando anche le scadenze.

      - Il sistema deve avere una funzionalità di ricerca e ricerca avanzata per cercare
      film specifici o ottenere informazioni su film non disponibili.

      - La gestione degli account dei clienti e il processo di noleggio devono essere
      user-friendly e intuitivi.

      - La gestione accurata delle informazioni sulle copie disponibili, i clienti
      e i video è essenziale per fornire un servizio efficiente e di qualità. Nell''analisi
      orientata agli oggetti, questo caso di studio richiederebbe l''identificazione
      delle classi (come "Customer", "Video", "Reservation", ecc.) e delle loro proprietà,
      associazioni e comportamenti. I diagrammi UML, come i diagrammi dei casi d''uso,
      i diagrammi delle classi e i diagrammi di sequenza, possono essere utilizzati
      per rappresentare in modo chiaro ed esaustivo il sistema e le sue dinamiche.'
  - block_id: backbone-b42886775
    type: paragraph
    content: <!-- Pagina PDF 31 -->
  - block_id: backbone-bb7f89542
    type: paragraph
    content: 'Contact Management: Questo caso di studio riguarda una società di ricerca
      di mercato che ha bisogno di un sistema per gestire i contatti con i clienti.
      Il sistema dovrebbe gestire i dati dei contatti dei clienti, tenere traccia
      delle comunicazioni passate e pianificare le attività future con i clienti.
      Si tratta di un''applicazione di gestione delle relazioni con i clienti (CRM).'
  - block_id: backbone-bfa77541e
    type: list
    content: '- **Scenari:**'
  - block_id: backbone-b16134aaf
    type: list
    content: '- L''azienda di ricerca di mercato ha una base di clienti consolidata
      composta da organizzazioni che acquistano rapporti di analisi di mercato.

      - L''azienda è costantemente alla ricerca di nuovi clienti per espandere il
      proprio business.

      - **Funzionalità del Sistema:**'
  - block_id: backbone-bac3ad66a
    type: list
    content: '- **Il sistema deve consentire la gestione dei contatti in tre categorie:**
      prospect (clienti potenziali), actual (clienti attuali) e past (clienti passati).

      - Gli impiegati dell''azienda, in particolare del Dipartimento di Servizio Clienti,
      devono essere in grado di accedere al sistema.

      - Il sistema deve consentire la pianificazione flessibile e la ri-pianificazione
      delle attività legate ai contatti.

      - Deve permettere la collaborazione tra gli impiegati per acquisire nuovi clienti
      e mantenere le relazioni esistenti.

      - **Caratteristiche del Sistema:**'
  - block_id: backbone-ba5d4de87
    type: list
    content: '- Il sistema deve essere in grado di tenere traccia delle informazioni
      sui contatti e di archiviarle in base alla loro categoria.

      - Deve gestire i dati dei clienti, inclusi i dettagli di contatto, le informazioni
      aziendali e lo storico delle interazioni.

      - Dovrebbe consentire agli impiegati di pianificare e registrare attività come
      chiamate, riunioni e follow-up per ciascun contatto.

      - Deve garantire la sicurezza e la gestione delle autorizzazioni per gli utenti
      con diversi livelli di accesso.

      - **Considerazioni Aggiuntive:**'
  - block_id: backbone-bbb4e485d
    type: list
    content: '- Il sistema dovrebbe offrire funzionalità di ricerca e filtro per individuare
      rapidamente i contatti desiderati.

      - La capacità di tracciare le interazioni passate con i clienti può aiutare
      a fornire un servizio personalizzato.

      - Gli strumenti di collaborazione, come la condivisione di note e informazioni,
      potrebbero migliorare l''efficienza delle attività di vendita e di gestione
      dei clienti.

      - La flessibilità nella pianificazione delle attività e la possibilità di aggiornarle
      in tempo reale sono fondamentali per adattarsi alle mutevoli esigenze aziendali.
      Nell''ambito dell''analisi orientata agli oggetti, questo caso di studio richiederebbe
      l''identificazione delle classi (come "Contact", "Employee", "Activity", ecc.)
      e delle loro proprietà, associazioni e interazioni. I diagrammi UML, come i
      diagrammi dei casi d''uso, i diagrammi delle classi e i diagrammi di sequenza,
      potrebbero essere utilizzati per modellare il sistema in modo chiaro e completo.
      Telemarketing: In questo caso di studio, una società benefica sta cercando di
      raccogliere fondi attraverso la vendita di biglietti della lotteria. Il sistema
      deve supportare le attività di telemarketing, pianificando le chiamate in base
      alle priorità, registrando gli esiti delle conversazioni, gestendo le richieste
      di contributi e incentivando la partecipazione dei clienti attraverso campagne
      speciali.'
  - block_id: backbone-b2ce5a654
    type: list
    content: '- **Scenari:**'
  - block_id: backbone-b9bc5eb90
    type: list
    content: '- L''organizzazione benefica vende biglietti della lotteria per raccogliere
      fondi per cause importanti.

      - Le campagne vengono lanciate per sostenere cause benefiche attualmente rilevanti.

      - Vengono rivolte iniziative ai sostenitori passati per promuovere l''acquisto
      di biglietti o donazioni.

      - **Funzionalità del Sistema:**'
  - block_id: backbone-bcce65222
    type: list
    content: '- Il sistema deve consentire l''effettuazione di chiamate telefoniche
      per promuovere la vendita di biglietti della lotteria.

      - Dovrebbe supportare fino a cinquanta operatori di telemarketing che lavorano
      simultaneamente.

      - Le chiamate telefoniche devono essere pianificate in base a priorità predefinite
      e altre restrizioni conosciute.

      - Il sistema deve effettuare automaticamente le chiamate pianificate e gestire
      i risultati delle chiamate.

      - **Caratteristiche del Sistema:**'
  - block_id: backbone-b65b28c02
    type: list
    content: '- Il sistema deve tracciare i dettagli delle chiamate effettuate, comprese
      le informazioni sugli operatori, i sostenitori chiamati e gli esiti delle chiamate.

      - Dovrebbe essere in grado di re-schedulare le chiamate non riuscite e pianificare
      ulteriori richiami telefonici per i sostenitori interessati.

      - Il sistema deve consentire agli operatori di registrare gli ordini dei biglietti
      e qualsiasi modifica ai dati dei sostenitori.

      - Dovrebbe supportare iniziative speciali di premi per l''acquisto in blocco
      di biglietti o per l''attrazione di nuovi sostenitori.

      - **Considerazioni Aggiuntive:**'
  - block_id: backbone-be78a05cd
    type: list
    content: '- Il sistema dovrebbe rispettare le leggi e le regolamentazioni sulla
      privacy e sulle comunicazioni commerciali.'
  - block_id: backbone-b69a46745
    type: paragraph
    content: <!-- Pagina PDF 32 -->
  - block_id: backbone-b5a9fcb6b
    type: list
    content: '- La capacità di visualizzare un elenco dei sostenitori passati e le
      loro preferenze potrebbe aiutare a indirizzare le offerte in modo mirato.

      - La possibilità di analizzare i dati delle chiamate e gli esiti potrebbe fornire
      informazioni utili per ottimizzare le strategie di telemarketing.

      - L''integrazione con un sistema di gestione delle donazioni potrebbe semplificare
      la registrazione dei contributi dei sostenitori. Nel contesto dell''analisi
      orientata agli oggetti, questo caso di studio richiederebbe l''identificazione
      delle classi (come "Supporter", "TicketOrder", "Telemarketer", ecc.) e delle
      loro proprietà, associazioni e interazioni. I diagrammi UML, come i diagrammi
      dei casi d''uso, i diagrammi delle classi e i diagrammi di sequenza, potrebbero
      essere utilizzati per modellare il sistema in modo chiaro e completo.'
- section_id: sec-1c05531f
  heading: LINEE GUIDA PER LA SPECIFICA DELLE CLASSI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > LINEE GUIDA PER LA SPECIFICA DELLE CLASSI
  blocks:
  - block_id: backbone-b4a8d7bb8
    type: paragraph
    content: 'Nomi di classe:'
  - block_id: backbone-be3121d1f
    type: list
    content: '- Assegnare a ciascuna classe un nome significativo che rifletta il
      suo ruolo nel dominio applicativo.

      - Adottare una convenzione standard per i nomi delle classi, come ad esempio
      l''utilizzo di nomi singolari e parole multiple con l''iniziale di ciascuna
      parola in maiuscolo (notazione CamelCase).

      - Limitare la lunghezza dei nomi delle classi a un massimo di 30 caratteri per
      mantenere la leggibilità. Attributi e operazioni:'
  - block_id: backbone-bb7d2a71c
    type: list
    content: '- Iniziare con l''identificazione degli attributi che sono rilevanti
      per caratterizzare gli stati di interesse degli oggetti all''interno del dominio
      applicativo.

      - Utilizzare una convenzione standard per assegnare nomi agli attributi, come
      ad esempio utilizzare lettere minuscole e separare le parole con un carattere
      di underscore (snake_case).

      - Ritardare l''aggiunta di operazioni alle classi fino a quando non è disponibile
      il modello comportamentale, dal quale le operazioni dovrebbero essere derivate
      in modo coerente.'
- section_id: sec-4683148c
  heading: IDENTIFICAZIONE DELLE ASSOCIAZIONI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > IDENTIFICAZIONE DELLE ASSOCIAZIONI
  blocks:
  - block_id: backbone-b8bb8885e
    type: list
    content: '- Gli attributi che rappresentano relazioni tra le classi devono essere
      identificati come associazioni. Ad esempio, se hai un attributo che rappresenta
      un oggetto di un''altra classe, dovrebbe essere modellato come un''associazione
      con quella classe.

      - Le associazioni ternarie (coinvolgenti tre classi) dovrebbero essere convertite
      in cicli di associazioni binarie, in modo da evitare complicazioni di interpretazione.
      Questo significa che dovresti rappresentare le connessioni tra le tre classi
      come una serie di associazioni binarie.

      - Nei cicli di associazioni, puoi valutare se alcune associazioni possono essere
      eliminate e gestite come associazioni derivate. Tuttavia, a volte per ragioni
      di efficienza, vengono introdotte associazioni ridondanti. Specifica delle associazioni:'
  - block_id: backbone-b837f73bd
    type: list
    content: '- Per assegnare nomi alle associazioni, utilizza la stessa convenzione
      adottata per gli attributi, cioè utilizza lettere minuscole e separa le parole
      con un carattere di underscore (snake_case).

      - Assegna nomi di ruolo (rolename) alle estremità dell''associazione. Questi
      nomi di ruolo diventeranno i nomi degli attributi nelle classi all''estremità
      opposta dell''associazione. Questo aiuta a chiarire il significato e il ruolo
      delle associazioni.

      - Determina la molteplicità delle associazioni. Questo indica quante istanze
      di una classe sono associate con un''altra classe attraverso un''associazione.
      Puoi utilizzare numeri o simboli come "*", "1", "0..1", "0..*", ecc., per rappresentare
      la molteplicità.'
- section_id: sec-fecb0684
  heading: AGGREGAZIONE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > AGGREGAZIONE
  blocks:
  - block_id: backbone-bb554e6c5
    type: paragraph
    content: 'L''aggregazione è un concetto chiave nei diagrammi delle classi di UML
      che rappresenta una relazione di tipo "whole-part" o di contenimento tra classi.
      Questo tipo di relazione descrive come un oggetto di una classe "contenitore"
      (o classe composta, detta anche superset class) è composto da uno o più oggetti
      di classi "contenute" (o classi componente, dette anche subset classes). L''aggregazione
      può assumere quattro significati differenti:'
  - block_id: backbone-b4ab6d096
    type: list
    content: '- **ExclusiveOwns:** Questo significato sottolinea una dipendenza di
      esistenza tra la classe contenitore e le classi contenute. In altre parole,
      se l''oggetto della classe contenitore cessa di esistere, anche gli oggetti
      delle classi contenute cesseranno di esistere. Questo tipo di aggregazione è
      anche transitivo (se un oggetto della classe contenuta è parte di un altro oggetto,
      allora è parte anche dell''oggetto contenitore originale). È importante notare
      che l''aggregazione in UML non è simmetrica; cioè l''oggetto contenuto non ha
      una conoscenza diretta dell''oggetto contenitore.'
  - block_id: backbone-b488e866f
    type: paragraph
    content: <!-- Pagina PDF 33 -->
  - block_id: backbone-b2d325a54
    type: list
    content: '- **Owns:** Questo significato indica che l''oggetto della classe contenitore
      possiede gli oggetti della classe contenuta. Non esiste una dipendenza di esistenza
      tra le due classi, ma l''oggetto contenitore è responsabile della creazione
      e distruzione degli oggetti contenuti. In questo caso, non c''è una relazione
      di proprietà fissa tra le classi.

      - **Has:** In questo caso, l''aggregazione rappresenta il fatto che l''oggetto
      della classe contenitore "ha" o "contiene" gli oggetti delle classi contenute.
      Non c''è dipendenza di esistenza e né una relazione di proprietà fissa.

      - **Member:** Questo significato rappresenta una relazione di appartenenza.
      Ad esempio, se una riunione ha un presidente, allora il presidente è membro
      della riunione. Non c''è una particolare proprietà fissa associata a questa
      relazione, eccetto l''appartenenza stessa. Specifica di Aggregazione in UML:
      La specifica di aggregazione in UML include due tipi distinti di aggregazione:
      l''aggregazione e la composizione. Questi due tipi riflettono le diverse semantiche
      e i significati delle relazioni di aggregazione tra le classi.'
  - block_id: backbone-bc813b9bc
    type: list
    content: '- **Aggregazione:**'
  - block_id: backbone-b1bd50dce
    type: list
    content: '- **Semantica:** Aggregazione con riferimento (by-reference semantics)
      – L''aggregazione rappresenta una relazione meno stretta tra la classe contenitore
      e quella contenuta. In questo tipo di relazione, l''oggetto contenitore fa riferimento
      all''oggetto contenuto, ma non ne possiede la responsabilità diretta per il
      ciclo di vita. In altre parole, l''oggetto contenuto può esistere indipendentemente
      dalla classe contenitore.

      - **Notazione:** Un diamante vuoto è posto sulla linea che collega la classe
      contenitore alla classe contenuta.

      - Corrisponde alle aggregazioni "Has" e "Member".

      - **Esempi:** Un''automobile "ha" un motore o un dipartimento "ha" dipendenti.
      Questa relazione riflette l''idea che gli oggetti contenuti possono esistere
      indipendentemente dalla classe contenitore.

      - **Composizione:**'
  - block_id: backbone-b6b64da4c
    type: list
    content: '- **Semantica:** Aggregazione con valore (by-value semantics) – La composizione
      rappresenta una relazione più stretta tra la classe contenitore e quella contenuta.
      In questo caso, l''oggetto contenitore possiede direttamente l''oggetto contenuto
      e ne gestisce il ciclo di vita. L''oggetto contenuto esiste solo all''interno
      dell''oggetto contenitore e non può esistere al di fuori di esso.

      - **Notazione:** Un diamante solido è posto sulla linea che collega la classe
      contenitore alla classe contenuta.

      - Corrisponde alle aggregazioni "ExclusiveOwns" e "Owns".

      - **Esempi:** Un computer "possiede" una CPU, oppure una casa "possiede" le
      sue stanze. In questo caso, l''oggetto contenuto è strettamente legato all''oggetto
      contenitore e non può esistere autonomamente. Questi due tipi di aggregazione
      riflettono la profondità e la natura delle relazioni tra le classi. L''aggregazione
      permette una relazione più debole tra la classe contenitore e quella contenuta,
      mentre la composizione implica una relazione più forte, in cui l''oggetto contenitore
      possiede direttamente e gestisce gli oggetti contenuti.'
- section_id: sec-ab20adea
  heading: EREDITARIETA’ (GENERALIZZAZIONE)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > EREDITARIETA’ (GENERALIZZAZIONE)
  blocks:
  - block_id: backbone-bc766507f
    type: paragraph
    content: L'ereditarietà, anche chiamata generalizzazione in UML, è un concetto
      chiave nella programmazione orientata agli oggetti che consente di modellare
      la condivisione di attributi e operazioni tra diverse classi.
  - block_id: backbone-b389dd777
    type: list
    content: '- **Superclasse e Sottoclassi:** L''ereditarietà coinvolge una relazione
      tra una classe più generica chiamata superclasse (o classe padre) e una o più
      classi specializzate chiamate sottoclassi (o classi figlie). La superclasse
      contiene le caratteristiche comuni che verranno ereditate dalle sottoclassi.

      - **Ereditare Attributi e Operazioni:** Una sottoclasse eredita gli attributi
      e le operazioni definite nella superclasse. Ciò significa che le sottoclassi
      possono utilizzare e avere accesso alle stesse proprietà e comportamenti della
      superclasse.

      - **Sostituibilità:** Un concetto importante nell''ereditarietà è la sostituibilità.
      Un oggetto istanziato da una sottoclasse può essere utilizzato in qualsiasi
      contesto in cui è richiesto un oggetto della superclasse.

      - **Polimorfismo:** L''ereditarietà supporta il polimorfismo, che consente alle
      sottoclassi di fornire implementazioni specifiche per le operazioni ereditate
      dalla superclasse. Questo significa che la stessa operazione può essere implementata
      in modo diverso da diverse sottoclassi, ma può essere richiamata usando la stessa
      interfaccia.

      - **Overriding:** Le sottoclassi possono sovrascrivere (override) le implementazioni
      ereditate di operazioni dalla superclasse. Questo consente alle sottoclassi
      di personalizzare il comportamento delle operazioni in base alle loro esigenze.

      - **Specializzazione:** Le sottoclassi rappresentano una specializzazione o
      una raffinazione della superclasse. Possono aggiungere attributi e operazioni
      aggiuntive o sovrascrivere quelle ereditate. Specifica di Ereditarietà in UML:
      Nell''UML, l''ereditarietà viene rappresentata con una relazione di tipo "is-a".
      Questo indica che una classe (sottoclasse) è una specializzazione di un''altra
      classe (superclasse). L''associazione "is-a" viene spesso chiamata "is-a-kind-of"
      per evidenziare la relazione di specializzazione. Ecco come viene rappresentata
      l''ereditarietà in UML:'
  - block_id: backbone-bd92b772e
    type: list
    content: '- Una freccia diretta collega la sottoclasse alla superclasse.'
  - block_id: backbone-b1fdd6e09
    type: paragraph
    content: <!-- Pagina PDF 34 -->
  - block_id: backbone-b83554cf8
    type: list
    content: '- La freccia punta dalla sottoclasse alla superclasse.

      - La sottoclasse è posta all''estremità della freccia.

      - La freccia rappresenta la relazione di ereditarietà tra le classi.'
- section_id: sec-cfe7583b
  heading: OBJECT DIAGRAM
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > OBJECT DIAGRAM
  blocks:
  - block_id: backbone-b88bf762b
    type: paragraph
    content: 'Un diagramma degli oggetti (object diagram) è una rappresentazione grafica
      delle istanze (oggetti) di classi definite nel modello di dati. Questo tipo
      di diagramma viene utilizzato per mostrare le relazioni e le interazioni tra
      le istanze di diverse classi, offrendo una visione concreta del sistema in un
      dato momento. Gli object diagram sono utili per diversi scopi:'
  - block_id: backbone-b9b560537
    type: list
    content: '- **Rappresentare relazioni complesse tra classi:** Gli object diagram
      sono utilizzati per mostrare come diverse istanze di classi interagiscono tra
      loro. Questo può essere utile per comprenderne il funzionamento in situazioni
      specifiche.

      - **Illustrare modifiche alle istanze durante l''evoluzione del sistema:** Gli
      object diagram consentono di rappresentare come gli oggetti cambiano nel tempo,
      man mano che il sistema si evolve. Ciò può aiutare a identificare cambiamenti
      nel comportamento o nelle relazioni degli oggetti.

      - **Mostrare la collaborazione tra oggetti:** Gli object diagram possono essere
      usati per illustrare come le diverse istanze di classi lavorano insieme per
      raggiungere un obiettivo specifico. Questo può contribuire a una comprensione
      più chiara dei flussi di lavoro e delle interazioni tra gli oggetti. In sostanza,
      gli object diagram offrono una visione dettagliata e concreta del sistema in
      termini delle sue istanze attive. Mostrano come le classi e le loro istanze
      interagiscono e collaborano per svolgere determinate attività o funzioni.'
- section_id: sec-e47929b9
  heading: MODELLO COMPORTAMENTALE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO COMPORTAMENTALE
  blocks:
  - block_id: backbone-b63de856b
    type: paragraph
    content: 'Il modello comportamentale rappresenta l''aspetto funzionale del sistema,
      descrivendo come gli oggetti collaborano e interagiscono tra loro per fornire
      i servizi offerti dal sistema. Questo modello è composto da vari formalismi
      che aiutano a catturare diversi aspetti delle dinamiche del sistema. Alcuni
      dei principali formalismi utilizzati nel modello comportamentale sono:'
  - block_id: backbone-bbd0eaf46
    type: list
    content: '- **Use Case Diagram:** Questo diagramma rappresenta gli scenari di
      utilizzo del sistema, mostrando le interazioni tra attori (utenti o altri sistemi)
      e i casi d''uso (funzionalità) che il sistema offre. Aiuta a identificare le
      principali funzionalità del sistema e le interazioni tra gli attori e le funzionalità.

      - **Activity Diagram:** Questo diagramma descrive il flusso di elaborazione
      all''interno di un caso d''uso o di una funzionalità. Rappresenta le attività,
      le decisioni e le interazioni tra le attività. È particolarmente utile per modellare
      i processi aziendali, i flussi di lavoro e le sequenze di azioni.

      - **Sequence Diagram:** Questo diagramma visualizza l''interazione tra gli oggetti
      nel tempo, mostrando l''ordine dei messaggi scambiati tra gli oggetti. È particolarmente
      utile per rappresentare scenari di interazione e per mostrare come gli oggetti
      collaborano per raggiungere uno specifico obiettivo.

      - **Collaboration Diagram:** Questo diagramma rappresenta l''interazione tra
      gli oggetti, mostrando i messaggi scambiati tra di essi e le associazioni tra
      le istanze delle classi. È utile per mostrare le relazioni e le interazioni
      complesse tra oggetti diversi. Il modello comportamentale viene sviluppato in
      modo iterativo ed incrementale, lavorando in parallelo con il modello dei dati.
      Le informazioni dal modello dei dati vengono utilizzate per identificare le
      operazioni e le classi aggiuntive necessarie per il sistema, come le control
      classes (classi che gestiscono la logica del sistema) e le boundary classes
      (classi che rappresentano l''interfaccia utente).'
- section_id: sec-b5e561e5
  heading: USE CASE DIAGRAM
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > USE CASE DIAGRAM
  blocks:
  - block_id: backbone-b9473d36b
    type: paragraph
    content: Un diagramma dei casi d'uso è uno strumento di modellazione utile nella
      fase di analisi dei requisiti. Esso aiuta a catturare le funzionalità principali
      del sistema e le interazioni con gli attori (utenti o altri sistemi esterni).
  - block_id: backbone-bf8cfe78e
    type: list
    content: '- **Livelli di Astrazione:** I diagrammi dei casi d''uso possono essere
      sviluppati a vari livelli di dettaglio, da una panoramica ad alto livello fino
      ai dettagli più specifici delle funzionalità. Questi livelli di astrazione aiutano
      a rappresentare sia le viste generali del sistema che le dettagliate interazioni.

      - **Rappresentazione di Funzionalità Complete:** Ogni caso d''uso rappresenta
      una funzionalità completa del sistema, inclusi il flusso principale, eventuali
      sottoflussi alternativi e le eccezioni gestite. Questo fornisce una visione
      completa del comportamento del sistema in risposta alle azioni degli attori.

      - **Visibilità Esterna:** I casi d''uso rappresentano le funzionalità visibili
      dall''esterno del sistema. In altre parole, mostrano come gli attori interagiscono
      con il sistema per ottenere risultati specifici.

      - **Comportamento Ortogonale:** Ciascun caso d''uso è progettato per essere
      eseguito in modo indipendente dagli altri. Questo significa che le interazioni
      all''interno di un caso d''uso non interferiscono con gli altri casi d''uso.
      Ciò semplifica la modellazione e l''analisi dei requisiti.'
  - block_id: backbone-bf5e6465e
    type: paragraph
    content: <!-- Pagina PDF 35 -->
  - block_id: backbone-b205899a1
    type: list
    content: '- **Origine da Attori:** Ogni caso d''uso ha un attore iniziale che
      ne è la fonte. Questo attore può essere un utente umano o un altro sistema esterno.
      Una volta che il caso d''uso è stato avviato, può interagire con altri attori
      e oggetti all''interno del sistema.

      - **Risultato Significativo per Attori:** Ogni caso d''uso deve produrre un
      risultato significativo per l''attore che lo inizia. Questo significa che deve
      portare a un risultato utile, come ad esempio un servizio fornito all''utente.
      Identificazione dei Casi d''Uso: L''identificazione dei casi d''uso è una parte
      cruciale della fase di analisi dei requisiti e aiuta a definire le principali
      funzionalità e interazioni del sistema.'
  - block_id: backbone-b4437ead4
    type: list
    content: '- **Insieme dei Requisiti Utente:** L''insieme dei casi d''uso nasce
      spesso dalla comprensione dei requisiti utente. Ogni caso d''uso rappresenta
      un modo specifico in cui gli utenti interagiscono con il sistema per soddisfare
      un certo obiettivo.

      - **Attori e Obiettivi:** Gli attori rappresentano le diverse categorie di utenti
      o sistemi esterni che interagiscono con il sistema. Identificare gli obiettivi
      degli attori aiuta a stabilire quali compiti devono essere supportati dal sistema.

      - **Domande Guida:** L''identificazione può essere facilitata facendosi guidare
      dalle seguenti domande:'
  - block_id: backbone-ba22ba112
    type: list
    content: '- Quali sono i compiti principali svolti da ciascun attore?

      - Un attore accede o modifica l’informazione nel sistema?

      - L''attore rappresenta il tramite mediante cui il sistema viene informato di
      modifiche apportate in altri sistemi?

      - L''attore deve essere informato di eventuali cambiamenti avvenuti nel sistema?

      - **Necessità degli Attori:** Durante la fase di OOA, è fondamentale identificare
      le necessità degli attori e come queste si traducono in comportamenti specifici
      del sistema. Questo aiuta a creare una rappresentazione accurata delle interazioni
      utente-sistema. Specifica di Use Case Diagram: Si possono rappresentare quattro
      tipi di relazioni:'
  - block_id: backbone-b84c0ef14
    type: list
    content: '- **Associazione:** Rappresenta l''interazione tra un attore e un caso
      d''uso. Questo tipo di relazione indica che un attore è coinvolto nell''esecuzione
      di un caso d''uso specifico.'
  - block_id: backbone-bb9d6414e
    type: list
    content: '- Ad esempio, un attore "Studente" potrebbe essere associato al caso
      d''uso "Registrare a un corso".

      - **Include:** Questa relazione indica che un caso d''uso (chiamato caso d''uso
      incluso) è sempre necessario per completare un altro caso d''uso (chiamato caso
      d''uso di base). Il caso d''uso incluso rappresenta una sequenza di azioni comuni
      a più casi d''uso.'
  - block_id: backbone-b607f2a34
    type: list
    content: '- Ad esempio, un caso d''uso "Eseguire pagamento" potrebbe includere
      il caso d''uso "Verificare saldo".

      - **Extend:** Questa relazione indica che un caso d''uso (chiamato caso d''uso
      esteso) può aggiungere comportamenti opzionali a un altro caso d''uso (chiamato
      caso d''uso estendente). Il caso d''uso esteso rappresenta una sequenza di azioni
      che si verificano solo in determinate condizioni.'
  - block_id: backbone-b63df290a
    type: list
    content: '- Ad esempio, un caso d''uso "Prenotare camera d''albergo" potrebbe
      estendersi per includere un caso d''uso "Applicare sconto" se il cliente ha
      un codice sconto.

      - **Generalizzazione:** Questa relazione è simile al concetto di ereditarietà
      nelle classi. Rappresenta una relazione di tipo "è- un" tra un caso d''uso più
      generico (super-caso d''uso) e uno o più casi d''uso più specifici (sotto-casi
      d''uso).'
  - block_id: backbone-b0fce15ff
    type: list
    content: '- Ad esempio, un caso d''uso generico "Gestire utente" potrebbe essere
      specializzato in casi d''uso come "Aggiungere utente" e "Eliminare utente".'
  - block_id: backbone-bad5df09a
    type: paragraph
    content: <!-- Pagina PDF 36 -->
- section_id: sec-e717d127
  heading: ACTIVITY DIAGRAM
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ACTIVITY DIAGRAM
  blocks:
  - block_id: backbone-bfbc192ba
    type: paragraph
    content: 'L''activity diagram è un potente strumento per rappresentare il flusso
      di esecuzione delle attività all''interno di un sistema software. È utilizzato
      sia nella fase di OOA che di OOD, consentendo di rappresentare sia il flusso
      di attività dei casi d''uso durante la fase di analisi che l''implementazione
      delle operazioni definite nel class diagram durante la fase di progettazione.
      Specifica di Activity Diagram:'
  - block_id: backbone-b167eec3f
    type: list
    content: '- **Evento:** Rappresenta l''innesco di un''attività e può essere esterno
      (come un input dall''utente) o interno (come il completamento di un''azione).
      Gli eventi esterni spesso corrispondono all''origine di un caso d''uso.'
  - block_id: backbone-b52b9a86d
    type: list
    content: '- Ad esempio, "Clicca sul pulsante ''Invia''" potrebbe essere un evento
      esterno che avvia l''attività di invio di un’e-mail.

      - **Action State:** Rappresenta un''azione da eseguire. Può essere un''azione
      elementare (come "Invia email") o un''azione composta (come un''azione più dettagliata
      che può essere decomposta ulteriormente).'
  - block_id: backbone-b23f4f530
    type: list
    content: '- Ad esempio, "Invia email" potrebbe essere un "action state" che rappresenta
      l''azione di invio di un’e-mail all''interno del flusso di attività.

      - **Transition:** Rappresenta il passaggio da uno stato all''altro, causato
      dal completamento di un''azione. Può essere condizionato da una guard condition,
      che determina se la transizione è attivata.'
  - block_id: backbone-b94ae6186
    type: list
    content: '- Sono frecce che collegano lo stato di partenza allo stato di destinazione

      - **Barra di Sincronizzazione (Fork/Join):** Utilizzata per modellare flussi
      di esecuzione concorrenti. La barra di fork rappresenta la divisione dei flussi
      concorrenti, mentre la barra di join rappresenta il punto in cui i flussi concorrenti
      si riuniscono.'
  - block_id: backbone-be1d043c1
    type: list
    content: '- Viene rappresentata da una linea spezzata che si divide in più frecce/con
      frecce che si riuniscono.

      - **Nodo Decisionale (Branch/Merge):** Utilizzato per modellare flussi alternativi.
      Il nodo decisionale rappresenta una scelta tra diverse alternative, mentre il
      nodo di merge indica il punto in cui i flussi alternativi si ricongiungono.'
  - block_id: backbone-b9f6bb2b3
    type: list
    content: '- È rappresentato da un rombo e contiene le opzioni decisionali, ciascuna
      collegata da una freccia etichettata con una condizione.'
- section_id: sec-51e158a0
  heading: DIAGRAMMI DI INTERAZIONE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DIAGRAMMI DI INTERAZIONE
  blocks:
  - block_id: backbone-bbc6f3b40
    type: paragraph
    content: 'I diagrammi di interazione, che includono i sequence diagram e i collaboration
      diagram, sono strumenti essenziali per rappresentare le interazioni tra gli
      oggetti all''interno di un sistema. Sequence Diagram:'
  - block_id: backbone-b25a46362
    type: list
    content: '- **Scambio di Messaggi:** Il sequence diagram rappresenta lo scambio
      di messaggi tra gli oggetti nel tempo. Gli oggetti sono disposti in ordine orizzontale
      lungo l''asse verticale, mentre le frecce orizzontali rappresentano i messaggi
      scambiati tra gli oggetti.

      - **Ordine Temporale:** La disposizione degli oggetti e delle frecce segue l''ordine
      temporale in cui avviene lo scambio dei messaggi. Gli oggetti chiamanti inviano
      messaggi agli oggetti chiamati, e il diagramma mostra chiaramente l''ordine
      delle chiamate.

      - **Attivazioni:** Le barre verticali chiamate "attivazioni" rappresentano il
      periodo di tempo in cui un oggetto è impegnato nell''esecuzione di un''azione
      o nella gestione di un messaggio. L''altezza dell''attivazione può indicare
      la durata dell''azione. Collaboration Diagram:'
  - block_id: backbone-b5f58fc5a
    type: list
    content: '- **Scambio di Messaggi e Relazioni:** Il collaboration diagram mostra
      le interazioni tra gli oggetti attraverso relazioni e messaggi. Gli oggetti
      sono rappresentati da "blocchi" e le frecce indicano i messaggi scambiati tra
      gli oggetti.

      - **Relazioni tra Oggetti:** Le relazioni tra gli oggetti sono rappresentate
      da linee tratteggiate o continue tra i blocchi. Queste relazioni possono essere
      associazioni, aggregazioni o altre relazioni definite nel class diagram.'
  - block_id: backbone-b67c904ca
    type: paragraph
    content: <!-- Pagina PDF 37 -->
  - block_id: backbone-b112d3286
    type: paragraph
    content: 'Equivalenza tra Sequence e Collaboration Diagram: I sequence diagram
      e i collaboration diagram sono due rappresentazioni diverse ma equivalenti delle
      interazioni tra oggetti. È possibile trasformare un sequence diagram in un collaboration
      diagram e viceversa in modo coerente, poiché entrambi rappresentano le stesse
      informazioni relative alle interazioni. Specifica di Sequence Diagram: Le attività
      dell’activity diagram vengono mappate come messaggi (di tipo “richiesta esecuzione
      attività”) in un sequence diagram. Esistono due tipi principali di messaggi:'
  - block_id: backbone-b159a6e7c
    type: list
    content: '- **Signal:**'
  - block_id: backbone-bb7ad673e
    type: list
    content: '- I messaggi di tipo "signal" rappresentano chiamate asincrone tra oggetti.
      In una chiamata asincrona, l''oggetto mittente invia un messaggio di "signal"
      all''oggetto destinatario, ma non attende una risposta immediata.

      - Dopo aver inviato un messaggio di "signal", l''oggetto mittente può continuare
      la sua esecuzione senza aspettare una risposta dall''oggetto destinatario.

      - I messaggi di "signal" sono spesso utilizzati per rappresentare eventi che
      scatenano attività o reazioni nell''oggetto destinatario. Ad esempio, una notifica
      di avvenuta registrazione potrebbe essere inviata come un messaggio di "signal".

      - **Call:**'
  - block_id: backbone-b382cea48
    type: list
    content: '- I messaggi di tipo "call" rappresentano chiamate sincrone tra oggetti.
      In una chiamata sincrona, l''oggetto mittente invia un messaggio di "call" all''oggetto
      destinatario e attende una risposta.

      - L''oggetto mittente blocca la sua esecuzione fino a quando non riceve una
      risposta dall''oggetto destinatario. La risposta può includere valori di ritorno
      o altri dettagli rilevanti.

      - I messaggi di "call" sono utilizzati quando l''oggetto mittente ha bisogno
      di ottenere una risposta immediata dall''oggetto destinatario per procedere
      con l''esecuzione. Notazione per Sequence Diagram:'
  - block_id: backbone-b0af26daa
    type: list
    content: '- **Partecipanti (Oggetti):** Gli oggetti coinvolti nell''interazione
      sono rappresentati da rettangoli verticali (chiamati "lifelines"). Il nome dell''oggetto
      è scritto sopra o all''interno del rettangolo, seguito da un separatore e dal
      nome della classe tra parentesi, ad esempio: "Oggetto: Classe".

      - **Messaggi:** I messaggi scambiati tra gli oggetti sono rappresentati da frecce
      tra le lifelines. Le frecce possono essere dirette o tratteggiate. Le frecce
      dirette indicano i messaggi sincroni, mentre le frecce tratteggiate indicano
      i messaggi asincroni. L''etichetta del messaggio, che rappresenta il nome del
      messaggio e, opzionalmente, gli argomenti o i valori passati, è posizionata
      sopra la freccia.

      - **Attivazione dell''oggetto:** L''attivazione dell''oggetto viene rappresentata
      da una barra verticale, chiamata "barra di attivazione", che si estende sulla
      lifeline dell''oggetto. Indica il periodo durante il quale l''oggetto è attivo
      e sta eseguendo le operazioni.

      - **Messaggi di ritorno:** I messaggi di ritorno, che rappresentano le risposte
      agli altri messaggi, sono rappresentati da frecce con un''etichetta che indica
      il valore di ritorno o la risposta.'
- section_id: sec-54115f5d
  heading: INTERFACCIA PUBBLICA DI CLASSE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > INTERFACCIA PUBBLICA DI CLASSE
  blocks:
  - block_id: backbone-b3fcf7926
    type: paragraph
    content: 'Durante la fase di analisi (OOA), è fondamentale definire con attenzione
      l''interfaccia pubblica di ciascuna classe. L''interfaccia pubblica di una classe
      definisce le operazioni che la classe rende disponibili per essere utilizzate
      da altre classi. La signature di un''operazione include:'
  - block_id: backbone-b4819e8b2
    type: list
    content: '- **Nome dell''Operazione:** Il nome che identifica l''operazione.

      - **Lista degli Argomenti Formali:** I parametri di input richiesti dall''operazione,
      ciascuno con il proprio tipo e nome.

      - **Tipo di Ritorno:** Il tipo di dato che l''operazione restituirà come risultato.
      Implementazione dell''Operazione: Durante la fase di progettazione (OOD), si
      procede alla definizione dell''implementazione concreta dell''operazione. Questo
      include la scrittura del codice che definisce cosa fa effettivamente l''operazione
      quando viene eseguita. L''implementazione dettagliata può includere algoritmi,
      logica e interazioni con altri oggetti del sistema. Scope delle Operazioni:
      Le operazioni possono avere diverse "scope" in base a come agiscono all''interno
      della classe:'
  - block_id: backbone-be5a7d957
    type: paragraph
    content: <!-- Pagina PDF 38 -->
  - block_id: backbone-b07737e69
    type: list
    content: '- **Instance Scope:** Le operazioni di istanza operano su un oggetto
      specifico (istanza) della classe e possono accedere ai suoi attributi di istanza.

      - **Class (Static) Scope:** Le operazioni di classe agiscono a livello di classe,
      piuttosto che su istanze specifiche, e possono accedere solo agli attributi
      statici della classe. Carattere $ per le Operazioni di Classe (Static): Nella
      notazione UML (Unified Modeling Language), un carattere "$" che precede il nome
      di un''operazione indica che quell''operazione agisce a livello di classe (statico).
      Questo è particolarmente utile per distinguere tra operazioni di istanza e operazioni
      di classe.'
- section_id: sec-964313ca
  heading: IDENTIFICAZIONE DELLE OPERAZIONI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > IDENTIFICAZIONE DELLE OPERAZIONI
  blocks:
  - block_id: backbone-bc230ea72
    type: paragraph
    content: 'L''identificazione delle operazioni all''interno di un sistema software
      può avvenire in diversi modi, tra cui l''analisi dei sequence diagram e l''applicazione
      di criteri aggiuntivi come il criterio CRUD. Questi approcci possono aiutare
      a definire le operazioni principali che le classi del sistema devono supportare.
      Ecco come funzionano entrambi i metodi:'
  - block_id: backbone-b90ff32e7
    type: list
    content: '- **Identificazione dalle Sequence Diagram:** Nei sequence diagram,
      i messaggi inviati tra gli oggetti rappresentano le chiamate di metodi tra le
      classi. Analizzando i sequence diagram, si possono individuare quali operazioni
      vengono eseguite dalle classi in diversi scenari di interazione. Questo metodo
      è particolarmente utile per identificare le operazioni che sono coinvolte nei
      casi d''uso specifici.

      - **Criterio CRUD:** Il criterio CRUD è un''acronimo che sta per Create, Read,
      Update e Delete. Questo criterio definisce le operazioni fondamentali che un
      sistema deve supportare per gestire le informazioni. Ogni classe di dati dovrebbe
      supportare queste quattro operazioni:'
  - block_id: backbone-ba6aa1e23
    type: list
    content: '- **Create (Creazione):** Consente di creare una nuova istanza dell''oggetto.

      - **Read (Lettura):** Consente di ottenere informazioni sullo stato dell''oggetto.

      - **Update (Aggiornamento):** Consente di modificare lo stato dell''oggetto
      esistente.

      - **Delete (Eliminazione):** Consente di rimuovere un''istanza dell''oggetto
      dal sistema.'
- section_id: sec-123fce16
  heading: MODELLO DINAMICO
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MODELLO DINAMICO
  blocks:
  - block_id: backbone-b5c5973dc
    type: paragraph
    content: Il modello dinamico si concentra sul comportamento dinamico degli oggetti
      all'interno di una classe nel corso del tempo. In altre parole, rappresenta
      come gli oggetti di una classe interagiscono e cambiano stato in risposta agli
      eventi e alle azioni. Questo modello è utile per comprendere come il sistema
      si comporta nel suo flusso operativo e come gli oggetti reagiscono agli stimoli
      esterni o agli eventi interni.
  - block_id: backbone-bfd579bc7
    type: paragraph
    content: 'State Diagrams: I "State Diagrams" (Diagrammi di Stato) sono uno strumento
      comune utilizzato per rappresentare il modello dinamico. Un diagramma di stato
      è costituito da una serie di stati, eventi e transizioni. Gli stati rappresentano
      i diversi stati in cui un oggetto può trovarsi, mentre le transizioni collegano
      gli stati e vengono scatenate da eventi specifici. Un diagramma di stato include
      anche le azioni associate agli eventi e le condizioni che devono essere soddisfatte
      per attivare una transizione. Le condizioni possono determinare se una transizione
      è possibile in base allo stato attuale dell''oggetto. Applicazioni del Modello
      Dinamico: Il modello dinamico è particolarmente utile per le applicazioni scientifiche
      e real-time, in cui è importante comprendere come gli oggetti cambiano stato
      nel corso del tempo. In sintesi, il modello dinamico e i diagrammi di stato
      offrono una visione chiara e dettagliata di come gli oggetti all''interno di
      una classe interagiscono e cambiano nel tempo, consentendo agli sviluppatori
      di comprendere meglio il comportamento del sistema e di prendere decisioni informate
      nella progettazione e nell''implementazione.'
- section_id: sec-e101dc21
  heading: GESTIONE DELLA COMPLESSITA’ NEI MODELLI DI OOA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > GESTIONE DELLA COMPLESSITA’ NEI MODELLI
    DI OOA
  blocks:
  - block_id: backbone-bf74db200
    type: paragraph
    content: La gestione della complessità è un aspetto cruciale nello sviluppo di
      sistemi software di grandi dimensioni. I modelli di analisi orientata agli oggetti
      (OOA) spesso coinvolgono numerose classi con relazioni interconnesse, e questa
      complessità può rendere difficile la comprensione, la manutenzione e l'evoluzione
      del sistema. L'introduzione di gerarchie di classi e la stratificazione dei
      modelli sono tecniche che possono aiutare a affrontare questa complessità.
  - block_id: backbone-bc693e8cc
    type: paragraph
    content: <!-- Pagina PDF 39 -->
  - block_id: backbone-bf8d92a7a
    type: paragraph
    content: 'Gerarchie di Classi: Le gerarchie di classi consentono di organizzare
      le classi in modo più strutturato, raggruppandole secondo relazioni di ereditarietà.
      Introducendo classi di base (superclassi) e classi derivate (sottoclassi), è
      possibile catturare le caratteristiche comuni e differenziali tra le classi.
      Questo permette di evitare la duplicazione del codice e semplifica il modello,
      rendendolo più gestibile. Le gerarchie di classi possono anche favorire la modularità
      e la riusabilità del codice. Le classi di base possono implementare comportamenti
      di alto livello, mentre le classi derivate possono specializzarsi e aggiungere
      dettagli specifici. Inoltre, le operazioni definite nella classe di base possono
      essere ereditate e sovrascritte nelle classi derivate. Stratificazione dei Modelli:
      La stratificazione dei modelli implica la suddivisione del sistema in livelli
      o strati logici. Ogni strato ha uno scopo specifico e una responsabilità chiara.
      Questo approccio permette di isolare le funzionalità e ridurre le interdipendenze
      tra le diverse parti del sistema. La stratificazione aiuta a creare una struttura
      modulare e coesa, in cui ogni strato è indipendente dagli altri e può essere
      modificato senza influenzare gli altri. Inoltre, questa suddivisione semplifica
      la manutenzione, in quanto è più facile individuare e risolvere i problemi in
      un determinato strato senza dover toccare tutto il sistema.'
- section_id: sec-2c57c99f
  heading: UML PACKAGE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > UML PACKAGE
  blocks:
  - block_id: backbone-ba78af349
    type: paragraph
    content: Un package è un meccanismo utilizzato nell'Unified Modeling Language
      (UML) per organizzare e raggruppare elementi come classi, casi d'uso, componenti
      e altri elementi correlati in un sistema software.
  - block_id: backbone-b843d5ed7
    type: list
    content: '- **Annidamento dei Package:** I package possono essere annidati all''interno
      di altri package, creando una struttura gerarchica. Questo permette di organizzare
      ulteriormente gli elementi in sottogruppi e di creare una gerarchia di organizzazione.

      - **Visibilità e Comunicazione:** Le classi all''interno di un package possono
      comunicare tra loro usando relazioni di dipendenza, associazioni e altre interazioni.
      La visibilità dei membri delle classi (ad esempio attributi e operazioni) può
      essere controllata mediante i livelli di visibilità (public, protected, private)
      definiti nel linguaggio di programmazione o nel paradigma di sviluppo.

      - **Gestione della Complessità:** L''uso di package aiuta a gestire la complessità
      di grandi sistemi software, suddividendo il sistema in unità più gestibili e
      facilitando la navigazione all''interno del modello. Inoltre, i package possono
      riflettere la struttura organizzativa dell''applicazione o i domini di interesse
      specifici.

      - **Collaborazione tra Package:** I package possono comunicare tra loro attraverso
      dipendenze di package o attraverso l''uso di classi di altri package. Questo
      consente la separazione delle preoccupazioni e favorisce l''incapsulamento e
      la modularità. Package Diagram: I package possono essere creati all''interno
      di diversi tipi di diagrammi, come il class diagram o il use case diagram. I
      package possono contenere classi, interfacce, casi d''uso e altri elementi del
      modello. Si possono specificare due tipi principali di relazioni tra i package:'
  - block_id: backbone-b1aa88f22
    type: list
    content: '- **Generalization (Gerarchia):** Questa relazione indica che un package
      è una specializzazione di un altro package. Implica una relazione di ereditarietà
      tra i contenuti dei package. Quando un package eredita elementi da un altro
      package, la gerarchia tra i package è spesso accompagnata da una dipendenza
      tra i contenuti dei package.

      - **Dependency (Dipendenza):** Questa relazione indica che un package dipende
      da un altro per qualche motivo. Le dipendenze possono includere l''utilizzo
      di elementi del package di destinazione o l''accesso ai suoi membri. Le relazioni
      di dipendenza tra package possono includere usage dependency, access dependency
      e visibility dependency.'
- section_id: sec-27e07df0
  heading: APPROCCIO BCE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > APPROCCIO BCE
  blocks:
  - block_id: backbone-bc26eba32
    type: paragraph
    content: 'L''approccio BCE (Boundary-Control-Entity) è un modo di organizzare
      il design e la struttura di un sistema software in base a tre categorie principali
      di classi che collaborano per fornire funzionalità complessive. Questo approccio
      mira a suddividere le responsabilità all''interno del sistema in modo da ottenere
      un design ben strutturato e modulare. Le tre categorie di classi nell''approccio
      BCE sono:'
  - block_id: backbone-b0f240fdd
    type: list
    content: '- **Boundary Package:** Questa componente rappresenta l''interfaccia
      utente dell''applicazione. Include tutti gli elementi che interagiscono direttamente
      con l''utente, come le schermate, i form, i widget e i controlli grafici. Il
      Boundary si occupa di ricevere le interazioni dell''utente, visualizzare i dati
      e fornire feedback visivo. Non contiene logica di business o elaborazione dei
      dati. Lo scopo principale del Boundary è quello di trasmettere le richieste
      dell''utente al Controller e visualizzare i dati ottenuti dall''Entity.

      - **Control Package:** Le classi del package Control rappresentano il "cervello"
      del sistema. Questa componente gestisce la logica di controllo dell''applicazione.
      Riceve i comandi e le azioni provenienti dalla Boundary e inoltra le richieste
      appropriate all''Entity per elaborazione. Il Controller contiene la logica di
      business, le regole di validazione e le azioni da intraprendere in risposta
      alle richieste dell''utente. Il Controller è responsabile di gestire l''interazione
      tra la Boundary e l''Entity. Le classi Control possono essere considerate come
      le azioni e le attività che gestiscono i casi d''uso.'
  - block_id: backbone-b26a4ca7c
    type: paragraph
    content: <!-- Pagina PDF 40 -->
  - block_id: backbone-bc693ec3c
    type: list
    content: '- **Entity Package:** Le classi del package Entity contengono le strutture
      dati, le regole di business e l''accesso ai dati. L''Entity elabora le richieste
      provenienti dal Controller, interagisce con il database o altre fonti di dati,
      e restituisce i risultati al Controller. L''Entity è separata dalla Boundary
      per garantire che la logica di business e l''accesso ai dati siano isolati dall''interfaccia
      utente.'
  - block_id: backbone-b53c8244c
    type: paragraph
    content: <!-- Pagina PDF 41 -->
- section_id: sec-76ffee46
  heading: PIANIFICAZIONE
  level: 2
