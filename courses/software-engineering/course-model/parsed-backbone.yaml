  blocks: []
- section_id: sec-bde81ab3
  heading: FASE DI PROGETTO
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > FASE DI PROGETTO
  blocks:
  - block_id: backbone-b35bd0696
    type: paragraph
    content: 'La fase di progetto è una tappa chiave nel ciclo di vita dello sviluppo
      del software. Questa fase si concentra sul passaggio dalla definizione di "cosa"
      deve essere realizzato, come specificato nell''analisi dei requisiti, a "come"
      la realizzazione dovrebbe avvenire. La fase di progetto prende in input il documento
      di specifica (analisi dei requisiti) e produce un documento di progetto che
      guida la successiva fase di codifica. La fase di progetto può essere suddivisa
      in due sotto-fasi principali:'
  - block_id: backbone-bcd58f324
    type: list
    content: '- **Progetto Architetturale (o Preliminare):** Durante questa fase,
      il sistema software complessivo viene suddiviso in sottosistemi più gestibili.
      Questa suddivisione è spesso nota come decomposizione modulare. L''obiettivo
      è definire un''architettura generale del sistema.

      - **Progetto Dettagliato:** In questa fase, ogni sottosistema identificato nella
      fase di progetto architetturale viene progettato in dettaglio. Si fa una scelta
      più specifica di algoritmi, strutture dati e altro necessario per implementare
      ciascun modulo.'
- section_id: sec-9bc8bb04
  heading: PRINCIPI DI PROGETTAZIONE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > PRINCIPI DI PROGETTAZIONE
  blocks:
  - block_id: backbone-b29344308
    type: paragraph
    content: 'Stepwise refinement: Si tratta di una strategia di progettazione nell''ambito
      della programmazione strutturata proposta da Wirth nel 1971. Questa strategia
      è utilizzata per sviluppare un programma in modo graduale e organizzato, partendo
      da una visione generale e affinando i dettagli progressivamente.'
  - block_id: backbone-b4edab546
    type: list
    content: '- **Definizione della Strategia:** Il procedere per raffinamenti successivi
      è una strategia top-down, il che significa che inizia con una visione generale
      e si sposta gradualmente verso i dettagli più specifici.

      - **Specifiche iniziali:** Si inizia con la specifica di una funzione o di dati
      senza descrivere il funzionamento interno della funzione o la struttura interna
      dei dati. In questa fase, si ha una visione ad alto livello.

      - **Processo di Raffinamento:** Il raffinamento è un processo iterativo che
      consiste nell''aggiungere livelli di dettaglio crescenti ad ogni passo. Man
      mano che ci si sposta attraverso i passaggi di raffinamento successivi, si sviluppa
      una visione sempre più dettagliata e completa del sistema.

      - **Legge di Miller:** Afferma che in un dato momento una persona può concentrarsi
      su al massimo 7 ± 2 "chunk" di informazioni. Questo sottolinea l''importanza
      di suddividere il problema in parti più gestibili e concentrarsi su dettagli
      limitati in ogni fase del processo.

      - **Complementarità con l''Astrazione:** Mentre l''astrazione coinvolge l''isolamento
      dei dettagli non rilevanti e la focalizzazione sugli aspetti cruciali, il raffinamento
      si occupa di aggiungere progressivamente dettagli per completare l''implementazione.
      Astrazione: Significa isolare e concentrarsi sugli aspetti essenziali di un''entità,
      ignorando i dettagli non rilevanti. In altre parole, si tratta di estrarre la
      sostanza fondamentale o l''essenza di un concetto o di un''entità.'
  - block_id: backbone-bf87e8435
    type: list
    content: '- **Livelli di Astrazione:** Il concetto di livello di astrazione è
      stato introdotto da Dijkstra nel 1968, specialmente nell''ambito dei sistemi
      operativi, per descriverne l''architettura a strati. Ogni livello rappresenta
      un punto di vista o una visione specifica del sistema, con un grado crescente
      di dettagli.

      - **Processo Software e Raffinamento:** Nel contesto del processo software,
      ogni passo rappresenta un raffinamento del livello di astrazione della soluzione.
      Prima di decidere come implementare qualcosa, ci si concentra su cosa è e cosa
      fa un''entità del sistema software.

      - **Tipi Principali di Astrazione:**'
  - block_id: backbone-bb57e633d
    type: list
    content: '- **Astrazione Procedurale:** Coinvolge la focalizzazione sugli aspetti
      procedurali di un sistema. Ad esempio, l''uso di funzioni in linguaggi di programmazione
      come il linguaggio C rappresenta un''astrazione procedurale.

      - **Astrazione dei Dati:** Coinvolge la focalizzazione sugli aspetti relativi
      ai dati, spesso implementata attraverso concetti come l''incapsulamento dei
      dati.

      - **Data Encapsulation:** Questo concetto implica che i dati e le operazioni
      ad essi associate sono raggruppati in un''unica entità. Modularità: Si riferisce
      alla suddivisione di un sistema software in moduli distinti e autonomi. Questo
      approccio contrasta con l''idea di un unico blocco monolitico di codice.'
  - block_id: backbone-b99eddb73
    type: list
    content: '- **Vantaggi:**'
  - block_id: backbone-b34df5fae
    type: list
    content: '- **Facilità di Manutenzione:** I moduli autonomi consentono di concentrarsi
      su porzioni specifiche del codice, semplificando la manutenzione e le modifiche.

      - **Facilità di Correzione:** Gli errori sono spesso limitati a un singolo modulo,
      rendendo più facile individuarli e correggerli senza influenzare altre parti
      del sistema.'
  - block_id: backbone-bc4897ad9
    type: paragraph
    content: <!-- Pagina PDF 54 -->
  - block_id: backbone-bb17a17b7
    type: list
    content: '- **Facilità di Comprensione:** La suddivisione del codice in moduli
      rende più semplice la comprensione del sistema nel suo complesso, in quanto
      è possibile concentrarsi su un modulo alla volta.

      - **Riusabilità:** I moduli ben progettati possono essere riutilizzati in diversi
      contesti, promuovendo la riusabilità del codice. Decomposizione modulare: È
      una pratica di progettazione del software che mira a suddividere un sistema
      complesso in moduli più gestibili. Questi moduli costituiscono unità di codice
      indipendenti che possono essere compilati e utilizzati separatamente.'
  - block_id: backbone-b80ec29a4
    type: list
    content: '- **Caratteristiche di un Modulo:**'
  - block_id: backbone-b3d1aa3c2
    type: list
    content: '- Contiene istruzioni, logica di elaborazione e strutture dati.

      - Può essere compilato separatamente e memorizzato in una libreria software.

      - Può essere incluso in un programma, utilizzando segmenti di modulo identificati
      da un nome e da una lista di parametri.

      - Può utilizzare altri moduli.

      - **Obiettivi:**'
  - block_id: backbone-b6f91633a
    type: list
    content: '- **Massima coesione interna ai moduli:** Un modulo dovrebbe concentrarsi
      su una specifica funzionalità e avere una forte coesione interna.

      - **Minimo grado di accoppiamento tra i moduli:** L''interazione tra moduli
      dovrebbe essere ridotta al minimo indispensabile.

      - Questi obiettivi aumentano la comprensibilità, la manutenibilità, l''estensibilità
      e la riusabilità del software. Coesione e Accoppiamento rispetto a Modularità:'
  - block_id: backbone-b41eefd18
    type: list
    content: '- La coesione (cohesion) si riferisce al grado in cui gli elementi all''interno
      di un modulo sono strettamente correlati tra loro. Un modulo con alta coesione
      esegue un insieme ben definito di attività correlate, mentre un modulo con bassa
      coesione potrebbe svolgere attività diverse e poco correlate. L''obiettivo è
      massimizzare la coesione all''interno di ciascun modulo.

      - L''accoppiamento (coupling) si riferisce al grado di dipendenza tra moduli.
      Un basso accoppiamento implica una minima dipendenza tra i moduli, il che significa
      che le modifiche in un modulo hanno un impatto limitato sugli altri. L''obiettivo
      è minimizzare l''accoppiamento tra i moduli. Coesione: Misura il grado di interazione
      interna al modulo tra le azioni di una funzione. Esistono 7 livelli di coesione,
      che variano da quello più debole a quello più forte:'
  - block_id: backbone-b27c57dbb
    type: list
    content: '- **Coincidental (Livello 1):** Non esiste una relazione significativa
      tra gli elementi del modulo. Le attività sono raggruppate insieme casualmente
      e non c''è una logica o un collegamento intrinseco tra di esse.

      - **Logica (Livello 2):** Gli elementi del modulo sono correlati solo in modo
      logico. Uno di essi viene selezionato e utilizzato dal modulo chiamante, ma
      non c''è una stretta connessione tra le attività del modulo.

      - **Temporale (Livello 3):** Gli elementi del modulo sono correlati in base
      a un ordine temporale o sequenza di esecuzione. Le attività avvengono in un
      certo ordine, ma potrebbero non essere strettamente connesse concettualmente.

      - **Procedurale (Livello 4):** Gli elementi del modulo sono correlati in base
      a una sequenza predefinita di passi da eseguire. Questo implica una connessione
      più forte rispetto alla coesione temporale, poiché le attività seguono un ordine
      ben definito.

      - **Communicational (Livello 5):** Gli elementi del modulo sono correlati in
      base a una sequenza di passi che vengono eseguiti sulla stessa struttura dati.
      Le attività all''interno del modulo comunicano attraverso la condivisione di
      dati.

      - **Informational (Livello 6):** Ogni elemento del modulo ha una porzione di
      codice indipendente con un proprio punto di ingresso e uscita. Tutti gli elementi
      agiscono sulla stessa struttura dati, ma eseguono attività indipendenti.

      - **Funzionale (Livello 7):** Tutti gli elementi del modulo sono strettamente
      correlati perché svolgono una singola funzione o responsabilità. Questo rappresenta
      il livello più elevato di coesione e riflette una progettazione ottimale del
      modulo. In generale, l''obiettivo è massimizzare la coesione di un modulo, poiché
      una coesione più elevata generalmente porta a moduli più facili da capire, mantenere
      e riusare. Un modulo altamente coeso è spesso un modulo più autonomo e indipendente,
      il che contribuisce a migliorare la qualità complessiva del software. Coupling:
      Misura il grado di dipendenza o interconnessione tra i moduli di un sistema
      software. Un basso accoppiamento è generalmente auspicabile, poiché implica
      una minore dipendenza tra i moduli, rendendo il sistema più flessibile, manutenibile
      e riutilizzabile. Al contrario, un alto accoppiamento può portare a un sistema
      più difficile da modificare e gestire. Esistono 5 livelli di accoppiamento:'
  - block_id: backbone-b9a0d9d20
    type: list
    content: '- **Content (Livello 1):** Un modulo fa riferimento direttamente al
      contenuto interno di un altro modulo. Questo è il livello più alto di accoppiamento
      e generalmente è da evitare.

      - **Common (Livello 2):** Due moduli accedono alla stessa struttura dati. Ciò
      implica una dipendenza diretta sulla rappresentazione interna dei dati condivisi.'
  - block_id: backbone-b2afa3666
    type: paragraph
    content: <!-- Pagina PDF 55 -->
  - block_id: backbone-bec9fd6c0
    type: list
    content: '- **Control (Livello 3):** Un modulo controlla esplicitamente l''esecuzione
      di un altro modulo. Questo accoppiamento si verifica quando un modulo determina
      l''ordine di esecuzione di un altro modulo.

      - **Stamp (Livello 4):** Due moduli si scambiano una struttura dati come argomento,
      ma utilizzano solo alcuni dei suoi elementi. Ciò implica una dipendenza parziale
      sulla struttura dati condivisa.

      - **Data (Livello 5):** Due moduli si scambiano argomenti omogenei, come argomenti
      semplici o strutture dati di cui utilizzano tutti gli elementi. Questo rappresenta
      il livello più basso di accoppiamento. Information Hiding: Questo concetto è
      stato introdotto da Parnas nel 1971 e costituisce la base per i concetti di
      astrazione procedurale e astrazione dei dati. Questa tecnica di progettazione
      si concentra sulla definizione dei moduli in modo che i dettagli implementativi,
      sia procedurale che relativi ai dati, non siano accessibili da altri moduli
      che non ne hanno necessità.'
  - block_id: backbone-b94b1d735
    type: list
    content: '- **Obiettivo:** Nascondere i dettagli implementativi per evitare che
      altri moduli dipendano da tali dettagli. Ciò consente di isolare le implementazioni
      specifiche e di ridurre l''accoppiamento tra i moduli.

      - **Vantaggi:**'
  - block_id: backbone-b09bd221f
    type: list
    content: '- Migliora la modularità e la manutenibilità del sistema.

      - Facilita i cambiamenti senza influenzare altri moduli.

      - Favorisce la separazione delle responsabilità.

      - **Applicazione in Fasi di Testing e Manutenzione:** I vantaggi della tecnica
      di information hiding diventano evidenti durante le fasi di testing e manutenzione,
      quando è possibile apportare modifiche a una parte del sistema senza dover considerare
      gli effetti su altri moduli. Riusabilità: Si riferisce all''utilizzo di componenti
      sviluppati per un prodotto all''interno di un prodotto differente. Può riguardare
      non solo moduli o frammenti di codice, ma anche progetti, parti di documentazione,
      insiemi di dati di test o stime di costi e durata.'
  - block_id: backbone-bf28b22e2
    type: list
    content: '- **Vantaggi:**'
  - block_id: backbone-b1388c290
    type: list
    content: '- Riduzione dei costi e dei tempi di produzione del software.

      - Aumento dell''affidabilità grazie all''uso di componenti già convalidati.

      - **Applicazione nella Fase di Progetto:** La riusabilità può applicarsi a diversi
      livelli.'
  - block_id: backbone-b97cd8b3f
    type: list
    content: '- Moduli software.

      - **Application framework:** incorpora la logica di controllo di un progetto.

      - **Design pattern:** identifica soluzioni di progetto ricorrenti.

      - Architetture software che comprendono moduli, framework e design pattern.'
  - block_id: backbone-b8f871b03
    type: paragraph
    content: <!-- Pagina PDF 56 -->
- section_id: sec-9012b306
  heading: OBJECT ORIENTED DESIGN - OOD
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > OBJECT ORIENTED DESIGN - OOD
  blocks:
  - block_id: backbone-b23e20cda
    type: paragraph
    content: 'Object-Oriented Design è una fase del processo di sviluppo del software
      che segue l''Object-Oriented Analysis (OOA). La fase di OOD è suddivisa in due
      sottofasi principali:'
  - block_id: backbone-b8415b06c
    type: list
    content: '- **Fase Preliminare (o Architetturale, o di Sistema) di OOD:** Questa
      fase definisce la strategia generale per costruire una soluzione che risolva
      il problema specificato durante l''Object-Oriented Analysis (OOA). Le decisioni
      prese durante questa fase riguardano l''organizzazione complessiva del software,
      inclusa l''architettura di sistema.

      - **Fase Dettagliata (o degli Oggetti) di OOD:** Questa fase fornisce la definizione
      completa delle classi e delle associazioni che devono essere implementate, così
      come le strutture dati e gli algoritmi dei metodi che implementano le operazioni
      delle classi. Durante questa fase, si aggiungono dettagli tecnici alla soluzione
      hardware/software, definendo come il software deve essere implementato. Secondo
      un approccio di sviluppo iterativo e incrementale, il modello OOA viene "trasformato"
      nel modello OOD. Questa trasformazione aggiunge dettagli tecnici alla soluzione,
      specificando come il software deve essere implementato. Questo approccio consente
      di affinare gradualmente la progettazione in base a feedback e requisiti in
      evoluzione.'
- section_id: sec-2caf910b
  heading: ARCHITETTURA DI SISTEMA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ARCHITETTURA DI SISTEMA
  blocks:
  - block_id: backbone-bd81a9335
    type: paragraph
    content: 'L''architettura di sistema (system architecture) definisce la struttura
      dei componenti del sistema software insieme alle relazioni tra tali componenti
      e ai principi che guidano la progettazione e l''evoluzione del sistema. Sistemi
      Software Distribuiti: I sistemi software distribuiti prevedono che l''elaborazione
      sia distribuita su un insieme di host di esecuzione indipendenti, collegati
      da un''infrastruttura di rete (locale o a vasta area).'
  - block_id: backbone-ba6f5bb76
    type: list
    content: '- **Set di Host di Esecuzione Indipendenti:** L''elaborazione è distribuita
      su più host di esecuzione, visti dagli utenti come un singolo host.

      - **Infrastruttura di Rete:** Gli host sono collegati da un''infrastruttura
      di rete, che può essere di tipo locale (LAN) o di vasta area (WAN).

      - **Ruolo della Tecnologia Middleware:** La tecnologia middleware gioca un ruolo
      essenziale nella transizione da architetture centralizzate a distribuite. Middleware
      è il software che fornisce la connettività tra applicazioni distribuite. Si
      trova tra i livelli di applicazione e sistema operativo, offrendo servizi per
      stabilire l''interazione tra i processi delle varie applicazioni eseguite su
      host di rete. Architetture Client/Server (C/S): Le architetture client/server
      sono un modello di progettazione comune nei sistemi distribuiti. In questo modello,
      i processi coinvolti possono essere distinti in due ruoli principali:'
  - block_id: backbone-b4cbd034c
    type: list
    content: '- **Ruolo del Processo Cliente:** Il processo cliente interagisce direttamente
      con l''utente e svolge le seguenti funzioni:'
  - block_id: backbone-b4de6caba
    type: list
    content: '- Fornisce l''interfaccia utente per raccogliere le richieste dell''utente.

      - Inoltra le richieste ai server utilizzando la tecnologia middleware.

      - Visualizza le risposte dei server all''utente attraverso l''interfaccia utente.

      - **Ruolo del Processo Server:** Il processo server (o il set di processi eseguiti
      su un dato host) fornisce servizi ai clienti e svolge le seguenti funzioni:'
  - block_id: backbone-b5337436d
    type: list
    content: '- Risponde alle richieste dei clienti (non è il server che inizia la
      conversazione con il cliente).

      - Nasconde la complessità dell''intero sistema C/S all''utente.

      - Un server può a sua volta agire come un cliente, inoltrando la richiesta iniziale
      a un server secondario, senza far sapere al cliente o all''utente della catena
      di inoltro. Livelli di Applicazione (Application Layers): Nei sistemi software,
      i livelli di applicazione sono divisioni logiche o componenti che organizzano
      e separano le funzionalità del sistema.'
  - block_id: backbone-b6afb444e
    type: list
    content: '- **Livello di Presentazione (Presentation):** incentrato sulla raccolta
      degli input degli utenti e sulla presentazione dei risultati di un''elaborazione
      agli utenti del sistema. Ad esempio, un''applicazione bancaria può raccogliere
      l''input dell''utente attraverso moduli online e visualizzare i saldi o le transazioni
      in modo user-friendly.'
  - block_id: backbone-b0a77c58f
    type: list
    content: '- Raccogliere input dagli utenti attraverso interfacce utente.

      - Presentare i risultati dell''elaborazione in modo comprensibile per gli utenti.

      - **Livello di Elaborazione dell''Applicazione (Application Processing):** si
      occupa di fornire funzionalità specifiche dell''applicazione. Ad esempio, in
      un sistema bancario, le funzioni bancarie come apertura di un conto o chiusura
      di un conto appartengono a questo livello.'
  - block_id: backbone-b3d239fcf
    type: list
    content: '- Implementare le funzionalità specifiche dell''applicazione.

      - Gestire i processi aziendali e le regole di business.

      - **Livello di Gestione dei Dati (Data Management):** si occupa di gestire l''accesso
      ai dati dell''applicazione. Questo può includere l''archiviazione, il recupero
      e la manipolazione dei dati necessari per il funzionamento dell''applicazione.'
  - block_id: backbone-be3db243b
    type: paragraph
    content: <!-- Pagina PDF 57 -->
  - block_id: backbone-b85650e7b
    type: list
    content: '- Gestire l''archiviazione e il recupero dei dati.

      - Fornire meccanismi per garantire l''integrità e la coerenza dei dati. Architetture
      Client/Server a Due Livelli (Two-tier C/S): Nelle architetture client/server
      a due livelli, si distinguono due modelli principali:'
  - block_id: backbone-b208f86c0
    type: list
    content: '- **Modello Thin-Client:** Tutte le elaborazioni dell''applicazione
      e la gestione dei dati vengono eseguite sul server. Il client è responsabile
      solo dell''esecuzione del software di presentazione. Il client raccoglie l''input
      dell''utente, trasmette le richieste al server, e il server esegue tutte le
      operazioni di business logic e di gestione dei dati. Il risultato viene quindi
      restituito al client, che si occupa solo di presentare i dati all''utente.

      - **Modello Fat-Client:** Il server è responsabile solo della gestione dei dati.
      Il software sul client implementa sia la logica dell''applicazione che il software
      di presentazione. Il client è coinvolto attivamente nell''elaborazione dell''applicazione,
      eseguendo parte della logica aziendale e gestendo la presentazione dei dati.
      Il server fornisce i dati necessari, ma il client ha un ruolo significativo
      nell''elaborazione. Architetture Client/Server a Tre Livelli (Three-tier C/S):
      Nelle architetture client/server a tre livelli, ogni livello dell''architettura
      dell''applicazione viene eseguito su un processore separato. Questa divisione
      consente un miglioramento delle prestazioni rispetto all''approccio a due livelli,
      mantenendo una gestione più semplice rispetto a un modello fat-client.'
  - block_id: backbone-b9da89693
    type: list
    content: '- Ogni livello (presentazione, elaborazione dell''applicazione, gestione
      dei dati) è eseguito su un processore separato. Il client è responsabile solo
      della presentazione, il server dell''elaborazione dell''applicazione e della
      gestione dei dati. Architettura più scalabile: l''aggiunta di server può gestire
      aumenti di domanda. Architetture di Oggetti Distribuiti: Le architetture di
      oggetti distribuiti rompono la distinzione tradizionale tra client e server.
      Ogni oggetto distribuito può agire sia come client che come server, invocando
      metodi e rispondendo a invocazioni remote. La comunicazione tra oggetti è gestita
      da middleware basato sul concetto di "software bus", che rende trasparente la
      comunicazione remota. Architetture Basate su Componenti: Definiscono il software
      come un insieme di componenti software autonomi, riusabili e sostituibili che
      collaborano all''interno di un framework di componenti. Questo approccio sfrutta
      l''astrazione, in cui i componenti fungono da blocchi di costruzione per sistemi
      più complessi, nascondendo i dettagli delle strutture minori.'
  - block_id: backbone-b7416d6b8
    type: list
    content: '- **Riutilizzo a Scatola Nera:** Il software è costruito attraverso
      il riutilizzo di componenti software come entità "black-box". Ogni componente
      ha dei "plug" con regole predefinite su come può essere collegato ad altri componenti.
      Invece di dover adattare la struttura di un software per modificare la sua funzionalità,
      un utente inserisce il comportamento desiderato nei parametri del componente.

      - **Adattabilità e Variabilità:** Gli sviluppatori adattano i componenti ai
      requisiti dell''applicazione senza dover modificare il software esistente. Garantisce
      variabilità attraverso l''incapsulamento delle strutture software come componenti
      astratte e adattabilità attraverso la composizione dei componenti con parametri
      specifici. Oggetti vs. componenti:'
  - block_id: backbone-b099b28c7
    type: list
    content: '- Gli oggetti incapsulano servizi, mentre i componenti sono astrazioni
      (che possono essere utilizzate per costruire sistemi orientati agli oggetti).

      - Gli oggetti hanno identità, stato e comportamento, e sono sempre entità in
      esecuzione; i componenti, d''altra parte, sono generalmente entità statiche
      necessarie al momento della costruzione del sistema (e non necessariamente esistono
      durante l''esecuzione).

      - I componenti possono avere una granularità* più fine o più grossolana rispetto
      agli oggetti: ad esempio, classi, modelli, mix-in, moduli; i componenti dovrebbero
      avere un''interfaccia di composizione esplicita, che può essere verificata tramite
      il controllo del tipo. ** Il termine "granularità" si riferisce al livello di
      dettaglio o alla dimensione dei singoli componenti all''interno di un sistema
      o di un''architettura. In generale, una granularità più fine significa che le
      unità sono più piccole e dettagliate, mentre una granularità più grossolana
      indica unità più grandi e meno dettagliate. La scelta della granularità dipende
      spesso dai requisiti specifici del sistema e dai compromessi tra efficienza,
      flessibilità e facilità di gestione.** Sviluppo di un Framework (Framework Development):
      Lo sviluppo di un framework si concentra sulla creazione di una struttura o
      di un insieme di strumenti che possono essere utilizzati come base per costruire
      diverse applicazioni.'
  - block_id: backbone-bf239b50c
    type: list
    content: '- **Obiettivi:**'
  - block_id: backbone-b5ece4398
    type: list
    content: '- Fornire una struttura generica e riutilizzabile.

      - Definire le regole, i pattern e le interfacce comuni che facilitano lo sviluppo
      delle applicazioni.

      - Offrire funzionalità di base che possono essere estese o personalizzate secondo
      le esigenze specifiche dell''applicazione.'
  - block_id: backbone-b2de26631
    type: paragraph
    content: <!-- Pagina PDF 58 -->
  - block_id: backbone-bd5271672
    type: list
    content: '- **Utilizzo:** Gli sviluppatori di applicazioni utilizzano il framework
      come piattaforma di sviluppo, sfruttando le sue funzionalità predefinite e personalizzando
      dove necessario. Sviluppo di un''Applicazione (Application Development): Lo
      sviluppo di un''applicazione si concentra sulla creazione di un prodotto software
      specifico per risolvere un problema o soddisfare un particolare requisito.'
  - block_id: backbone-b6b3fd662
    type: list
    content: '- **Obiettivi:**'
  - block_id: backbone-b73a0dbfb
    type: list
    content: '- Risolvere un problema specifico o fornire un servizio particolare.

      - Utilizzare il framework o altre librerie di supporto per accelerare lo sviluppo
      e sfruttare funzionalità predefinite.

      - Adattare il software alle esigenze specifiche dell''utente o del contesto
      di utilizzo.

      - **Utilizzo:** Gli utenti finali interagiscono direttamente con l''applicazione
      per ottenere i benefici previsti senza dover necessariamente comprendere la
      complessità del framework utilizzato.'
- section_id: sec-bb2ea3b4
  heading: SERVICE ORIENTED ARCHITECTURE (SOA)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SERVICE ORIENTED ARCHITECTURE (SOA)
  blocks:
  - block_id: backbone-b8aa44f59
    type: paragraph
    content: 'La SOA è un''architettura software distribuita che è composta da più
      servizi autonomi. In questa architettura, i servizi sono distribuiti in modo
      tale che possano essere eseguiti su nodi diversi forniti da diversi provider
      di servizi. L''obiettivo principale di SOA è progettare servizi come componenti
      autonomi e riutilizzabili. Ciò significa che i servizi devono essere autosufficienti
      e indipendenti. SOA Protocols: Per consentire la comunicazione tra i servizi
      e lo scambio di informazioni, vengono forniti protocolli standard basati su
      Internet. Ogni servizio ha una descrizione del servizio che consente alle applicazioni
      di scoprire e comunicare con il servizio. Questa descrizione definisce il nome
      del servizio, la sua posizione e i requisiti di scambio di dati. Service Providers
      and Consumers: Un service provider è un''entità che supporta servizi utilizzati
      da più client (o consumatori di servizi). A differenza delle architetture client/server
      tradizionali, le SOA si basano sul concetto di servizi debolmente accoppiati
      che possono essere scoperti e collegati dai client (chiamati anche consumatori
      di servizi o richiedenti di servizi) con l''assistenza di broker di servizi.
      In sintesi, la SOA promuove la creazione di sistemi software flessibili, scalabili
      e riutilizzabili, in cui le funzionalità sono fornite come servizi indipendenti
      che possono essere combinati per soddisfare le esigenze specifiche di un''applicazione
      o di un processo aziendale. La comunicazione tra questi servizi avviene attraverso
      protocolli standard, e i servizi sono progettati per essere debolmente accoppiati,
      consentendo una maggiore flessibilità e riusabilità nel sistema complessivo.
      Principali concetti di progettazione SOA:'
  - block_id: backbone-bca096ec8
    type: list
    content: '- **Componenti autonomi riutilizzabili:** L''obiettivo principale della
      SOA è progettare servizi come componenti autonomi e riutilizzabili. Questo significa
      che ogni servizio dovrebbe essere autocontenuto e progettato per essere utilizzato
      in modo indipendente da altri servizi.

      - **Accoppiamento debole:** I servizi devono essere debolmente accoppiati, il
      che significa che le dipendenze tra i servizi devono essere ridotte al minimo.
      Questo favorisce la flessibilità e la facilità di aggiornamento o sostituzione
      di un servizio senza influire sugli altri.

      - **Servizi di coordinamento:** Invece di avere un servizio che dipende direttamente
      da un altro, vengono forniti servizi di coordinamento in situazioni in cui più
      servizi devono essere acceduti e l''accesso a essi deve essere sequenziato.
      Ciò può includere modelli come Service Registration, Service Brokering e Service
      Discovery.

      - **Pattern architetturali:** Vengono descritti diversi modelli architetturali
      per applicazioni orientate ai servizi, tra cui modelli di broker, modelli di
      transazione (come Two-Phase Commit, Compound e Long-Living Transaction), e modelli
      di negoziazione.

      - **Autonomia:** I servizi devono essere autonomi e indipendenti, gestendo internamente
      la propria logica e stato.

      - **Astrazione:** Nascondere i dettagli interni del servizio, fornendo solo
      le informazioni essenziali attraverso il contratto.

      - **Riutilizzabilità:** Progettare i servizi in modo che possano essere facilmente
      riutilizzati in diverse applicazioni o contesti.

      - **Componibilità:** Consentire la composizione di servizi per creare nuove
      funzionalità o applicazioni.

      - **Statoless:** I servizi devono essere progettati senza dipendenza dallo stato
      dell''altro, migliorando la scalabilità e la gestione delle risorse.

      - **Ricerca automatica (Discoverability):** I servizi devono essere facilmente
      scopribili, in modo che le applicazioni possano trovare e utilizzare i servizi
      necessari senza eccessiva complessità.'
  - block_id: backbone-b86512073
    type: paragraph
    content: <!-- Pagina PDF 59 -->
- section_id: sec-a53fdca8
  heading: BROKER PATTERN
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > BROKER PATTERN
  blocks:
  - block_id: backbone-b84843f97
    type: list
    content: '- Nel modello di Broker (Broker pattern), il broker funge da intermediario
      tra client e servizi.

      - I servizi si registrano presso il broker, rendendosi noti al broker stesso.

      - I client individuano i servizi attraverso il broker.

      - Dopo che il broker ha facilitato la connessione tra il client e il servizio,
      la comunicazione tra il client e il servizio può avvenire direttamente o attraverso
      il broker. Trasparenza:'
  - block_id: backbone-b051453d8
    type: list
    content: '- Il broker offre trasparenza sia sulla posizione che sulla piattaforma.

      - La trasparenza sulla posizione significa che se il servizio viene spostato
      in una posizione diversa, i client non ne sono consapevoli ed è necessario notificare
      solo al broker.

      - La trasparenza sulla piattaforma significa che ogni servizio può essere eseguito
      su una piattaforma hardware/software diversa e non è necessario mantenere informazioni
      sulle piattaforme su cui eseguono gli altri servizi. Comunicazione intermediata
      dal broker:'
  - block_id: backbone-bb74aa3fa
    type: list
    content: '- Con la comunicazione intermediata dal broker, il client non deve conoscere
      direttamente la posizione di un determinato servizio.

      - Invece, il client interroga il broker per ottenere informazioni sui servizi
      disponibili.

      - Inizialmente, il servizio deve registrarsi presso un broker, come descritto
      dal "Service Registration pattern" (modello di registrazione dei servizi). In
      sintesi, il Broker Pattern in un contesto SOA semplifica la gestione della comunicazione
      tra client e servizi. Fornisce una maggiore trasparenza sulla posizione e sulla
      piattaforma, consentendo una maggiore flessibilità nella distribuzione dei servizi
      e semplificando il processo di scoperta dei servizi da parte dei client.'
  - block_id: backbone-b88e8f4b3
    type: paragraph
    content: 'Service Registration Pattern: Questo pattern viene utilizzato quando
      un servizio desidera rendere noto la sua esistenza e mettere a disposizione
      le informazioni necessarie per la sua utilizzazione. Le informazioni da registrare
      includono il nome del servizio, una descrizione del servizio e la posizione
      in cui il servizio è disponibile.

      - **Richiesta di registrazione del servizio:** Il servizio invia una richiesta
      di registrazione al broker. Questa richiesta contiene le informazioni necessarie
      sul servizio, come il suo nome, una descrizione e la sua posizione.

      - **Registrazione presso il broker:** Il broker riceve la richiesta di registrazione
      e registra le informazioni del servizio nel registro dei servizi (service registry)
      gestito dal broker. Il registro dei servizi è un repository che contiene informazioni
      sui servizi disponibili nell''ambiente.

      - **Conferma di registrazione:** Dopo aver registrato il servizio con successo,
      il broker invia una conferma di registrazione (registration acknowledgment)
      al servizio. Questa conferma informa il servizio che la registrazione è stata
      completata con successo e che il servizio è ora disponibile per essere scoperto
      e utilizzato da altri client attraverso il broker. In questo modo, il Service
      Registration Pattern fornisce un meccanismo standardizzato attraverso il quale
      i servizi possono dichiarare la loro disponibilità e i dettagli necessari per
      l''interazione. Questo semplifica la scoperta dei servizi da parte dei client,
      in quanto possono consultare il registro dei servizi presso il broker per ottenere
      informazioni sui servizi disponibili nell''ambiente distribuito.'
  - block_id: backbone-b1e467a9a
    type: paragraph
    content: 'Il "Broker Forwarding Pattern" (Modello di Inoltro del Broker – White
      Pages) è un pattern architetturale che può essere utilizzato in sistemi distribuiti
      per migliorare la trasparenza della posizione e ridurre il traffico di messaggi.

      - **Il cliente invia un messaggio identificando il servizio richiesto:** Ad
      esempio, un cliente potrebbe inviare un messaggio indicando di voler prelevare
      contanti da una banca specifica.

      - **Il broker riceve la richiesta del cliente:** Il broker è un componente software
      che funge da intermediario tra il cliente e il servizio. Quando riceve la richiesta,
      determina la posizione del servizio, che è identificato da un nodo specifico,
      e inoltra il messaggio al servizio sulla posizione specificata.

      - **Il messaggio arriva al servizio e il servizio richiesto viene invocato:**
      Una volta che il messaggio raggiunge il servizio, il servizio richiesto viene
      attivato per eseguire l''azione desiderata. Ad esempio, potrebbe elaborare la
      richiesta di prelievo di contanti.'
  - block_id: backbone-b22f19505
    type: paragraph
    content: <!-- Pagina PDF 60 -->
  - block_id: backbone-b04ce9f38
    type: list
    content: '- **Il broker riceve la risposta del servizio e la inoltra al cliente:**
      Dopo che il servizio ha completato l''operazione richiesta, invia una risposta
      al broker. Il broker, quindi, inoltra questa risposta al cliente originario.'
  - block_id: backbone-b6cb67933
    type: paragraph
    content: Il "Broker Handle Pattern" (Modello di Gestione del Broker) aggiunge
      un ulteriore livello di astrazione. Invece di inoltrare direttamente ogni messaggio
      del cliente al servizio, il broker restituisce un "handle" del servizio al cliente.
      Questo "handle" è essenzialmente un riferimento o un identificatore che il cliente
      può utilizzare per comunicare direttamente con il servizio senza passare attraverso
      il broker ogni volta. Questo approccio aiuta a ridurre il traffico di messaggi,
      poiché il cliente può utilizzare l'handle per comunicare direttamente con il
      servizio quando necessario. Questo è particolarmente utile quando il cliente
      e il servizio prevedono di avere un dialogo e scambiare più messaggi tra di
      loro, poiché evita la necessità di inoltrare ogni singolo messaggio attraverso
      il broker.
  - block_id: backbone-b21a8bdeb
    type: paragraph
    content: 'Il "Service Discovery Pattern" (Modello di Scoperta dei Servizi), anche
      chiamato "yellow pages" (pagine gialle), è un modello architetturale che consente
      a un cliente di scoprire dinamicamente i servizi disponibili in un sistema distribuito.
      Questo è particolarmente utile quando il cliente sa il tipo di servizio che
      gli serve ma non conosce la sua posizione specifica all''interno della rete
      distribuita.

      - **Il cliente invia una richiesta di query al broker:** Il cliente desidera
      un servizio di un determinato tipo ma non sa dove si trova nella rete distribuita.
      Invia quindi una richiesta di query al broker, chiedendo tutti i servizi di
      un certo tipo.

      - **Il broker risponde con un elenco di servizi corrispondenti:** Il broker
      ha una conoscenza completa dei servizi disponibili nel sistema e risponde alla
      richiesta del cliente con un elenco di tutti i servizi che corrispondono al
      tipo richiesto.

      - **Il cliente seleziona un servizio specifico:** Dopo aver ricevuto l''elenco
      di servizi dal broker, il cliente può consultare e scegliere un servizio specifico
      che sembra adatto alle sue esigenze o preferenze.

      - **Il broker restituisce l''identificatore del servizio (service handle):**
      Una volta che il cliente ha selezionato un servizio, il broker restituisce un
      identificatore del servizio, noto come "service handle", al cliente. Questo
      handle può essere utilizzato dal cliente per comunicare direttamente con il
      servizio senza dover passare attraverso il broker per ogni singola comunicazione.
      Questo modello è analogo alle pagine gialle di un elenco telefonico, dove è
      possibile cercare un tipo di servizio e ottenere un elenco di aziende che offrono
      quel tipo di servizio, senza dover sapere in anticipo l''ubicazione esatta di
      ciascuna azienda. Supporto tecnologico per SOA: Sebbene le SOA siano concettualmente
      indipendenti dalla piattaforma, sono attualmente implementate con successo su
      piattaforme di tecnologia dei servizi Web.'
  - block_id: backbone-bdff074da
    type: list
    content: '- **Servizi Web:** Un servizio Web è un servizio a cui si accede utilizzando
      protocolli standard di Internet e basati su XML (eXtensible Markup Language).

      - **Protocolli per i Servizi Web:** Applicazioni client e servizi devono avere
      un protocollo di comunicazione per la comunicazione tra componenti.

      - **XML:** Il linguaggio di markup estensibile (XML) è una tecnologia che consente
      a sistemi diversi di interagire scambiando dati e testo.

      - **SOAP (Simple Object Access Protocol):** Un protocollo leggero sviluppato
      dal World Wide Web Consortium (W3C) che si basa su XML e HTTP per consentire
      lo scambio di informazioni in un ambiente distribuito. È composto da 3 parti:'
  - block_id: backbone-b213b5c29
    type: list
    content: '- Un "envelope" che definisce un framework per descrivere cosa c''è
      in un messaggio e come elaborarlo.

      - Un insieme di regole di codifica per esprimere istanze di tipi di dati definiti
      dall''applicazione.

      - Una convenzione per rappresentare chiamate di procedura remote e risposte.
      Registration Services: Un servizio di registrazione è fornito per consentire
      ai servizi di rendere disponibili le proprie funzionalità ai clienti.'
  - block_id: backbone-bfe0f36a8
    type: list
    content: '- **Service Registry per Web Services:** Nel contesto dei servizi Web,
      viene fornito un "service registry" (registro dei servizi) per consentire ai
      servizi di essere pubblicati e individuati attraverso il World Wide Web.'
  - block_id: backbone-b9cbc2992
    type: paragraph
    content: <!-- Pagina PDF 61 -->
  - block_id: backbone-bbbdee8fc
    type: list
    content: '- **Registrazione dei Servizi:** I fornitori di servizi registrano i
      propri servizi presso un registro dei servizi. Questa registrazione include
      informazioni sul servizio stesso e una descrizione del servizio, spesso realizzata
      utilizzando il linguaggio di descrizione dei servizi Web (WSDL).

      - **Ricerca dei Servizi:** I clienti che cercano un particolare servizio possono
      consultare il registro dei servizi. Questo può essere particolarmente utile
      in scenari in cui i clienti non conoscono a priori la disponibilità o la posizione
      di un servizio.

      - **Utilizzo di WSDL:** Il linguaggio di descrizione dei servizi Web (WSDL)
      è uno strumento comune per descrivere cosa fa un servizio, dove si trova e come
      invocarlo. I clienti possono utilizzare queste descrizioni per comprendere come
      interagire con un servizio specifico. Brokering and Discovery Services: In un
      ambiente distribuito, un broker di oggetti è un intermediario nelle interazioni
      tra clienti e servizi. Un esempio di tecnologia di intermediazione è un broker
      di servizi Web.'
  - block_id: backbone-b027996da
    type: list
    content: '- **UDDI Framework per Web Services:** Il framework di Universal Description,
      Discovery, and Integration (UDDI) è utilizzato per l''integrazione dei servizi
      Web. Si compone di documenti correlati e uno schema XML che definisce un protocollo
      basato su SOAP per registrare e scoprire i servizi Web.

      - **Utilizzo di UDDI:** Un broker di servizi Web può utilizzare il framework
      UDDI per fornire un meccanismo attraverso il quale i clienti possono trovare
      dinamicamente i servizi sul Web. In sostanza, questi servizi di registrazione
      e scoperta sono fondamentali in un ambiente distribuito per consentire una dinamica
      individuazione e utilizzo dei servizi. Consentono ai fornitori di servizi di
      pubblicizzare le loro offerte e ai clienti di trovare e utilizzare dinamicamente
      i servizi desiderati.'
  - block_id: backbone-b80f67223
    type: paragraph
    content: 'Web Service Protocols and Standards:

      1. UDDI Registry Query: Il cliente effettua una query al registro UDDI per individuare
      il

      servizio desiderato.

      2. Referral to WSDL Document: Il registro UDDI fornisce al cliente un riferimento
      al

      documento WSDL (Web Services Description Language).

      3. Access to WSDL Document: Il cliente accede al documento WSDL per ottenere

      informazioni dettagliate su come interagire con il servizio Web.

      4. WSDL Provides Interaction Data: Il documento WSDL fornisce i dettagli necessari
      al

      cliente per interagire con il servizio Web, inclusi i tipi di dati supportati,
      i metodi disponibili e la struttura delle richieste e delle risposte.

      5. SOAP Message Request: Il cliente invia una richiesta al servizio Web utilizzando
      un

      messaggio SOAP (Simple Object Access Protocol), che è un protocollo basato su
      XML per la comunicazione tra applicazioni.

      6. SOAP Message Response: Il servizio Web risponde con un messaggio SOAP che

      contiene i risultati o le informazioni richieste.'
- section_id: sec-f541f31c
  heading: REST (REPRESENTATIONAL STATE TRANSFER)
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > REST (REPRESENTATIONAL STATE TRANSFER)
  blocks:
  - block_id: backbone-b2b6d20ac
    type: paragraph
    content: È un’architettura di sistemi distribuiti che condivide le risorse in
      rete attraverso l’uso di API (protocollo http)
  - block_id: backbone-b558784fd
    type: list
    content: '- **Client-Server:** Esiste una separazione tra il client e il server,
      con un''interazione pull-based, dove il client richiede e il server risponde.

      - **Stateless:** La comunicazione client-server è priva di contesto, il server
      non memorizza alcun contesto del cliente tra le richieste.

      - **Cache:** I client e gli intermediari possono memorizzare in cache le risposte
      per migliorare le prestazioni.

      - **Interfaccia Uniforme:** Tutte le risorse sono accessibili attraverso un''interfaccia
      generica, ad esempio, utilizzando metodi HTTP standard come GET, POST, PUT e
      DELETE.

      - **Risorse Nominative:** Il sistema è composto da risorse che sono nominate
      utilizzando un URL (o URI).

      - **Rappresentazioni Interconnesse delle Risorse:** Le rappresentazioni delle
      risorse sono collegate tra loro utilizzando URL, consentendo al client di progredire
      da uno stato a un altro. Risorse: In architettura REST, ogni entità distinguibile
      è considerata una risorsa. Una risorsa può essere di diversi tipi, come un sito
      Web, una pagina HTML, un documento XML, un servizio Web, un dispositivo fisico,
      ecc.'
  - block_id: backbone-bc10d5be8
    type: list
    content: '- **Identificazione delle Risorse tramite URL:** Le risorse sono identificate
      in modo univoco da un URL (Uniform Resource Locator).'
  - block_id: backbone-b1ce3ebfc
    type: paragraph
    content: <!-- Pagina PDF 62 -->
- section_id: sec-4172803f
  heading: SOFTWARE ARCHITECTURAL TRANSACTION PATTERNS
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SOFTWARE ARCHITECTURAL TRANSACTION PATTERNS
  blocks:
  - block_id: backbone-bab77c656
    type: paragraph
    content: 'I servizi in un sistema software spesso encapsulano dati o forniscono
      accesso a dati che i clienti (altre parti del sistema o entità esterne) devono
      leggere o aggiornare. Molti servizi devono fornire operazioni di aggiornamento
      coordinate, il che implica che determinate operazioni potrebbero dover essere
      eseguite insieme per mantenere la coerenza dei dati. Transazioni:'
  - block_id: backbone-b47f3040d
    type: list
    content: '- Una transazione è una richiesta da parte di un cliente a un servizio.

      - Consiste in due o più operazioni che insieme eseguono una singola funzione
      logica.

      - La caratteristica chiave di una transazione è che deve essere completata interamente
      o per nulla. Questa proprietà è nota come atomicità. Proprietà ACID delle Transazioni:'
  - block_id: backbone-b13163b4b
    type: list
    content: '- **Atomicità (A):** Le transazioni sono unità indivisibili di lavoro.
      Sono o completamente completate (validate) o annullate (rollback), il che significa
      che se una parte della transazione fallisce, l''intera transazione viene annullata
      per mantenere la coerenza.

      - **Coerenza (C):** Dopo che una transazione viene eseguita, il sistema deve
      trovarsi in uno stato coerente. Questo garantisce che i dati rispettino le regole
      predefinite e i vincoli di integrità.

      - **Isolamento (I):** Il comportamento di una transazione non deve essere influenzato
      da altre transazioni. Ogni transazione dovrebbe essere eseguita in isolamento
      dalle altre, impedendo interferenze reciproche.

      - **Durabilità (D):** Le modifiche apportate da una transazione sono permanenti
      dopo il completamento. Queste modifiche devono sopravvivere a guasti di sistema,
      garantendo che i dati persistano anche in caso di arresto improvviso o perdita
      di alimentazione. In sintesi, queste proprietà ACID sono fondamentali per garantire
      l''affidabilità, l''integrità e la coerenza dei dati in un sistema distribuito
      in cui più servizi potrebbero interagire contemporaneamente. L''obiettivo è
      mantenere un alto livello di integrità dei dati e prevenire problemi che potrebbero
      derivare dall''accesso e dalla modifica concorrente dei dati da parte di diverse
      parti del sistema. Protocollo del Commit a Due Fasi: Il protocollo a due fasi
      (Two-Phase Commit Protocol) è un meccanismo utilizzato per gestire transazioni
      atomiche in sistemi distribuiti. Una transazione atomica è un insieme di operazioni
      che devono essere eseguite in modo atomico, cioè in modo tale che o tutte le
      operazioni vengano completate con successo o nessuna di esse venga eseguita
      affatto.'
  - block_id: backbone-b6ff68725
    type: list
    content: '- **CommitCoordinator (Coordinatore di Commit):** Questo è il componente
      responsabile della coordinazione della transazione. Il suo ruolo principale
      è garantire che tutti i partecipanti alla transazione siano d''accordo sul commit
      (impegno) o sull''annullamento della transazione. Il CommitCoordinator sincronizza
      le fasi di preparazione e di commit tra i partecipanti.

      - **Partecipanti:** Ogni nodo coinvolto nella transazione è rappresentato da
      un servizio partecipante.'
  - block_id: backbone-b8e632f02
    type: list
    content: '- Nel contesto di un trasferimento bancario, ci sono due partecipanti
      principali:'
  - block_id: backbone-be64f7f24
    type: paragraph
    content: ' firstBankService (Primo servizio bancario): Questo servizio gestisce
      l''account dal quale viene trasferita la somma di denaro (Account di partenza).
       secondBankService (Secondo servizio bancario): Questo servizio gestisce l''account
      a cui viene trasferita la somma di denaro (Account di destinazione).

      - **Fasi del protocollo a due fasi:**'
  - block_id: backbone-b511c3d90
    type: list
    content: '- **Fase di preparazione:** Durante questa fase, i partecipanti preparano
      la transazione e comunicano al CommitCoordinator che sono pronti per il commit.
      Il CommitCoordinator raccoglie i consensi da tutti i partecipanti.

      - **Fase di commit:** Se tutti i partecipanti sono d''accordo, il CommitCoordinator
      emette un segnale di commit a tutti i partecipanti, indicando loro di eseguire
      definitivamente la transazione. In caso contrario, il CommitCoordinator emette
      un segnale di rollback (annullamento) per annullare la transazione. L''obiettivo
      del Two-Phase Commit Protocol è garantire la coerenza delle transazioni distribuite.
      Tuttavia, è importante notare che questo protocollo potrebbe diventare un punto
      critico in termini di prestazioni, poiché richiede la sincronizzazione tra tutti
      i partecipanti prima di procedere con il commit o il rollback. Inoltre, può
      essere vulnerabile a situazioni di fallimento e richiede strategie di gestione
      delle eccezioni.'
  - block_id: backbone-b5b609e9d
    type: paragraph
    content: <!-- Pagina PDF 63 -->
  - block_id: backbone-ba7099512
    type: paragraph
    content: 'Compound Transaction Pattern: Il modello di transazione composta (Compound
      Transaction Pattern) è un approccio che offre una maggiore flessibilità rispetto
      alle transazioni piatte (flat transactions) "tutto-o-niente". In una transazione
      piatta, o tutte le operazioni vengono eseguite con successo, o nessuna di esse
      viene eseguita affatto. D''altra parte, una transazione composta consente un
      rollback parziale, il che significa che è possibile annullare solo una parte
      della transazione senza dover annullare l''intera transazione.'
  - block_id: backbone-bf07e622a
    type: list
    content: '- **Caratteristiche della transazione piatta:** La transazione bancaria
      di trasferimento menzionata precedentemente è un esempio di transazione piatta.
      Se qualcosa va storto durante qualsiasi fase della transazione, è necessario
      annullare l''intera operazione.

      - **Caratteristiche della transazione composta:** La transazione composta è
      più flessibile e consente rollback parziali. Questo modello è utile quando la
      richiesta di transazione del cliente può essere suddivisa in transazioni atomiche
      più piccole, in cui ogni transazione atomica può essere eseguita e annullata
      separatamente.

      - **Esempio:** Immaginiamo un agente di viaggi che gestisce una prenotazione
      composta, costituita da una prenotazione aerea, una prenotazione alberghiera
      e una prenotazione di un''auto a noleggio. Trattando questa prenotazione come
      una transazione composta, ogni parte (prenotazione aerea, alberghiera e auto
      a noleggio) è gestita come una transazione piatta separata. Se ad esempio c''è
      un problema con la prenotazione dell''auto a noleggio, è possibile annullare
      solo quella parte della transazione senza dover annullare anche la prenotazione
      aerea e alberghiera. In sintesi, il Compound Transaction Pattern offre maggiore
      flessibilità nella gestione delle transazioni, consentendo rollback parziali
      e trattando una transazione complessa come una serie di transazioni atomiche
      più piccole. Long-Living Transaction Pattern: Il modello di transazione a lunga
      durata (Long-Living Transaction Pattern) è un approccio progettato per gestire
      transazioni che coinvolgono interazioni umane e possono richiedere un tempo
      prolungato, possibilmente indefinito, per essere completate. Queste transazioni
      sono particolarmente complesse a causa dell''impredicibilità del comportamento
      umano e richiedono intervalli di tempo tra le diverse fasi in cui una decisione
      umana è necessaria.'
  - block_id: backbone-b1178315c
    type: list
    content: '- **Definizione di transazione a lunga durata:** Una transazione a lunga
      durata è un tipo di transazione che coinvolge attivamente una persona nel processo
      decisionale. A differenza di transazioni più standard che possono essere eseguite
      in modo automatizzato e relativamente rapido, le transazioni a lunga durata
      possono richiedere tempi prolungati a causa della variabilità e imprevedibilità
      delle azioni umane coinvolte.

      - **Suddivisione della transazione:** Il modello di transazione a lunga durata
      affronta questa complessità suddividendo la transazione in due o più transazioni
      separate, solitamente due. Queste transazioni sono organizzate in modo che intervalli
      di tempo significativi separino le diverse fasi, consentendo il coinvolgimento
      umano e la presa di decisioni tra le diverse fasi.

      - **Esempio:** Immaginiamo una transazione in cui un cliente sta richiedendo
      un prestito presso una banca. La prima transazione potrebbe coinvolgere la richiesta
      del prestito e la raccolta di informazioni iniziali. Successivamente, la transazione
      potrebbe essere sospesa, consentendo al sistema di attendere una risposta umana
      (ad esempio, l''approvazione o meno del prestito da parte di un analista del
      credito). Una volta che la decisione umana è stata presa, la seconda transazione
      può essere eseguita, comportando l''erogazione del prestito o la notifica di
      rifiuto. In sintesi, il modello di transazione a lunga durata è progettato per
      affrontare la complessità delle transazioni che richiedono decisioni umane e
      possono estendersi per periodi di tempo significativi. La suddivisione della
      transazione consente di gestire in modo efficiente le pause tra le fasi e di
      adattarsi a tempi imprevedibili.'
- section_id: sec-9c690012
  heading: NEGOTIATION PATTERN
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > NEGOTIATION PATTERN
  blocks:
  - block_id: backbone-b434015c9
    type: paragraph
    content: Il modello di negoziazione (Negotiation Pattern) è un approccio utilizzato
      in alcune architetture orientate ai servizi (SOA) per coordinare le interazioni
      tra servizi. Questo modello coinvolge negoziazioni tra agenti software, in cui
      un agente del cliente propone un'azione a un agente del servizio, che a sua
      volta cerca di soddisfare la proposta del cliente.
  - block_id: backbone-b8891a1b5
    type: list
    content: '- **Agenti coinvolti:**'
  - block_id: backbone-b977d63ee
    type: list
    content: '- **Cliente agente:** Rappresenta l''utente e agisce a suo nome. Propone
      un''azione o richiesta al servizio agente.

      - **Servizio agente:** Rappresenta il servizio e agisce a suo nome. Cerca di
      soddisfare la proposta del cliente e può interagire con altri servizi per farlo.
      Possibili azioni del cliente agente:'
  - block_id: backbone-b416ba9f7
    type: list
    content: '- **Proporre un servizio:** Il cliente agente propone un servizio al
      servizio agente, indicando che è disposto a negoziare.

      - **Richiedere un servizio:** Il cliente agente chiede specificamente un servizio
      senza possibilità di negoziazione.

      - **Rifiutare un''offerta di servizio:** Il cliente agente può rifiutare un''offerta
      fatta dal servizio agente se non è soddisfacente. Possibili azioni del servizio
      agente:'
  - block_id: backbone-b124e7aa9
    type: list
    content: '- **Offrire un servizio:** In risposta a una proposta del cliente, il
      servizio agente offre una controproposta che cerca di soddisfare i requisiti
      del cliente.'
  - block_id: backbone-bc22db710
    type: paragraph
    content: <!-- Pagina PDF 64 -->
  - block_id: backbone-bdff7a9aa
    type: list
    content: '- **Rifiutare una richiesta/proposta del cliente:** Il servizio agente
      può rifiutare la richiesta o proposta del cliente se non può soddisfarla o se
      le condizioni non sono accettabili.

      - **Accettare una richiesta/proposta del cliente:** Se il servizio agente può
      soddisfare la richiesta o proposta del cliente, può accettarla e procedere con
      l''azione richiesta. In sintesi, il modello di negoziazione è un approccio in
      cui un agente del cliente e un agente del servizio collaborano per giungere
      a un accordo riguardo a un''azione o una richiesta di servizio. Questo modello
      fornisce flessibilità consentendo la negoziazione di proposte, controproposte
      e l''esecuzione di azioni coerenti con le decisioni prese durante la negoziazione.'
- section_id: sec-c5b666d5
  heading: SERVICE INTERFACE DESIGN IN SOA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SERVICE INTERFACE DESIGN IN SOA
  blocks:
  - block_id: backbone-b0dfc7396
    type: paragraph
    content: La progettazione dell'interfaccia del servizio in un'architettura orientata
      ai servizi (SOA) è un passo cruciale nel processo di creazione di nuovi servizi.
  - block_id: backbone-b2aef3583
    type: list
    content: '- **Iniziale progettazione dei servizi:** Inizialmente, i nuovi servizi
      sono progettati utilizzando criteri di strutturazione di classi. Questo significa
      che i servizi sono concepiti inizialmente considerando la struttura delle classi,
      che può includere attributi e comportamenti associati.

      - **Modellazione dell''interazione dinamica:** Durante la modellazione dell''interazione
      dinamica, viene analizzato come avvengono le interazioni tra gli oggetti del
      cliente (client objects) e gli oggetti del servizio (service objects). Si identificano
      i flussi di dati e le comunicazioni tra il client e il servizio. Questo passo
      è cruciale per comprendere come il cliente e il servizio si scambiano informazioni
      durante l''esecuzione.

      - **Progettazione delle operazioni del servizio:** L''approccio utilizzato per
      progettare le operazioni del servizio è simile a quello utilizzato nella progettazione
      delle interfacce di classe. L''attenzione si sposta dalla struttura interna
      del servizio all''interfaccia che il servizio offre per interagire con il mondo
      esterno, in particolare con i client.

      - **Analisi dei messaggi in arrivo:** La progettazione delle operazioni del
      servizio si basa sui messaggi che arrivano al servizio. Questi messaggi rappresentano
      le richieste provenienti dai clienti o le informazioni che il servizio deve
      elaborare. Durante l''analisi dei messaggi, si determina il nome dell''operazione
      del servizio, nonché i parametri di input e output associati. In sintesi, la
      progettazione dell''interfaccia del servizio in SOA segue una metodologia che
      inizia con la strutturazione delle classi, si sposta poi verso la comprensione
      delle interazioni dinamiche tra client e servizio e si conclude con la progettazione
      delle operazioni del servizio basata sui messaggi in arrivo. Questo approccio
      mira a garantire che l''interfaccia del servizio sia ben definita e in grado
      di soddisfare le esigenze degli utenti e degli altri servizi nell''ambiente
      SOA.'
- section_id: sec-a96933a2
  heading: SERVICE COORDINATION IN SOA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SERVICE COORDINATION IN SOA
  blocks:
  - block_id: backbone-b15aaef7e
    type: paragraph
    content: 'La coordinazione dei servizi è un aspetto fondamentale nelle applicazioni
      basate su architetture orientate ai servizi (SOA) che coinvolgono più servizi.
      La coordinazione è necessaria per garantire che i servizi lavorino insieme in
      modo efficace e coerente. Ci sono due approcci principali per la coordinazione
      dei servizi in SOA:'
  - block_id: backbone-bd9abdae5
    type: list
    content: '- **Orchestrazione:** L''orchestrazione coinvolge la coordinazione di
      più servizi attraverso una logica di flusso di lavoro centralmente controllata.
      In un processo di orchestrazione, un componente centrale, noto come orchestratore,
      definisce e controlla il flusso delle attività e delle interazioni tra i servizi
      partecipanti. L''orchestrazione è particolarmente utile quando si desidera creare
      nuove applicazioni componendo e coordinando servizi esistenti in un flusso di
      lavoro specifico. Questo approccio favorisce la riutilizzabilità dei servizi,
      in quanto consente di incorporare servizi esistenti in nuove applicazioni senza
      dover modificare i servizi stessi.

      - **Coreografia:** La coreografia fornisce una coordinazione distribuita tra
      i servizi senza un controllo centralizzato. In un modello di coreografia, ciascun
      servizio è consapevole delle interazioni che deve eseguire in risposta a eventi
      specifici e collabora autonomamente con gli altri servizi coinvolti. La coreografia
      è spesso utilizzata quando la coordinazione coinvolge diversi servizi appartenenti
      a organizzazioni aziendali separate. In questo modo, la coreografia facilita
      la collaborazione tra servizi forniti da diverse organizzazioni. A differenza
      dell''orchestrazione, la coreografia è caratterizzata da un controllo distribuito,
      senza un orchestratore centrale. Terminologia: Poiché i termini orchestrazione
      e coreografia vengono spesso utilizzati in modo intercambiabile, viene utilizzato
      il termine più generale di "coordinamento" per descrivere il controllo e la
      sequenza di diversi servizi come necessario per un''applicazione SOA. Pattern
      di transazione per la coordinazione del servizio: I pattern di transazione possono
      essere utilizzati anche per coordinare i servizi, garantendo la coerenza e la
      correttezza delle transazioni distribuite.'
  - block_id: backbone-be3e16640
    type: paragraph
    content: <!-- Pagina PDF 65 -->
- section_id: sec-a742e8ac
  heading: LEGGE DI DEMETER
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > LEGGE DI DEMETER
  blocks:
  - block_id: backbone-b7d7d4593
    type: paragraph
    content: La Legge di Demeter (Law of Demeter) è un principio di progettazione
      del software che promuove la riduzione dell'accoppiamento tra le classi. Secondo
      questa legge, un metodo di una classe dovrebbe interagire solo con oggetti strettamente
      correlati e non dovrebbe accedere a oggetti che appartengono ad altre classi.
      In altre parole, un oggetto dovrebbe comunicare solo con i suoi vicini immediati
      e non "parlare agli estranei". Ciò significa che un oggetto dovrebbe limitare
      le sue dipendenze agli oggetti con cui ha una relazione diretta, come il proprio
      oggetto stesso, gli oggetti passati come argomenti al metodo, gli oggetti a
      cui fa riferimento tramite i suoi attributi, gli oggetti creati dal metodo o
      gli oggetti a cui fa riferimento tramite una variabile globale. La Legge di
      Demeter mira a migliorare la manutenibilità e la flessibilità del codice, riducendo
      la dipendenza tra le classi e favorendo una struttura più modulare e comprensibile.
- section_id: sec-6c8de80d
  heading: CLASSI STRUTTURATE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CLASSI STRUTTURATE
  blocks:
  - block_id: backbone-b4ac5b2e0
    type: paragraph
    content: 'UML (Unified Modeling Language) è un linguaggio di modellazione visuale
      ampiamente utilizzato nel campo dell''ingegneria del software per descrivere,
      progettare e documentare i sistemi software. Una "structured class" in UML è
      una classe che ha una struttura interna complessa, composta da ruoli o parti
      che realizzano il suo comportamento. Structured Class e Struttura Interna: Una
      classe strutturata è una classe che non è semplicemente un insieme di attributi
      e metodi, ma ha una struttura interna più complessa. Questa struttura interna
      è formata da ruoli o parti che contribuiscono a definire il comportamento complessivo
      della classe. Quindi, al contrario di una classe "semplice", una structured
      class contiene componenti interne che contribuiscono in modo specifico al funzionamento
      complessivo della classe. Parti Strutturate: Le parti che costituiscono la struttura
      interna di una classe strutturata possono essere anch''esse classi strutturate.
      Questo consente una strutturazione gerarchica, dove le parti possono essere
      ulteriormente scomposte in sotto-parti, permettendo una chiara espressione di
      modelli multilivello. Connettore e Associazione:'
  - block_id: backbone-bf6e84e4d
    type: list
    content: '- In UML, un connettore viene utilizzato per rappresentare un''associazione
      in un contesto specifico.

      - L''associazione rappresenta una relazione tra le parti o ruoli all''interno
      della classe strutturata.

      - I connettori sono utilizzati per visualizzare i percorsi di comunicazione
      tra le diverse parti della classe strutturata. In sintesi, una classe strutturata
      in UML è un modo di modellare classi più complesse, con una struttura interna
      che coinvolge ruoli, parti e, se necessario, una gerarchia di classi strutturate.
      L''utilizzo di connettori consente di rappresentare le relazioni e le comunicazioni
      tra le diverse parti della classe. Usi delle Classi Strutturate:'
  - block_id: backbone-b3cc1b75c
    type: list
    content: '- **Blocchi Fondamentali di un''applicazione:**'
  - block_id: backbone-bd740b588
    type: list
    content: '- Le classi strutturate possono essere utilizzate come mattoni fondamentali
      per la costruzione di un''applicazione.

      - Offrono una rappresentazione grafica degli elementi di progettazione.

      - Possono nascondere i dettagli di implementazione, permettendo un''astrazione
      potente.

      - **Strumento di Astrazione Potente:**'
  - block_id: backbone-bd7dd8b14
    type: list
    content: '- Le classi strutturate servono come uno strumento di astrazione potente
      in quanto lo stesso costrutto può essere applicato a diversi livelli semantici.

      - Questo facilita la progettazione e la comprensione di sistemi complessi.

      - **Comunicazione Chiara e Comprensione dell''Architettura di Sistema:**'
  - block_id: backbone-b016fd18d
    type: list
    content: '- Consentono una comunicazione chiara e una comprensione dell''architettura
      di sistema.

      - L''incapsulamento rigoroso del comportamento aiuta a definire in modo chiaro
      le interazioni.

      - **Interazioni Limitate a Comunicazioni Basate su Messaggi:**'
  - block_id: backbone-ba5af816f
    type: list
    content: '- Le interazioni sono limitate a comunicazioni basate su messaggi, che
      vengono passati attraverso interfacce esterne (porte).

      - Ciò promuove un approccio a messaggi per la comunicazione tra parti del sistema.'
  - block_id: backbone-b9abd6f87
    type: paragraph
    content: <!-- Pagina PDF 66 -->
  - block_id: backbone-b61263cc2
    type: paragraph
    content: 'Unità di Design Autonoma:'
  - block_id: backbone-b4d200f3a
    type: list
    content: '- Una classe strutturata è considerata un''unità di design autonoma.

      - L''incapsulamento rigoroso assicura che l''implementazione sia indipendente
      dall''ambiente circostante.

      - Le porte possono svolgere un ruolo di mediazione bidirezionale. Progettazione
      e Test Unitario Indipendenti: Le classi strutturate possono essere progettate
      e testate in modo indipendente, poiché l''incapsulamento garantisce che l''ambiente
      veda solo la porta della classe strutturata. In sintesi, l''uso di classi strutturate
      fornisce un modo organizzato ed efficiente per progettare, comunicare e implementare
      sistemi complessi, con un''enfasi particolare sulla chiarezza, sull''incapsulamento
      e sulla progettazione indipendente delle unità.'
- section_id: sec-94f729a3
  heading: DIAGRAMMA DI DISTRIBUZIONE – DEPLOYMENT DIAGRAM
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DIAGRAMMA DI DISTRIBUZIONE – DEPLOYMENT
    DIAGRAM
  blocks:
  - block_id: backbone-bde65e896
    type: paragraph
    content: La configurazione della piattaforma descrive la soluzione hardware/software
      che definisce come la funzionalità di un sistema può essere distribuita su nodi
      fisici. Questo spiega la relazione tra gli elementi del modello e la loro implementazione,
      nonché il loro deployment. La configurazione della piattaforma viene ottenuta
      definendo la configurazione attraverso l'uso di un diagramma di deployment e
      allocando gli elementi di sistema (artefatti) ai nodi di questo diagramma.
  - block_id: backbone-bdc53ff82
    type: paragraph
    content: 'Deployment Model Modeling Elements (Elementi di Modellazione del Modello
      di Deployment):

      - **Node (Nodo):** Rappresenta una risorsa computazionale in esecuzione a livello
      fisico, come un nodo di elaborazione o un dispositivo. I nodi possono essere
      processori che eseguono il software di sistema o dispositivi controllati da
      un processore.

      - **Connection (Connessione):** Rappresenta un meccanismo di comunicazione,
      inclusi il mezzo fisico e il protocollo software. Cos''è un Nodo? Rappresenta
      una risorsa computazionale in esecuzione e generalmente ha almeno la memoria
      e spesso la capacità di elaborazione. Può essere un dispositivo fisico o un
      ambiente di esecuzione specifico. Cos''è un Connector? Un connector rappresenta
      un meccanismo di comunicazione descritto da un mezzo fisico e da un protocollo
      software. Cos''è il Deployment? Il deployment è l''assegnazione o la mappatura
      degli artefatti* software ai nodi fisici durante l''esecuzione. Gli artefatti
      sono le entità che vengono deployate sui nodi fisici, come processi assegnati
      a computer o file, eseguibili, tabelle del database, pagine web, ecc. Cos''è
      la Manifestazione? La manifestazione è l''implementazione fisica di un elemento
      di modello come un artefatto. È la relazione tra l''elemento di modello e l''artefatto
      che lo implementa. Gli elementi di modello sono tipicamente implementati come
      un insieme di artefatti, come file sorgenti, file eseguibili, file di documentazione,
      ecc. Cos''è una Deployment Specification? Una Deployment Specification è una
      specifica dettagliata dei parametri del deployment di un artefatto su un nodo.
      Può definire valori che parametrizzano l''esecuzione dell''artefatto. ** Artefatti
      = entità che vengono distribuite sui nodi fisici**'
  - block_id: backbone-b41ed858e
    type: paragraph
    content: <!-- Pagina PDF 67 -->
- section_id: sec-a3a49433
  heading: DESIGN PATTERNS
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DESIGN PATTERNS
  blocks:
  - block_id: backbone-b88047aa4
    type: paragraph
    content: 'La progettazione del software orientato agli oggetti è un processo complesso
      che coinvolge la creazione di programmi informatici organizzati in modo che
      le entità fondamentali siano gli "oggetti", che raggruppano dati e funzionalità
      correlate. Ogni oggetto è un''istanza di una "classe", che definisce la struttura
      e il comportamento dell''oggetto. Una delle maggiori difficoltà che il progettista
      deve affrontare è l’individuazione di un insieme di oggetti. Gli oggetti devono
      essere identificati correttamente, devono essere riusabili e le relazioni tra
      di essi devono essere ben definite. Questo processo richiede una comprensione
      approfondita del dominio del problema e delle relazioni tra le entità coinvolte.
      Caratteristiche:'
  - block_id: backbone-bfd47678c
    type: list
    content: '- Gli oggetti dovrebbero rappresentare soluzioni a problemi comuni che
      si presentano durante lo sviluppo del software. Favoriscono il riuso del codice,
      impedendo al progettista di dover "reinventare la ruota" ogni volta che affronta
      un nuovo problema. Consentono di imparare dagli altri, evitando errori comuni
      e promuovendo la condivisione di conoscenze.

      - **Linguaggio comune:** Gli oggetti consentono di definire un linguaggio comune
      che semplifica la comunicazione tra coloro che lavorano al progetto. Questo
      riduce la possibilità di fraintendimenti e promuove una comprensione più chiara
      tra i membri del team.

      - **Strutture valide:** Indirizzano verso la scrittura di codice che utilizza
      strutture valide, migliorando la qualità complessiva del software.

      - **Buona progettazione:** In genere, portano a una buona progettazione del
      software, semplificando la manutenzione in tutte le sue forme (adattativa, perfettiva,
      preventiva e correttiva).

      - **Limitazioni:** Nonostante i vantaggi, la progettazione orientata agli oggetti
      non risolve tutti i problemi.'
- section_id: sec-f20703ae
  heading: CLASSIFICAZIONE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > CLASSIFICAZIONE
  blocks:
  - block_id: backbone-b43f1c476
    type: paragraph
    content: 'Classificazione in base allo scopo (purpose):'
  - block_id: backbone-bd48f249a
    type: list
    content: '- **Creazionali:** Gestiscono il processo di creazione di oggetti.

      - **Strutturali:** Definiscono la struttura del sistema in termini di composizione
      di classi e oggetti. Si basano su concetti di ereditarietà e polimorfismo.

      - **Comportamentali:** Modellano il comportamento del sistema, definendo le
      responsabilità delle sue componenti e le modalità di interazione. Classificazione
      in base al raggio di azione (scope):'
  - block_id: backbone-b34f3edb6
    type: list
    content: '- **Classi:** Riguarda le relazioni fra classi e sottoclassi, spesso
      basate su concetti di ereditarietà. Queste relazioni sono statiche e definite
      a tempo di compilazione.

      - **Oggetti:** Riguarda le relazioni tra oggetti, che possono cambiare durante
      l''esecuzione del programma. Sono più dinamiche rispetto alle relazioni tra
      classi.'
- section_id: sec-4de1e11a
  heading: DESCRIZIONE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DESCRIZIONE
  blocks:
  - block_id: backbone-b0ae1541b
    type: paragraph
    content: La descrizione dei design pattern fornisce un approfondimento dettagliato
      su come sono strutturati e come possono essere utilizzati nei processi di progettazione
      del software.
  - block_id: backbone-b1c96f3bf
    type: list
    content: '- **Nome e Classificazione:** Il nome del design pattern illustra l''essenza
      del pattern, fornendo un linguaggio comune tra i progettisti. La classificazione
      identifica il pattern in termini di scopo e raggio di azione, aiutando a comprendere
      quando e come applicarlo.

      - **Motivazione:** La motivazione fornisce uno scenario astratto che descrive
      il problema al quale il design pattern mira a rispondere. Può anche includere
      precondizioni necessarie per l''applicabilità del pattern.

      - **Applicabilità:** Questa sezione descrive le situazioni specifiche in cui
      il design pattern può essere applicato con successo. Aiuta a capire in quali
      contesti il pattern può essere più efficace.

      - **Struttura:** Rappresenta graficamente la configurazione di elementi che
      compongono il design pattern. Questo include relazioni, responsabilità e collaborazioni
      tra classi e oggetti. È uno schema di soluzione astratta, non una soluzione
      specifica per un progetto particolare.

      - **Partecipanti:** Indica le classi e gli oggetti che fanno parte del design
      pattern, specificando le loro responsabilità. Aiuta a comprendere come le diverse
      entità interagiscono all''interno del pattern.'
  - block_id: backbone-b21b2a45f
    type: paragraph
    content: <!-- Pagina PDF 68 -->
  - block_id: backbone-ba21e2db7
    type: list
    content: '- **Conseguenze:** Descrive i risultati che si ottengono applicando
      il design pattern. Questi risultati possono includere vantaggi e svantaggi associati
      all''uso del pattern.

      - **Implementazioni:** Fornisce tecniche e suggerimenti pratici per implementare
      il design pattern. Questo può includere considerazioni specifiche del linguaggio
      di programmazione o altre raccomandazioni.

      - **Codice di esempio:** Presenta frammenti di codice che illustrano come implementare
      il design pattern in un determinato linguaggio di programmazione. Questi esempi
      pratici aiutano i progettisti a comprendere l''implementazione concreta del
      pattern.

      - **Usi conosciuti:** Fornisce esempi di applicazione del design pattern in
      sistemi reali. Questi esempi pratici dimostrano come il pattern può essere utilizzato
      in contesti del mondo reale.

      - **Pattern correlati:** Indica altri design pattern correlati, offrendo un
      collegamento a soluzioni simili o complementari che possono essere considerate
      durante il processo di progettazione. In sintesi, la descrizione dei design
      pattern fornisce una guida completa per comprendere, applicare e implementare
      questi schemi di soluzione nel contesto dello sviluppo del software.'
- section_id: sec-6b8237df
  heading: FRAMEWORK
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > FRAMEWORK
  blocks:
  - block_id: backbone-bc984a6f2
    type: paragraph
    content: Un framework è un insieme di strumenti e convenzioni che forniscono una
      struttura per lo sviluppo di software. A differenza di una libreria, che è un
      insieme di funzioni che possono essere chiamate dal tuo codice, un framework
      è più simile a un'architettura predefinita che fornisce linee guida su come
      organizzare e sviluppare il tuo software.
  - block_id: backbone-b3afaaa70
    type: list
    content: '- **Design Riutilizzabile:** Un framework offre un design riutilizzabile
      per un sistema o una parte di esso. Questo significa che è possibile utilizzare
      il framework come base per progetti simili senza dover reinventare la ruota
      ogni volta.

      - **Classi Astratte:** Nel contesto dei framework, le classi astratte sono classi
      che contengono almeno un metodo astratto, ovvero un metodo che deve essere implementato
      dalle classi derivate. Le classi astratte forniscono uno scheletro o un template
      per le implementazioni specifiche.

      - **Personalizzazione da Parte dello Sviluppatore:** Gli sviluppatori utilizzano
      il framework come uno scheletro per la propria applicazione. Personalizzano
      il framework implementando le classi astratte e le interfacce secondo le esigenze
      specifiche del loro progetto.

      - **Struttura Statica del Sistema:** Il framework definisce la struttura statica
      del sistema, cioè l''organizzazione e la relazione tra le diverse parti del
      software. Vantaggi:'
  - block_id: backbone-b16dd3dcd
    type: list
    content: '- **Riuso del Design:** Gli sviluppatori possono riutilizzare il design
      del framework come punto di partenza per sviluppare nuove applicazioni.

      - **Riuso del Codice:** Il codice già implementato nel framework può essere
      riutilizzato, contribuendo a una maggiore efficienza nello sviluppo.

      - **Progettazione Orientata agli Oggetti:** I framework sono spesso basati su
      principi di progettazione orientata agli oggetti, che promuovono la modularità
      e la manutenibilità del codice. Classe Astratta: Una classe astratta è una classe
      che contiene almeno un metodo astratto, cioè un metodo che è dichiarato, ma
      non è implementato nella classe astratta stessa. Le classi astratte forniscono
      uno scheletro o un modello per le classi derivate che devono implementare i
      metodi astratti. Pattern: I pattern sono spesso utilizzati nella progettazione
      di framework. I pattern sono soluzioni generali per problemi ricorrenti che
      si verificano durante lo sviluppo del software. Essi possono essere considerati
      come "mattoni" che vengono utilizzati nella costruzione di un framework, fornendo
      soluzioni comuni e testate per determinati tipi di problemi.'
  - block_id: backbone-b97443807
    type: paragraph
    content: <!-- Pagina PDF 69 -->
- section_id: sec-55cd69c4
  heading: ABSTRACT FACTORY
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ABSTRACT FACTORY
  blocks:
  - block_id: backbone-b8b1f3a5b
    type: paragraph
    content: 'L''Abstract Factory è un pattern creazionale che fornisce un''interfaccia
      per la creazione di famiglie di oggetti correlati senza specificarne le classi
      concrete. Questo è particolarmente utile quando si desidera sviluppare un sistema
      indipendente dalle modalità di creazione dei prodotti con cui opera. Motivazione:
      Un esempio comune di utilizzo dell''Abstract Factory è nella realizzazione di
      strumenti per lo sviluppo di interfacce utente (UI) che devono supportare diversi
      tipi di "look & feel". Per garantire la portabilità di un''applicazione tra
      diverse modalità di interfaccia utente, è importante che gli oggetti non siano
      direttamente "cablati" nel codice, ma che l''applicazione utilizzi un''interfaccia
      comune fornita dalla factory. Classificazione: L''Abstract Factory rientra nella
      categoria creazionale basato su oggetti, poiché si concentra sulla creazione
      di oggetti, in particolare di famiglie di oggetti correlati. Applicabilità:'
  - block_id: backbone-bee5a0b2b
    type: list
    content: '- A sistemi che devono essere indipendenti dalle modalità di creazione
      dei prodotti con cui operano.

      - A sistemi che devono poter essere configurati per utilizzare famiglie di prodotti
      diverse.

      - Il client (l''applicazione) non deve essere legato a una specifica famiglia
      di oggetti. Partecipanti:'
  - block_id: backbone-bf461f8e9
    type: list
    content: '- **AbstractFactory e ConcreteFactory:**'
  - block_id: backbone-ba3e598fd
    type: list
    content: '- L''AbstractFactory dichiara un''interfaccia per la creazione di prodotti
      astratti.

      - La ConcreteFactory implementa l''interfaccia dell''AbstractFactory per creare
      prodotti concreti.

      - **AbstractProduct e ConcreteProduct:**'
  - block_id: backbone-bede1ecc4
    type: list
    content: '- L''AbstractProduct dichiara un''interfaccia comune per un tipo di
      prodotto.

      - La ConcreteProduct implementa l''interfaccia dell''AbstractProduct e fornisce
      l''implementazione concreta di un prodotto.

      - **Applicazione Client:** Utilizza le interfacce definite da AbstractFactory
      e AbstractProduct per interagire con i prodotti senza dover conoscere le classi
      concrete. Conseguenze:'
  - block_id: backbone-bb56f30b9
    type: list
    content: '- Le classi concrete sono isolate e sotto controllo.

      - La famiglia di prodotti può essere cambiata rapidamente perché l''intera factory
      compare in un unico punto del codice.

      - Aggiungere nuove famiglie di prodotti richiede la ricompilazione poiché l''insieme
      di prodotti gestiti è legato all''interfaccia della factory.'
- section_id: sec-a07612c9
  heading: FACTORY METHOD
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > FACTORY METHOD
  blocks:
  - block_id: backbone-b87967805
    type: paragraph
    content: 'Il Factory Method è un pattern creazionale che ha come scopo principale
      quello di definire un''interfaccia per creare un oggetto in una classe, lasciando
      alle sottoclassi il compito di modificare il tipo di oggetto che verrà istanziato.
      Questo consente di decidere dinamicamente, a tempo di esecuzione, quale specifico
      oggetto deve essere creato. Motivazione: Nel contesto dei framework, le classi
      astratte definiscono spesso le relazioni tra gli elementi del dominio, ma è
      compito delle sottoclassi fornire l''implementazione concreta degli oggetti.
      Il Factory Method è utile quando una classe non può sapere in anticipo quali
      classi di oggetti deve creare o quando si desidera che le sottoclassi scelgano
      gli oggetti da creare.'
  - block_id: backbone-b76ee2555
    type: paragraph
    content: <!-- Pagina PDF 70 -->
  - block_id: backbone-b3466803c
    type: paragraph
    content: 'Classificazione: Il Factory Method è un pattern creazionale basato su
      classi, poiché coinvolge la definizione di classi per creare oggetti. Applicabilità:'
  - block_id: backbone-b47506833
    type: list
    content: '- Una classe non è in grado di sapere in anticipo le classi di oggetti
      che deve creare.

      - Una classe vuole che le sue sottoclassi scelgano gli oggetti da creare.

      - Le classi delegano la responsabilità di creazione. Partecipanti:'
  - block_id: backbone-b98ae56cb
    type: list
    content: '- **Product e ConcreteProduct:**'
  - block_id: backbone-b0ae8f549
    type: list
    content: '- `Product` è l''interfaccia comune per gli oggetti creati dal Factory
      Method.

      - `ConcreteProduct` è un''implementazione concreta di `Product`.

      - **Creator e ConcreteCreator:**'
  - block_id: backbone-b3edef717
    type: list
    content: '- `Creator` dichiara il Factory Method, che restituisce un oggetto di
      tipo `Product`.

      - `ConcreteCreator` implementa il Factory Method e crea un oggetto di tipo `ConcreteProduct`.
      Conseguenze:'
  - block_id: backbone-b5fefdd9b
    type: list
    content: '- Elimina la necessità di riferirsi a classi dipendenti dall''applicazione
      all''interno del codice.

      - Fornisce una maggiore flessibilità alle sottoclassi per cambiare il tipo di
      oggetto creato senza modificare il codice client. In breve, il Factory Method
      è utile quando si desidera che le sottoclassi forniscano l''implementazione
      concreta degli oggetti da creare, offrendo una maggiore flessibilità nel cambiare
      il tipo di oggetto istanziato senza modificare il codice cliente.'
- section_id: sec-b784c2a0
  heading: ADAPTER
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ADAPTER
  blocks:
  - block_id: backbone-b73f4aa9f
    type: paragraph
    content: 'L''Adapter è un pattern strutturale utilizzato quando si ha una classe
      con un''interfaccia incompatibile con quella richiesta da un client, e si desidera
      adattare l''interfaccia della classe esistente in modo che possa essere utilizzata
      dal client senza modificare il codice sorgente della classe stessa. In altre
      parole, fornisce un modo per far collaborare classi con interfacce diverse che
      altrimenti non potrebbero lavorare insieme. Motivazione: Immagina di avere un
      editor che consente di disegnare e comporre elementi grafici, dove l''astrazione
      chiave è rappresentata da un singolo oggetto grafico. Ora, se vuoi integrare
      un nuovo componente che, per qualche motivo, ha un''interfaccia incompatibile
      con l''editor, puoi utilizzare l''Adapter per creare un ponte tra l''interfaccia
      del nuovo componente (Adaptee) e quella richiesta dall''editor (Target). Applicabilità:
      Si usa quando si vuole riutilizzare una classe esistente, ma la sua interfaccia
      è incompatibile con quella desiderata. Partecipanti:'
  - block_id: backbone-ba4cffd24
    type: list
    content: '- **Client:** È il componente che richiede un''interfaccia specifica.

      - **Target:** È l''interfaccia desiderata dal client. L''Adapter implementa
      questa interfaccia.

      - **Adapter ed Adaptee:**'
  - block_id: backbone-b38d82211
    type: list
    content: '- **Adapter:** È la classe che adatta l''interfaccia dell''Adaptee in
      quella richiesta dal Target.

      - **Adaptee:** È la classe esistente con un''interfaccia incompatibile che deve
      essere adattata. Conseguenze: È necessario prendere in considerazione l''effort
      necessario all''adattamento. Creare un Adapter può richiedere lavoro aggiuntivo
      a seconda della complessità dell''Adaptee e del livello di adattamento richiesto.'
  - block_id: backbone-b33a64722
    type: paragraph
    content: <!-- Pagina PDF 71 -->
  - block_id: backbone-b6fb636c0
    type: paragraph
    content: In sintesi, l'Adapter è un pattern utile quando si ha una classe esistente
      con un'interfaccia incompatibile e si desidera riutilizzarla in un contesto
      in cui si richiede un'interfaccia diversa. L'Adapter funge da intermediario,
      consentendo al client di interagire con l'Adaptee attraverso un'interfaccia
      compatibile.
- section_id: sec-a1efc4f4
  heading: COMPOSITE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > COMPOSITE
  blocks:
  - block_id: backbone-b0cf1f3eb
    type: paragraph
    content: 'Il Composite è un pattern strutturale utilizzato per creare strutture
      gerarchiche di oggetti, in modo che oggetti singoli (Leaf) e oggetti composti
      (Composite) possano essere trattati in modo uniforme. Questo è particolarmente
      utile in situazioni in cui si desidera manipolare una gerarchia di oggetti in
      modo uniforme, ad esempio nelle applicazioni grafiche in cui si devono gestire
      sia le forme geometriche di base che gli oggetti più complessi costruiti da
      queste forme. Motivazione: Nei contesti come gli editor grafici, è comune avere
      oggetti singoli come linee o cerchi, ma anche oggetti composti come gruppi di
      figure. Il Composite consente di trattare entrambi i tipi di oggetti in modo
      uniforme, semplificando il codice del client. Classificazione: Il Composite
      è un pattern strutturale basato su oggetti, poiché coinvolge la composizione
      di oggetti per formare strutture più complesse. Applicabilità: Si usa quando
      si vogliono rappresentare gerarchie di oggetti in modo che oggetti semplici
      e oggetti compositi siano trattati in modo uniforme. Partecipanti:'
  - block_id: backbone-b031bcd59
    type: list
    content: '- **Component e Composite:**'
  - block_id: backbone-bc897977a
    type: list
    content: '- `Component` è l''interfaccia comune per tutti gli oggetti, sia Leaf
      che Composite.

      - `Composite` è l''oggetto composto, che può contenere altri oggetti Component.

      - **Leaf:** Rappresenta gli oggetti "foglia" o oggetti atomici che non hanno
      sottocomponenti.

      - **Client:** Utilizza l''interfaccia comune `Component` per interagire con
      oggetti sia Leaf che Composite. Conseguenze:'
  - block_id: backbone-b3ccb1f5f
    type: list
    content: '- I client sono semplificati perché gli oggetti singoli e quelli composti
      sono trattati allo stesso modo.

      - L''aggiunta di nuovi oggetti `Leaf` o `Composite` è semplice, e questi possono
      sfruttare il codice dell''applicazione client già esistente.

      - Può rendere il sistema troppo generico. Non è possibile imporre restrizioni
      su quali tipi di oggetti un oggetto composito può contenere. In sintesi, il
      Composite è utile quando si desidera trattare in modo uniforme sia gli oggetti
      singoli che quelli composti. La sua struttura gerarchica consente una maggiore
      flessibilità nella creazione e manipolazione di strutture complesse di oggetti.'
- section_id: sec-0c48fb88
  heading: DECORATOR
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > DECORATOR
  blocks:
  - block_id: backbone-bb7fce8f8
    type: paragraph
    content: 'Il pattern Decorator è un pattern strutturale il cui scopo principale
      è aggiungere dinamicamente funzionalità (responsabilità) ad un oggetto senza
      modificare la sua interfaccia. Questo è particolarmente utile quando si vuole
      estendere il comportamento di un oggetto in modo flessibile e dinamico, senza
      ricorrere all''eccessivo uso di sottoclassi. Motivazione: Uno scenario classico
      di applicazione per il pattern Decorator si trova nell''implementazione di interfacce
      utente, dove si possono aggiungere dinamicamente funzionalità come un testo
      scorrevole o un particolare'
  - block_id: backbone-be6e0b394
    type: paragraph
    content: <!-- Pagina PDF 72 -->
  - block_id: backbone-b5dea0775
    type: paragraph
    content: 'bordo a un oggetto senza modificare la sua struttura di base. L''alternativa
      statica, come il subclassing, può essere limitata poiché è a livello di classe
      e non di oggetto. Classificazione: Il Decorator è un pattern strutturale basato
      su oggetti, poiché coinvolge la composizione di oggetti per estendere le loro
      funzionalità. Applicabilità:'
  - block_id: backbone-b29c69975
    type: list
    content: '- Si applica quando è necessario aggiungere responsabilità agli oggetti
      in modo trasparente e dinamico.

      - Si applica quando il subclassing non è adatto o potrebbe generare una gerarchia
      di classi troppo complessa. Partecipanti:'
  - block_id: backbone-b46b79d43
    type: list
    content: '- **Component e ConcreteComponent:**'
  - block_id: backbone-b78afe5cc
    type: list
    content: '- `Component` definisce l''interfaccia comune per gli oggetti che possono
      essere decorati.

      - `ConcreteComponent` è l''oggetto di base che può essere decorato.

      - **Decorator e ConcreteDecorator(s):**'
  - block_id: backbone-b27e35dc9
    type: list
    content: '- `Decorator` è l''interfaccia comune per tutti i decorator.

      - `ConcreteDecorator` è l''implementazione concreta del decorator. Aggiunge
      responsabilità all''oggetto di base. Conseguenze:'
  - block_id: backbone-bee1b0c1d
    type: list
    content: '- Maggiore flessibilità rispetto all''approccio statico di subclassing.

      - Evita la definizione di strutture gerarchiche complesse, che potrebbero diventare
      difficili da gestire. Alcune note:'
  - block_id: backbone-bc3aadf21
    type: list
    content: '- Nella programmazione in Java, il pattern Decorator è ampiamente utilizzato
      nella definizione degli Stream di I/O, come `BufferedInputStream` o `DataInputStream`.

      - Sebbene il pattern Decorator sia simile al pattern Composite, la finalità
      è diversa. Il Decorator serve ad aggiungere responsabilità in modo dinamico,
      mentre il Composite si concentra sulla composizione di oggetti per formare strutture
      più complesse.

      - È anche simile al pattern Adapter, ma mentre l''Adapter si limita a un adattamento
      limitato di un''interfaccia, il Decorator estende le funzionalità dell''oggetto
      in modo più flessibile. In breve, il pattern Decorator è utile quando si desidera
      estendere le funzionalità di un oggetto in modo dinamico e flessibile, senza
      dover ricorrere a una gerarchia di classi troppo complessa.'
- section_id: sec-f0e053ab
  heading: OBSERVER
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > OBSERVER
  blocks:
  - block_id: backbone-b8e72cce8
    type: paragraph
    content: 'Il pattern Observer è un pattern comportamentale che ha come scopo principale
      definire una dipendenza uno a molti tra oggetti, mantenendo basso il grado di
      accoppiamento. In altre parole, il pattern Observer consente a un oggetto, chiamato
      Subject, di notificare automaticamente gli oggetti interessati, chiamati Observer,
      quando il suo stato cambia, in modo che tutti gli oggetti dipendenti possano
      aggiornarsi automaticamente. Motivazione: Un tipico scenario in cui si applica
      il pattern Observer è nelle applicazioni con interfaccia grafica (GUI), realizzate
      secondo il paradigma Model-View-Control. Quando il Model cambia, gli oggetti
      che implementano la View devono aggiornarsi per riflettere correttamente lo
      stato attuale del Model. Classificazione: Il pattern Observer è un pattern comportamentale
      basato su oggetti, poiché coinvolge la definizione di come gli oggetti interagiscono
      tra loro durante il cambiamento di stato.'
  - block_id: backbone-ba63916d6
    type: paragraph
    content: <!-- Pagina PDF 73 -->
  - block_id: backbone-b10dd57f2
    type: paragraph
    content: 'L''approccio corretto: Il pattern Observer prevede che gli osservatori
      si registrino presso l''oggetto osservato. In questo modo, è l''oggetto osservato
      che notifica ogni cambiamento di stato agli osservatori. Quando un osservatore
      rileva la notifica, può interrogare l''oggetto osservato o svolgere altre operazioni
      indipendenti dal valore specifico dello stato. Applicabilità:'
  - block_id: backbone-be4d9bdf3
    type: list
    content: '- Si applica quando un''azione può essere scomposta in due ambiti, ciascuno
      dei quali è incapsulato in oggetti separati per mantenere basso il livello di
      accoppiamento.

      - È utile per gestire le modifiche di oggetti conseguenti alla variazione dello
      stato di un oggetto. Partecipanti:'
  - block_id: backbone-bd3ec728a
    type: list
    content: '- **Subject e ConcreteSubject:**'
  - block_id: backbone-b766c7d3c
    type: list
    content: '- `Subject` definisce l''interfaccia comune per l''oggetto osservato.

      - `ConcreteSubject` è l''oggetto osservato concreto che implementa l''interfaccia
      di `Subject`.

      - **Observer e ConcreteObserver:**'
  - block_id: backbone-b9dada9e9
    type: list
    content: '- `Observer` definisce l''interfaccia comune per gli osservatori.

      - `ConcreteObserver` è l''oggetto osservatore concreto che implementa l''interfaccia
      di `Observer`. Conseguenze:'
  - block_id: backbone-bbcaa4e6a
    type: list
    content: '- L''accoppiamento tra `Subject` ed `Observer` è astratto; il `Subject`
      conosce solo la lista degli osservatori.

      - La notifica è una comunicazione di tipo broadcast; il `Subject` non si occupa
      di quanti sono gli osservatori registrati.

      - Attenzione perché una modifica al `Subject` scatena una serie di modifiche
      su tutti gli osservatori e su tutti gli oggetti da questi dipendenti. In sintesi,
      il pattern Observer è utile quando si vuole stabilire una dipendenza uno-a-molti
      tra oggetti in modo che quando uno cambia, tutti gli altri interessati vengano
      notificati e aggiornati automaticamente. Questo riduce l''accoppiamento e aumenta
      la flessibilità nella gestione degli stati e delle dipendenze nel sistema.'
- section_id: sec-d562cf22
  heading: TEMPLATE METHOD
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > TEMPLATE METHOD
  blocks:
  - block_id: backbone-bfcb7bd6a
    type: paragraph
    content: 'Il pattern Template Method è un pattern comportamentale che ha come
      scopo principale definire la struttura di un algoritmo all''interno di un metodo
      di una classe base (AbstractClass), delegando alcuni passi specifici alle sottoclassi
      concrete (ConcreteClass). Questo pattern è particolarmente utile quando si desidera
      fornire un''implementazione generica di un algoritmo e permettere alle sottoclassi
      di personalizzare alcune parti dell''algoritmo senza modificarne la struttura
      di base. Motivazione: Considera un framework per costruire applicazioni in grado
      di gestire documenti diversi. Il Template Method definisce un algoritmo in base
      ad operazioni astratte che saranno definite nelle sottoclassi specifiche. In
      questo modo, è possibile fornire una struttura di base per l''algoritmo e lasciare
      alle sottoclassi la definizione di passi variabili. Classificazione: Il Template
      Method è un pattern comportamentale basato su classi, in quanto coinvolge la
      definizione di comportamenti comuni nella classe astratta e la delega di comportamenti
      specifici alle sottoclassi concrete. Applicabilità:'
  - block_id: backbone-b682e36bb
    type: list
    content: '- È utilizzato per implementare la parte invariante di un algoritmo,
      lasciando alle sottoclassi la definizione degli step variabili.

      - È utile quando ci sono comportamenti comuni che possono essere inseriti nel
      template. Partecipanti:'
  - block_id: backbone-bd19b3039
    type: list
    content: '- **AbstractClass e ConcreteClass:**'
  - block_id: backbone-b76038673
    type: list
    content: '- `AbstractClass` è la classe astratta che definisce il Template Method,
      che contiene la struttura generale dell''algoritmo.'
  - block_id: backbone-be160fa90
    type: paragraph
    content: <!-- Pagina PDF 74 -->
  - block_id: backbone-b102d730e
    type: list
    content: '- `ConcreteClass` è la classe concreta che implementa le operazioni
      astratte definite nella classe astratta.

      - **Client:** Utilizza l''`AbstractClass` per eseguire l''algoritmo. Conseguenze:'
  - block_id: backbone-b421cfb6c
    type: list
    content: '- I metodi template permettono il riuso del codice, poiché la struttura
      generale dell''algoritmo è definita nella classe astratta.

      - Creano una struttura di controllo invertito, dove è la classe padre che chiama
      le operazioni ridefinite nelle sottoclassi e non viceversa.

      - Per controllare l''estendibilità delle sottoclassi, i metodi richiamati dal
      template sono chiamati metodi gancio (hook).

      - I metodi hook possono essere implementati, offrendo un comportamento standard
      che la sottoclasse può volendo ridefinire. Alcune Note:'
  - block_id: backbone-be7ff2359
    type: list
    content: '- Il Template Method è simile al Factory Method nel senso che entrambi
      coinvolgono l''invocazione di metodi astratti tramite un''interfaccia e la rimandata
      implementazione di metodi a classi concrete non note.

      - **Tuttavia, indirizzano problemi diversi:** il Template Method generalizza
      un algoritmo, mentre il Factory Method crea e restituisce un''istanza di classe
      concreta per sganciare il cliente dalla scelta del tipo specifico. In sintesi,
      il Template Method è utile quando si vuole fornire una struttura generica per
      un algoritmo e consentire alle sottoclassi di personalizzarne alcune parti senza
      modificare la struttura complessiva dell''algoritmo. Questo promuove il riuso
      del codice e la flessibilità nell''estensione del comportamento.'
- section_id: sec-7fedc49b
  heading: STRATEGY
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > STRATEGY
  blocks:
  - block_id: backbone-b7dfda588
    type: paragraph
    content: 'Il pattern Strategy è un pattern comportamentale che ha come scopo principale
      definire ed incapsulare una famiglia di algoritmi in modo da renderli intercambiabili
      indipendentemente dal client che li usa. Questo pattern permette di definire
      un''interfaccia comune per un insieme di algoritmi, incapsulare ciascun algoritmo
      in una classe separata, e permettere ai client di selezionare dinamicamente
      l''algoritmo da utilizzare. Motivazione: Considera una situazione in cui hai
      una famiglia di algoritmi, ad esempio algoritmi di ordinamento come QuickSort,
      BubbleSort e MergeSort. Invece di implementare tutti questi algoritmi all''interno
      di una singola classe, il pattern Strategy suggerisce di creare una classe separata
      per ciascun algoritmo, tutte implementando la stessa interfaccia (Strategy).
      In questo modo, puoi facilmente cambiare l''algoritmo utilizzato in un''applicazione
      senza dover modificare il client. Classificazione: Il pattern Strategy è un
      pattern comportamentale basato su oggetti, poiché coinvolge la definizione di
      comportamenti (algoritmi) all''interno di oggetti. Applicabilità:'
  - block_id: backbone-beb9ae848
    type: list
    content: '- Molte classi correlate differiscono solo per il comportamento. Il
      pattern fornisce un modo per avere un''interfaccia comune.

      - Sono necessarie più varianti di uno stesso algoritmo, a seconda dei tipi di
      dato in ingresso o delle condizioni operative. Partecipanti:'
  - block_id: backbone-b69d88317
    type: list
    content: '- **Strategy e ConcreteStrategy:**'
  - block_id: backbone-be7393c11
    type: list
    content: '- `Strategy` è l''interfaccia comune per tutti gli algoritmi.

      - `ConcreteStrategy` sono le classi concrete che implementano le varianti specifiche
      degli algoritmi.

      - **Client:** Utilizza un oggetto `Strategy` per invocare un algoritmo specifico.
      Conseguenze:'
  - block_id: backbone-b7709cac4
    type: list
    content: '- Il pattern separa l''implementazione degli algoritmi dal contesto
      dell''applicazione, consentendo una maggiore flessibilità.'
  - block_id: backbone-b63463693
    type: paragraph
    content: <!-- Pagina PDF 75 -->
  - block_id: backbone-b7007352a
    type: list
    content: '- Le diverse strategie eliminano i blocchi condizionali che sarebbero
      necessari inserendo tutti i diversi comportamenti in una unica classe.

      - Lo svantaggio principale è che i client devono conoscere le diverse strategie,
      ma questo è spesso accettabile per ottenere la flessibilità desiderata. Note
      Aggiuntive:'
  - block_id: backbone-be278e550
    type: list
    content: '- Il pattern Strategy elimina la necessità di utilizzare un subclassing
      e permette di comporre il comportamento degli oggetti.

      - Se l''uso del subclassing della classe client per aggiungere un algoritmo
      non sarebbe una buona scelta, il pattern Strategy offre un''alternativa più
      flessibile. In conclusione, il pattern Strategy è utile quando hai una famiglia
      di algoritmi e vuoi rendere il loro utilizzo intercambiabile senza influire
      sul client. Incapsulare gli algoritmi in classi separate permette una maggiore
      manutenibilità e facilità di estensione del sistema.'
  - block_id: backbone-bca8b0927
    type: paragraph
    content: <!-- Pagina PDF 76 -->
- section_id: sec-bc1d1372
  heading: METRICHE DI STRUTTURA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > METRICHE DI STRUTTURA
  blocks: []
- section_id: sec-119b50dd
  heading: MISURE DI PROGETTAZIONE PRELIMINARE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MISURE DI PROGETTAZIONE PRELIMINARE
  blocks:
  - block_id: backbone-b74a7e577
    type: list
    content: '- **Misure Intermodulari:** Si prendono in considerazione le dipendenze
      tra i moduli secondo l''architettura di sistema sviluppata nella fase di progettazione.
      Queste misure considerano come i vari moduli interagiscono tra loro.

      - **Misure Intramodulari:** Si riferiscono alle caratteristiche dei singoli
      moduli. Vengono utilizzate durante la progettazione dettagliata e l''implementazione
      di ciascun modulo. Definizione di Modulo: Un modulo è una sequenza contigua
      di istruzioni del programma, delimitata da elementi di confine. Impatto delle
      Decisioni di Architettura:'
  - block_id: backbone-bcf374b06
    type: list
    content: '- Le decisioni prese durante la fase di progettazione preliminare influenzano
      molte qualità importanti del software risultante, come facilità di implementazione,
      affidabilità e manutenibilità.

      - Le misure di progettazione preliminare possono fornire un feedback cruciale
      sulle caratteristiche del sistema in fase di sviluppo. Relazioni tra Progettazione
      Preliminare e Codice: Esiste una relazione uno a uno tra i moduli indicati nella
      progettazione e i moduli effettivamente presenti nel codice.'
  - block_id: backbone-b749db260
    type: list
    content: '- **Corrispondenza Connessione Intermodulare:** Le connessioni tra moduli
      indicate nella progettazione devono corrispondere alle referenze intermodulari
      nel codice.

      - **Corrispondenza Interfaccia Dati Intermodulare:** Le interfacce dati intermodulari
      definite nella progettazione devono riflettersi nei dati condivisi tra i moduli
      nel codice. In breve, la progettazione preliminare svolge un ruolo cruciale
      nel determinare l''architettura del sistema e influenza le qualità chiave del
      software risultante. La correlazione tra progettazione preliminare e codice
      assicura che l''implementazione rispecchi fedelmente le decisioni prese durante
      la progettazione del sistema.'
- section_id: sec-be74a6f4
  heading: ARCHITETTURA DEI MODULI – STRUCTURE CHART
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > ARCHITETTURA DEI MODULI – STRUCTURE CHART
  blocks:
  - block_id: backbone-b92fed208
    type: paragraph
    content: L'architettura dei moduli di un sistema software può essere rappresentata
      mediante un grafo, denotato da S = {N, R}.
  - block_id: backbone-b0b0cbbec
    type: list
    content: '- N rappresenta l''insieme dei nodi, dove ogni nodo n corrisponde a
      un modulo.

      - R rappresenta l''insieme delle relazioni, dove ogni arco r indica una relazione
      tra due sottosistemi (ad esempio, chiamata di procedura, flusso di dati, ecc.).
      Modularità: La modularità è l''estensione in cui il software è composto da componenti
      discrete in modo che una modifica a una componente abbia un impatto minimo sulle
      altre componenti. Un''elevata modularità è desiderabile perché i programmi con
      una bassa modularità sono ritenuti più soggetti agli errori, meno manutenibili,
      meno riutilizzabili, ecc. Attributi della Modularità:'
  - block_id: backbone-bd4399480
    type: list
    content: '- **Coesione:** L''estensione in cui un singolo modulo svolge un compito
      ben definito.

      - **Accoppiamento:** Il grado di interdipendenza tra i moduli.

      - **Morfologia:** La forma della struttura complessiva del sistema.

      - **Flusso di Informazioni:** Le interconnessioni che un modulo ha con altri
      moduli nel sistema, ovvero il fan-in e il fan-out del modulo.'
- section_id: sec-6501b803
  heading: MORFOLOGIA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MORFOLOGIA
  blocks:
  - block_id: backbone-b9596ec82
    type: paragraph
    content: La morfologia si riferisce alla forma generale dell'architettura di un
      sistema software. In altre parole, è una caratteristica che descrive la struttura
      e la disposizione complessiva dei componenti del sistema.
  - block_id: backbone-bde1c1ff1
    type: list
    content: '- **Dimensione (Size):** Indica il numero totale di nodi e archi nel
      grafo che rappresenta l''architettura del sistema.

      - **Profondità (Depth):** Rappresenta il percorso più lungo dal nodo radice
      a un nodo foglia. In altre parole, è la lunghezza massima di una catena di nodi
      dal vertice principale al punto più distante nel sistema.

      - **Ampiezza (Width):** Indica il numero massimo di nodi in qualsiasi livello
      del grafo. Questo offre un''idea della larghezza massima del sistema a ogni
      livello di profondità.

      - **Rapporto tra Archi e Nodi (Edge-to-Node Ratio):** Misura la densità di connettività
      del sistema. Indica quanti archi ci sono rispetto al numero totale di nodi.
      Un rapporto più alto potrebbe indicare una maggiore complessità delle connessioni
      nel sistema.'
  - block_id: backbone-bcf6df6b5
    type: paragraph
    content: <!-- Pagina PDF 77 -->
- section_id: sec-de247289
  heading: TREE IMPURUTY
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > TREE IMPURUTY
  blocks:
  - block_id: backbone-b7fc08fe4
    type: paragraph
    content: 'La "Tree Impurity" è una misura utilizzata per valutare quanto un grafo
      G sia diverso da un albero. In altre parole, si cerca di misurare quanto il
      grafo differisce da una struttura ad albero, che è spesso associata a una buona
      organizzazione e chiarezza nella progettazione. La Tree Impurity può essere
      definita come la differenza tra il numero massimo di archi possibili in un grafo
      e il numero effettivo di archi nel grafo, diviso per il numero massimo di archi
      possibili in un albero:'
  - block_id: backbone-b6705799f
    type: paragraph
    content: 𝑚(𝐺) = 𝑛𝑢𝑚𝑒𝑟𝑜 𝑚𝑎𝑠𝑠𝑖𝑚𝑜 𝑑𝑖 𝑎𝑟𝑐ℎ𝑖 𝑝𝑜𝑠𝑠𝑖𝑏𝑖𝑙𝑖 𝑖𝑛 𝑢𝑛 𝑔𝑟𝑎𝑓𝑜−𝑛𝑢𝑚𝑒𝑟𝑜 𝑑𝑖 𝑎𝑟𝑐ℎ𝑖
      𝑛𝑒𝑙 𝑔𝑟𝑎𝑓𝑜
  - block_id: backbone-b0bd61e39
    type: paragraph
    content: 𝑛𝑢𝑚𝑒𝑟𝑜 𝑚𝑎𝑠𝑠𝑖𝑚𝑜 𝑑𝑖 𝑎𝑟𝑐ℎ𝑖 𝑝𝑜𝑠𝑠𝑖𝑏𝑖𝑙𝑖 𝑖𝑛 𝑢𝑛 𝑎𝑙𝑏𝑒𝑟𝑜
  - block_id: backbone-b7e39ff8f
    type: list
    content: '- m(G) = 0 indica che il grafo G è un albero, cioè ha la struttura più
      "albero-like" possibile.

      - m(G) = 1 indica che il grafo G è completamente diverso da un albero, ovvero
      ha il massimo numero possibile di differenze rispetto a una struttura ad albero.
      In generale, un valore più piccolo di m(G) è desiderabile, poiché indica una
      maggiore similarità del grafo a una struttura ad albero, che è spesso associata
      a progettazioni più chiare e organizzate.'
- section_id: sec-84c059ee
  heading: INTERNAL REUSE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > INTERNAL REUSE
  blocks:
  - block_id: backbone-b445a1c70
    type: paragraph
    content: 'La "Internal Reuse" è una misura che indica l''estensione del riutilizzo
      dei moduli all''interno dello stesso prodotto software. È importante notare
      che questa misura si concentra sul riutilizzo interno al prodotto, in contrapposizione
      al "riutilizzo esterno" che potrebbe coinvolgere il riutilizzo di moduli tra
      prodotti diversi. La formula specifica proposta per la "Internal Reuse" è la
      seguente:'
  - block_id: backbone-befab7b5d
    type: paragraph
    content: '𝑟(𝐺) = 𝑒−𝑛+ 1 dove:'
  - block_id: backbone-bd58cc3fc
    type: list
    content: '- r(G) rappresenta la misura di riutilizzo interno.

      - e è il numero di archi nel grafo (rappresentante i moduli).

      - n è il numero di nodi nel grafo (rappresentante i moduli).

      - +1 è un termine aggiunto per compensare alcune delle limitazioni della misura.
      La misura r(G) viene interpretata come quanto il sistema riutilizza i moduli
      internamente. Un valore più basso di r(G) indica un maggiore riutilizzo interno.'
  - block_id: backbone-b2f5d2e0c
    type: list
    content: '- Se r(G) = 0, allora non c''è alcun riutilizzo interno, ogni modulo
      è utilizzato solo una volta.

      - Se r(G) < 0, indica un''alta probabilità di moduli che vengono utilizzati
      più volte, implicando un riutilizzo significativo. Critiche:'
  - block_id: backbone-bf01e9923
    type: list
    content: '- **Mancanza di Considerazione per Chiamate Ripetute:** La misura non
      tiene conto delle chiamate ripetute ai moduli. Se un modulo è chiamato più volte,
      la misura potrebbe non riflettere accuratamente il grado di riutilizzo.

      - **Non Considera la Dimensione dei Moduli Riutilizzati:** La misura non tiene
      conto della dimensione o della complessità dei moduli riutilizzati. Un modulo
      piccolo riutilizzato molte volte potrebbe avere lo stesso impatto di un modulo
      grande riutilizzato poche volte. In sintesi, la "Internal Reuse" è una misura
      che cerca di quantificare il grado di riutilizzo dei moduli all''interno di
      uno stesso prodotto. Tuttavia, ha alcune limitazioni e critiche, come la mancanza
      di considerazione per le chiamate ripetute e la mancanza di considerazione per
      la dimensione dei moduli riutilizzati.'
- section_id: sec-f374b7f3
  heading: INFORMATION FLOW – FLUSSO DI INFORMAZIONI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > INFORMATION FLOW – FLUSSO DI INFORMAZIONI
  blocks:
  - block_id: backbone-bbc333b67
    type: paragraph
    content: 'Il concetto di flusso di informazioni in ingegneria del software si
      basa sull''idea che la complessità di un modulo dipenda da due fattori principali:
      la complessità del codice del modulo e la complessità delle interfacce del modulo,
      cioè le sue connessioni con l''ambiente circostante.'
  - block_id: backbone-bbec7e4a8
    type: list
    content: '- **Inter-modular Attribute (Attributo Inter-modulare):** Si riferisce
      al livello totale di flusso di informazioni attraverso un sistema, dove i moduli
      sono considerati come componenti atomiche.

      - **Intra-modular Attribute (Attributo Intra-modulare):** Si riferisce al livello
      totale di flusso di informazioni tra un modulo individuale e il resto del sistema.
      Misure del Flusso di Informazioni:'
  - block_id: backbone-bb4b7f1b0
    type: list
    content: '- **Local Flow of Information (Flusso Locale di Informazioni):**'
  - block_id: backbone-bc9881a28
    type: list
    content: '- **Diretto:** Avviene quando un modulo chiama un altro modulo.

      - **Indiretto:** Si verifica attraverso i valori restituiti da un modulo all''altro.

      - **Global Flow of Information (Flusso Globale di Informazioni):** Coinvolge
      l''informazione passata tra i moduli tramite una struttura dati globale condivisa.'
  - block_id: backbone-b9bc9766b
    type: paragraph
    content: <!-- Pagina PDF 78 -->
  - block_id: backbone-ba2d9b846
    type: paragraph
    content: 'Utilità delle Misure del Flusso di Informazioni:'
  - block_id: backbone-b4e07ccee
    type: list
    content: '- **Identificazione delle Parti Critiche del Sistema:** Le misure del
      flusso di informazioni possono essere utilizzate per individuare le parti critiche
      di un sistema software, cioè le parti che sono fortemente coinvolte nella trasmissione
      di informazioni.

      - **Individuazione dei Punti di Stress nel Sistema:** Le misure del flusso di
      informazioni possono evidenziare i punti di stress nel sistema, dove la quantità
      di informazioni che attraversa determinati moduli è significativamente elevata.

      - **Comprensione dei Problemi di Progettazione Potenziali:** Forniscono una
      visione sui possibili problemi di progettazione, poiché la complessità derivante
      dai flussi di informazioni può indicare aree in cui la struttura del sistema
      potrebbe essere migliorata. In sintesi, le misure del flusso di informazioni
      forniscono un modo per valutare quanto le informazioni si muovono attraverso
      il sistema e possono essere utilizzate per identificare aree critiche, punti
      di stress e potenziali problemi di progettazione all''interno di un sistema
      software.'
  - block_id: backbone-b91f5bdd1
    type: paragraph
    content: 'Fan-in e Fan-out: I concetti di "Fan-in" e "Fan-out" sono misure utilizzate
      per quantificare i flussi di informazioni in un sistema software, concentrandosi
      su un modulo specifico.

      - Il "Fan-in" di un modulo M è il numero totale di flussi locali (diretti e
      indiretti) che terminano in M, più il numero di flussi globali (strutture dati)
      da cui M recupera informazioni.

      - Il "Fan-out" di un modulo M è il numero totale di flussi locali (diretti e
      indiretti) che iniziano in M, più il numero di flussi globali (strutture dati)
      che vengono aggiornati da M. Interpretazione delle Misure Fan-in e Fan-out:

      - **Alto Fan-out:** Indica che il modulo influenza o controlla molti altri moduli.

      - **Alto Fan-in:** Indica che il modulo è influenzato o controllato da molti
      altri moduli.

      - **Modulo Centrale:** Un modulo con alto fan-in e fan-out è spesso al centro
      del sistema, influenzando molti moduli e venendo influenzato da molti altri.

      - **Modulo Periferico:** Un modulo con basso fan-in e fan-out è generalmente
      ai margini del sistema, con meno connessioni dirette con altri moduli.

      - **Complessità e Potenziali Problemi di Progettazione:** Moduli con elevati
      valori di fan-in e fan- out possono essere complessi e più inclini a errori
      di progettazione. Questo perché possono svolgere più di una funzione, e se la
      struttura di progettazione deve essere modificata, gli aspetti da cambiare non
      sono concentrati in un unico punto, ma sono distribuiti tra vari moduli interconnessi.
      Misura del Flusso di Informazioni (Henry & Kafura): L''Information Flow (IF)
      per un modulo 𝑀௜ secondo la proposta di Henry-Kafura è definito come:'
  - block_id: backbone-b7898c595
    type: paragraph
    content: 𝐼𝐹(𝑀௜) = [𝑓𝑎𝑛−𝑖𝑛(𝑀௜) ∗𝑓𝑎𝑛−𝑜𝑢𝑡(𝑀௜)]ଶ L'IF per un sistema con n moduli
      è la somma dell'IF per ciascun modulo nel sistema. La misura originale di Henry-Kafura
      include sia i flussi di controllo che i flussi di informazioni nel conteggio
      di fan-in e fan-out. Una variante proposta da Shepperd include solo i flussi
      di informazioni. In sintesi, fan-in e fan-out sono misure che riflettono quanto
      un modulo è coinvolto nelle informazioni che fluiscono attraverso il sistema.
      Valori elevati possono indicare complessità e potenziali problemi di progettazione,
      mentre la misura dell'Information Flow cerca di quantificare questi flussi in
      modo più consolidato.
- section_id: sec-ce9c16f5
  heading: STRUTTURA DI MISURAZIONE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > STRUTTURA DI MISURAZIONE
  blocks:
  - block_id: backbone-bbcef79dd
    type: paragraph
    content: 'La "Struttura di Misurazione" in ambito software si riferisce al modo
      in cui viene organizzato e gestito il flusso di controllo, il flusso di dati
      e la struttura dei dati all''interno di un programma durante la progettazione
      dettagliata e l''implementazione. Si suddivide in tre componenti principali:'
  - block_id: backbone-b801cab33
    type: list
    content: '- **Struttura del Flusso di Controllo:** Rappresenta la sequenza di
      esecuzione delle istruzioni del programma. In altre parole, indica l''ordine
      in cui vengono eseguite le diverse parti del codice.

      - **Flusso di Dati:** Traccia dei dati mentre vengono creati o gestiti dal programma.
      Aiuta a comprendere come i dati si muovono attraverso il programma e come vengono
      manipolati.

      - **Struttura Dati:** Rappresenta l''organizzazione dei dati indipendentemente
      dal programma. Si concentra sulla disposizione e la gestione dei dati nel contesto
      complessivo.'
  - block_id: backbone-b2d776a92
    type: paragraph
    content: <!-- Pagina PDF 79 -->
  - block_id: backbone-b1f7e9328
    type: paragraph
    content: 'Rappresentazione della Struttura di un Programma: Viene rappresentata
      utilizzando un "grafo di flusso di controllo" o semplicemente "grafo di flusso".
      Questo grafo mostra le relazioni e il flusso tra diverse istruzioni del programma.
      Definizione della Complessità Strutturale: La "complessità" in termini di struttura
      viene definita utilizzando il concetto di "complessità ciclomatica". Questa
      misura offre un''indicazione della complessità del codice sorgente misurando
      il numero di cammini linearmente indipendenti attraverso il grafo di controllo.
      Struttura di Controllo di Base (BCS): Le BCS sono meccanismi essenziali di flusso
      di controllo utilizzati per costruire la struttura logica del programma. I tipi
      di BCS includono: Sequenza, Selezione, Iterazione. Strutture di Controllo Avanzate
      (ACS): Oltre alle BCS, ci sono anche le ACS, che includono Chiamata di Procedura/Funzione/Agente,
      Ricorsione (auto-chiamata), Interruzione, Concorrenza. Queste ACS aggiungono
      complessità alla struttura del programma e possono influenzare la sua esecuzione
      e il flusso di controllo.'
- section_id: sec-70d6ae7d
  heading: FLOWGRAPH – GRAFO DI FLUSSO
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > FLOWGRAPH – GRAFO DI FLUSSO
  blocks:
  - block_id: backbone-bc9169ac3
    type: paragraph
    content: 'Il grafo di flusso (Flowgraph) è un modo di modellare la struttura del
      flusso di controllo di un programma attraverso un grafo diretto (di-graph).
      Questo grafo è rappresentato come: FG = {N, E} dove N è l''insieme di nodi,
      ognuno dei quali corrisponde a un''istruzione del programma ed E è l''insieme
      di archi, che rappresentano il flusso di controllo da un''istruzione del programma
      a un''altra. Nodi Speciali nel Flowgraph:'
  - block_id: backbone-b3550180f
    type: list
    content: '- **Nodi di Procedura:** Nodi con un grado uscente di 1. Rappresentano
      il punto in cui il controllo passa a una procedura, funzione o sotto-programma.

      - **Nodi Predicato:** Nodi con un grado uscente diverso da 1. Indicano la presenza
      di un''istruzione di selezione (if) e possono condurre a percorsi diversi a
      seconda delle condizioni.

      - **Nodo di Inizio:** Nodi con un grado entrante di 0. Rappresentano il punto
      di inizio del programma o di una porzione del programma.

      - **Nodi Terminali (End):** Nodi con un grado uscente di 0. Rappresentano il
      punto di fine del programma o di una porzione del programma. Grado Entrante
      e Grado Uscente:'
  - block_id: backbone-b70a2852e
    type: list
    content: '- **Grado Uscente:** Indica il numero di archi che escono da un nodo.
      I nodi di procedura avranno un grado uscente di 1, mentre i nodi terminali avranno
      un grado uscente di 0.

      - **Grado Entrante:** Indica il numero di archi che entrano in un nodo. I nodi
      di inizio avranno un grado entrante di 0.'
  - block_id: backbone-bc1228349
    type: paragraph
    content: 'Costrutti del Flowgraph:

      - **Sequence (Sequenza):** Rappresenta un elenco sequenziale di istruzioni senza
      strutture di controllo aggiuntive.

      - **Selection (Selezione):** Indicata dai nodi predicato, rappresenta l''istruzione
      di selezione (if... then... else) e il flusso di controllo diverge a seconda
      delle condizioni.

      - **Iteration (Iterazione):** Rappresenta le istruzioni di iterazione come do...
      while o ripeti... fino a quando.

      - Procedure/Function Call (Chiamata di Procedura/Funzione): Rappresenta il passaggio
      del controllo a una procedura, funzione o sotto-programma.

      - **Recursion (Ricorsione):** Rappresenta l''auto-chiamata di una funzione all''interno
      di se stessa.

      - **Interrupt (Interruzione):** Rappresenta l''interruzione del flusso di controllo
      causato da eventi esterni o interrupt.

      - **Concurrence (Concorrenza):** Rappresenta l''esecuzione simultanea di più
      istruzioni o porzioni di codice.'
  - block_id: backbone-bc5fb8f8d
    type: paragraph
    content: <!-- Pagina PDF 80 -->
  - block_id: backbone-bdee7fea5
    type: paragraph
    content: In sintesi, il Flowgraph è uno strumento visuale che aiuta a rappresentare
      la struttura del flusso di controllo di un programma attraverso nodi e archi,
      consentendo una comprensione più chiara della logica e della sequenza delle
      istruzioni nel codice.
  - block_id: backbone-be61f4c87
    type: paragraph
    content: 'Sequencing (Sequenziazione): Il concetto di sequenziazione è indicato
      dalla notazione (F1; F2), che rappresenta la sequenza di due flowgraph F1 e
      F2. La sequenziazione è un modo di combinare due flowgraph in modo che il risultato
      sia un nuovo flowgraph che rappresenta l''esecuzione sequenziale di F1 seguito
      da F2.

      - Supponiamo di avere due flowgraph, F1 e F2.

      - La sequenza (F1; F2) viene formata unendo il nodo terminale di F1 con il nodo
      iniziale di F2.

      - In questo modo, il flusso di controllo passa da F1 a F2 senza alcuna decisione
      o iterazione tra i due. In termini pratici, questo rappresenta l''esecuzione
      di una sequenza di istruzioni nel programma, dove le istruzioni di F1 vengono
      eseguite prima di passare a F2.'
  - block_id: backbone-bd061afeb
    type: paragraph
    content: 'Nesting (Annidamento): Il concetto di annidamento è indicato dalla notazione
      F1(F2), che rappresenta l''annidamento di F2 su F1 in un punto specifico x.
      L''annidamento crea un nuovo flowgraph formando F1 e sostituendo l''arco uscente
      da x con l''intero flowgraph F2.

      - Supponiamo di avere due flowgraph, F1 e F2.

      - L''annidamento F1(F2) avviene sostituendo l''arco uscente da un nodo specifico
      x in F1 con l''intero flowgraph F2.

      - In questo modo, il flusso di controllo passa attraverso F1, raggiunge il punto
      di annidamento x, esegue F2 e quindi prosegue. L''annidamento è utilizzato per
      incorporare un flowgraph all''interno di un altro, consentendo una maggiore
      complessità e struttura nei programmi. Può essere utilizzato per rappresentare
      sottoprogrammi, funzioni o procedure che vengono chiamati da un punto specifico
      nel programma principale. Prime Flowgraphs: I "Prime Flowgraphs" sono flowgraph
      che non possono essere decomposti in modo non banale attraverso sequenziazione
      e annidamento. In altre parole, sono flowgraph elementari che rappresentano
      unità atomiche e non possono essere ulteriormente suddivisi in moduli più piccoli
      senza perdere la loro struttura e funzionalità. Ad esempio:'
  - block_id: backbone-b967ccbd7
    type: list
    content: '- **P1:** Un singolo nodo o un''istruzione senza alcuna struttura di
      controllo.

      - **D0:** Un flowgraph che rappresenta un''istruzione di selezione condizionale
      (if) senza alcuna alternativa (else).

      - **D1:** Un flowgraph che rappresenta un''istruzione di selezione condizionale
      con un''alternativa (else).

      - **D2:** Un flowgraph che rappresenta un''istruzione di selezione condizionale
      con due alternative.

      - **D3:** Un flowgraph che rappresenta un''istruzione di selezione condizionale
      con tre alternative. Le "D-Structures" sono tipiche della programmazione strutturata,
      e il "D" proviene da Edsger Dijkstra, che è stato un pioniere nella programmazione
      strutturata. Queste strutture sono fondamentali per mantenere la chiarezza e
      la comprensibilità del codice.'
  - block_id: backbone-bf94a02c4
    type: paragraph
    content: <!-- Pagina PDF 81 -->
  - block_id: backbone-b041c8592
    type: paragraph
    content: 'Prime Decomposition: Il "Prime Decomposition Theorem" (Teorema di Decomposizione
      Prime) è formulato da Fenton e Whitty. Esso afferma che ogni flowgraph può essere
      univocamente decomposto in una gerarchia di prime. Questa gerarchia è nota come
      "decomposition tree" (albero di decomposizione). L''albero di decomposizione
      mostra come il flowgraph complessivo è formato dalla combinazione di diverse
      prime flowgraphs attraverso sequenziazione e annidamento. In altre parole, il
      teorema afferma che è possibile scomporre ogni flowgraph complesso in un insieme
      di flowgraph più semplici (prime flowgraphs) che possono essere sequenziati
      o annidati per ottenere la struttura complessiva del programma.'
- section_id: sec-a3a181d8
  heading: MISURAZIONE GERARCHICA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > MISURAZIONE GERARCHICA
  blocks:
  - block_id: backbone-b08360c65
    type: paragraph
    content: 'La "Hierarchical Measurement" è un modo di definire misure per i flowgraph
      utilizzando l''albero di decomposizione. Questo approccio si basa sull''idea
      che possiamo misurare un attributo del flowgraph in modo gerarchico seguendo
      questi passaggi:'
  - block_id: backbone-b6014bd33
    type: list
    content: '- Definizione della misura per i prime flowgraphs.

      - Descrizione di come l''operazione di sequenziazione influisce sull''attributo.

      - Descrizione di come l''operazione di annidamento influisce sull''attributo.
      Depth of Nesting (Profondità di Annidamento): Questa misura indica la profondità
      degli annidamenti nel codice. Maggiore è la profondità di annidamento, maggiore
      è la complessità. La profondità di annidamento è calcolata gerarchicamente attraverso
      l''albero di decomposizione, considerando la profondità dei primes, la sequenziazione
      e l''annidamento. La profondità di annidamento n(F) per un flowgraph F può essere
      misurata in termini di:'
  - block_id: backbone-b889814c9
    type: list
    content: '- **Per i primes:** n(P1) = 0, n(P2) = n(P3) = … = n(Pk) = 1, n(D0)
      = n(D1) = n(D2) = n(D3) = 1.

      - **Per la sequenziazione:** n(F1;F2; … ;Fk) = max{n(F1), n(F2), … , n(Fk)}.

      - **Per l''annidamento:** n(F(F1,F2, … ,Fk)) = 1 + max{n(F1), n(F2), … , n(Fk)}.
      D-Structuredness (Strutturazione D): Questa misura valuta se un programma segue
      i principi della programmazione strutturata. Un programma è considerato strutturato
      se può essere composto utilizzando un numero limitato di costrutti ammissibili,
      come sequenza, selezione e iterazione. La misura di strutturazione D è calcolata
      in base ai principi della programmazione strutturata. La strutturazione D è
      una misura che verifica se un programma è strutturato secondo le definizioni
      di programmazione strutturata. La strutturazione D d(F) per un flowgraph F può
      essere misurata in termini di:'
  - block_id: backbone-b89db2e93
    type: list
    content: '- **Per i primes:** d(P1) = 1, d(D0) = d(D1) = d(D2) = d(D3) = 1, 0
      altrimenti.

      - **Per la sequenziazione:** d(F1;F2; … ;Fk) = min{d(F1), d(F2), … , d(Fk)}.

      - **Per l''annidamento:** d(F(F1,F2, … ,Fk)) = min{d(F), d(F1), d(F2), … , d(Fk)}.'
  - block_id: backbone-b32fb8ccd
    type: paragraph
    content: <!-- Pagina PDF 82 -->
- section_id: sec-1b545980
  heading: COMPLESSITA’ CICLOMATICA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > COMPLESSITA’ CICLOMATICA
  blocks:
  - block_id: backbone-bbcdd5f04
    type: paragraph
    content: 'La "Cyclomatic Complexity" è una misura della complessità di un programma
      basata sul grafo di flusso del programma. Può essere calcolata in due modi:
      basato sul grafo di flusso e basato sul codice. La formula generale per calcolare
      la complessità ciclomatica v(F) di un programma con il flowgraph F è v(F) =
      e - n + 2 dove e è il numero di archi (rappresentanti rami e cicli) nel grafo
      di flusso ed n è il numero di nodi (rappresentanti blocchi di codice sequenziale)
      nel grafo di flusso. La complessità ciclomatica misura il numero di percorsi
      linearmente indipendenti attraverso il flowgraph. I percorsi sono considerati
      linearmente indipendenti se nessun percorso nel set è una combinazione lineare
      di un altro percorso. Alternativamente, la complessità ciclomatica v(F) può
      essere misurata come v(F) = 1 + d dove d è il numero di nodi predicato (cioè,
      nodi con un grado uscente maggiore di 1) nel flowgraph. Questi nodi rappresentano
      i punti decisionali nel programma. Misura basata sul Grafo di Flusso: Questo
      approccio calcola la complessità ciclomatica contando il numero di rami e cicli
      nel grafo di flusso. L''idea è che ogni branch o ciclo aggiunge complessità
      al programma, e la formula e - n + 2 tiene conto di questi elementi. Misura
      basata sul Codice: Questo approccio conta direttamente il numero di nodi predicato
      nel grafo di flusso. I nodi predicato rappresentano decisioni nel codice, e
      la formula 1 + d riflette il fatto che la complessità è data dalla somma di
      un termine costante e il numero di decisioni. Interpretazione della Complessità
      Ciclomatica: Maggiore è la complessità ciclomatica, maggiore è il numero di
      percorsi attraverso il programma, e quindi, maggiore è la complessità del codice.
      Un valore elevato potrebbe indicare una maggiore difficoltà nella comprensione
      e nella manutenzione del codice. La complessità ciclomatica può anche essere
      vista come una misura gerarchica, poiché può essere calcolata in modo aggregato
      considerando la complessità dei singoli blocchi (primes) e combinando tali misure
      attraverso sequenziazione e annidamento. Complessità dei Primes: La complessità
      di un prime è determinata dal numero di decisioni nel blocco di codice rappresentato
      da quel prime. Aggiungendo uno, si tiene conto dell''effetto complessivo delle
      decisioni su quel blocco. La formula è v(F) = 1+d Complessità della Sequenziazione:
      La complessità di una sequenza, indicata come v(F1;F2; …;Fk), è pari alla somma
      delle complessità dei singoli componenti v(Fi) meno il numero totale di componenti
      (k) più uno. La formula è 𝒗(𝑭𝟏; 𝑭𝟐; …; 𝑭𝒌) = ∑ 𝒗(𝑭𝒊) −𝒌+ 𝟏 𝒌 𝒊ୀ𝟏. Questo significa
      che la complessità di una sequenza è influenzata dalla complessità di ciascun
      componente e dal numero totale di componenti nella sequenza. Complessità dell''Annidamento
      su un Prime dato: La complessità dell''annidamento è influenzata dalla complessità
      del prime F e dalla complessità dei singoli componenti nell''annidamento. La
      complessità dell''annidamento di componenti su un prime F è pari alla complessità
      di F più la somma delle complessità dei singoli componenti meno il numero totale
      di componenti. La formula è 𝒗(𝑭(𝑭𝟏, 𝑭𝟐, …, 𝑭𝒌) = 𝒗(𝑭) + ∑ 𝒗(𝑭𝒊) −𝒌 𝒌 𝒊ୀ𝟏. Questo
      significa che la complessità dell''annidamento è influenzata dalla complessità
      del prime \(F\) e dalla complessità dei singoli componenti nell''annidamento.
      Essential Complexity di McCabe: L''Essential Complexity di McCabe, indicata
      come ev(F), è una misura che tiene conto della complessità essenziale di un
      programma, escludendo alcune strutture di flusso che potrebbero non contribuire
      significativamente alla complessità del codice. La formula per calcolare l''Essential
      Complexity è data da ev(F) = v(F) – m dove v(F) è la complessità ciclomatica
      totale del flowgraph F e m è il numero di sottografi D0, D1, D2 e D3 presenti
      in F. In altre parole, l''Essential Complexity è la complessità ciclomatica
      meno il numero di sottografi specifici (D0, D1, D2, D3) che vengono considerati
      meno rilevanti o "essenziali" nella valutazione della complessità. Critiche
      alla Complessità Ciclomatica:'
  - block_id: backbone-bde11f1d6
    type: list
    content: '- **Vantaggi:**'
  - block_id: backbone-b96180123
    type: list
    content: '- **Misurazione Obiettiva della Complessità:** La complessità ciclomatica
      offre una misura oggettiva della complessità del programma.

      - **Svantaggi:**'
  - block_id: backbone-b2b6dd4f2
    type: list
    content: '- **Utilizzabile solo a livello di componente:** La complessità ciclomatica
      è più adatta per valutare la complessità a livello di componenti e non a livello
      di sistema completo.

      - **Differenze nell''Impegno di Programmazione:** Due programmi con lo stesso
      valore di complessità ciclomatica possono richiedere sforzi di programmazione
      differenti.

      - **Richiede Visibilità Completa del Design o del Codice:** Per calcolare la
      complessità ciclomatica, è necessaria una visibilità completa del design o del
      codice sorgente.'
  - block_id: backbone-b68b3f14e
    type: paragraph
    content: <!-- Pagina PDF 83 -->
- section_id: sec-b231ad8d
  heading: QUALITA’ DEL SOFTWARE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > QUALITA’ DEL SOFTWARE
  blocks:
  - block_id: backbone-befafbf23
    type: paragraph
    content: 'La qualità del software è un concetto complesso che riflette il grado
      in cui il software possiede una combinazione desiderata di attributi. Questa
      definizione è fornita dallo standard IEEE 1061-1998, che stabilisce una metodologia
      per le metriche di qualità del software. La qualità del software può essere
      considerata da diversi punti di vista:'
  - block_id: backbone-bb10f49f7
    type: list
    content: '- **Trascendente:** Questa prospettiva vede la qualità del software
      come un''eccellenza intrinseca, ovvero la qualità è una caratteristica intrinseca
      al software stesso.

      - **Utente:** Dal punto di vista dell''utente, la qualità del software è definita
      dalla sua adattabilità all''uso, dalla capacità di soddisfare le esigenze dell''utente,
      dalla piacevolezza nell''uso e dalla soddisfazione dell''utente.

      - **Prodotto:** Questa prospettiva considera la qualità del software in termini
      di attributi desiderati, come affidabilità, correttezza, aderenza ai requisiti
      e conformità agli standard.

      - **Organizzazione:** Dal punto di vista dell''organizzazione, la qualità del
      software può essere misurata in termini di costi, profitti, efficienza, efficacia
      e valore aggiunto all''organizzazione, inclusa la capacità di produrre un prodotto
      commercializzabile.'
  - block_id: backbone-bbee6f10f
    type: paragraph
    content: 'Il Triangolo della Qualità (Modello di Qualità McCall): Il Triangolo
      della Qualità, basato sul modello di qualità di McCall, rappresenta un approccio
      per valutare la qualità del software. Questo modello include tre lati del triangolo:

      - **Tempo di Vita del Prodotto:** Indica la durata del prodotto software nel
      tempo, compreso il periodo di sviluppo, manutenzione e eventualmente il suo
      successivo rimpiazzo o dismissione.

      - **Percentuale delle Attività:** Rappresenta la distribuzione percentuale delle
      attività durante il ciclo di vita del software. Queste attività includono la
      consegna del software, le attività di transizione (ad esempio, formazione degli
      utenti), e le attività di revisione (ad esempio, manutenzione correttiva).

      - **Nuovo Uso del Sistema Legacy:** Indica l''uso continuato o l''integrazione
      del sistema legacy con nuove attività o nuove funzionalità. Questo modello riflette
      l''idea che la qualità del software è un concetto complesso che va oltre la
      fase di sviluppo iniziale e considera il ciclo di vita completo del software,
      inclusa la manutenzione e l''evoluzione nel tempo.'
- section_id: sec-5be522ae
  heading: INDICI E ATTRIBUTI DI QUALITA’ DEL SOFTWARE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > INDICI E ATTRIBUTI DI QUALITA’ DEL SOFTWARE
  blocks:
  - block_id: backbone-b65b3fcaf
    type: paragraph
    content: 'Gli indici di qualità del software sono misure utilizzate per valutare
      diversi aspetti della qualità di un prodotto software. Questi indici possono
      essere suddivisi in diverse categorie in base alle attività coinvolte. Le principali
      categorie sono le attività operative, di revisione e di transizione. Attività
      Operative: Questi indici misurano la qualità del prodotto in termini di esecuzione
      effettiva delle sue funzioni e della sua aderenza alle specifiche.'
  - block_id: backbone-b30404b22
    type: list
    content: '- **i1 Correttezza:** Indica fino a che punto un prodotto soddisfa le
      specifiche e gli obiettivi degli utenti. Risponde alla domanda: "Fa ciò che
      voglio?".

      - **i2 Affidabilità:** Misura fino a che punto ci si può aspettare che un prodotto
      esegua la sua funzione prevista con la precisione richiesta. Risponde alla domanda:
      "Lo fa in modo accurato tutto il tempo?".

      - **i3 Efficienza:** Indica la quantità di risorse di calcolo e di codice richiesta
      da un prodotto per eseguire una funzione. Risponde alla domanda: "Si eseguirà
      sul mio hardware nel modo più efficiente possibile?".

      - **i4 Integrità:** Valuta fino a che punto l''accesso al software o ai dati
      da parte di persone non autorizzate può essere controllato. Risponde alla domanda:
      "È sicuro?".

      - **i5 Usabilità:** Misura lo sforzo richiesto per imparare, utilizzare, preparare
      input e interpretare l''output di un prodotto. Risponde alla domanda: "Posso
      usarlo?". Attività di Revisione: Questi indici riflettono la facilità con cui
      il prodotto può essere corretto, testato e modificato dopo essere diventato
      operativo.'
  - block_id: backbone-b951c39af
    type: list
    content: '- **i6 Manutenibilità:** Misura lo sforzo richiesto per individuare
      e correggere un errore in un programma operativo. Risponde alla domanda: "Posso
      correggerlo?".

      - **i7 Testabilità:** Indica lo sforzo richiesto per testare un prodotto per
      garantire che svolga la sua funzione prevista. Risponde alla domanda: "Posso
      testarlo?".'
  - block_id: backbone-b887b1f06
    type: paragraph
    content: <!-- Pagina PDF 84 -->
  - block_id: backbone-b90cda09f
    type: list
    content: '- **i8 Flessibilità:** Misura lo sforzo richiesto per modificare un
      prodotto operativo. Risponde alla domanda: "Posso cambiarlo?". Attività di Transizione:
      Questi indici considerano la facilità con cui il prodotto può essere trasferito,
      riutilizzato in altri contesti, interfacciato con altri sistemi e adattato a
      nuovi requisiti.'
  - block_id: backbone-bbab200a4
    type: list
    content: '- **i9 Portabilità:** Indica lo sforzo richiesto per trasferire un prodotto
      da un ambiente hardware e/o software a un altro. Risponde alla domanda: "Sarà
      possibile utilizzarlo su un''altra macchina?".

      - **i10 Riutilizzabilità:** Valuta fino a che punto un prodotto (o parti di
      esso) può essere riutilizzato in altre applicazioni. Risponde alla domanda:
      "Potrò riutilizzare parte del software?".

      - **i11 Interoperabilità:** Misura lo sforzo richiesto per collegare un prodotto
      con un altro. Risponde alla domanda: "Potrò interfacciarlo con un altro sistema?".

      - **i12 Evolvibilità:** Indica lo sforzo richiesto per aggiornare il prodotto
      per soddisfare nuovi requisiti. Risponde alla domanda: "È facile aggiornarlo
      quando cambiano i requisiti?". Gli Attributi di Qualità:'
  - block_id: backbone-bd6883aa2
    type: list
    content: '- **a1 Complessità:** Misura il livello di comprensibilità e verificabilità
      degli elementi del software e delle loro interazioni.

      - **a2 Precisione:** Indica la precisione delle computazioni e degli output
      del software.

      - **a3 Completezza:** Valuta la piena implementazione delle funzionalità richieste
      dal software.

      - **a4 Coerenza:** Misura l''uso di tecniche di progettazione uniformi e notazioni
      coerenti nell''implementazione.

      - **a5 Tolleranza agli Errori:** Rappresenta la continuità di operazione garantita
      anche in condizioni avverse.

      - **a6 Tracciabilità:** Valuta il grado in cui può essere stabilita una relazione
      tra due o più prodotti del processo di sviluppo.

      - **a7 Espandibilità:** Indica se lo spazio di archiviazione o le funzioni possono
      essere espansi.

      - **a8 Generalità:** Valuta l''ampiezza delle possibili applicazioni del software.

      - **a9 Modularità:** Misura la fornitura di moduli altamente indipendenti all''interno
      del software.

      - **a10 Auto-documentazione:** Indica la presenza di documentazione incorporata
      nel codice stesso. Relazioni tra Indici di Qualità e Attributi: Ogni indice
      di qualità ik è una combinazione di attributi di qualità aj, contribuendo così
      a definire la qualità complessiva del software.'
- section_id: sec-12f6637e
  heading: METODO DELLA CHECKLIST
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > METODO DELLA CHECKLIST
  blocks:
  - block_id: backbone-b9f1a857d
    type: paragraph
    content: 'Il Metodo della Checklist è un approccio utilizzato per valutare il
      livello di qualità di ciascun attributo in un software. Questo metodo coinvolge
      la compilazione di una checklist, che consiste in una serie di domande a cui
      si attribuiscono valutazioni. Il risultato della checklist viene quindi elaborato
      mediante algoritmi appropriati per ottenere un punteggio normalizzato, indicando
      così il livello di qualità di ciascun attributo. Fasi Principali:'
  - block_id: backbone-b53db54b9
    type: list
    content: '- **Valutazione degli Attributi con Checklist:** La qualità di ciascun
      attributo è valutata attraverso l''uso di tecniche basate su checklist. Ogni
      checklist è composta da domande, e per ciascuna domanda sono previste quattro
      risposte, ciascuna con un valore associato.

      - **Elaborazione del Risultato della Checklist:** Il risultato della checklist
      viene elaborato utilizzando algoritmi appropriati. Questo processo di elaborazione
      fornisce un punteggio normalizzato per ogni attributo, riflettendo il livello
      di qualità.

      - **Agruppare i Punteggi degli Attributi:** Una volta valutati i punteggi di
      ciascun attributo, i valori rilevanti vengono raggruppati per ciascun attributo.
      Questi valori vengono quindi sommati o sintetizzati in modo appropriato.

      - **Normalizzazione dei Punteggi:** I punteggi normalizzati vengono ottenuti
      per riflettere il livello di qualità per ciascun indice. La normalizzazione
      può coinvolgere la trasformazione dei punteggi in una scala specifica o l''applicazione
      di ponderazioni per attribuire maggiore importanza a determinati attributi.'
  - block_id: backbone-b63955ab4
    type: paragraph
    content: <!-- Pagina PDF 85 -->
  - block_id: backbone-b4ee563a4
    type: list
    content: '- **Considerare la Polarità degli Attributi:** Gli attributi devono
      essere considerati con la loro polarità, ovvero se hanno un impatto positivo
      o negativo sulla qualità complessiva. Ad esempio, un attributo come la complessità
      potrebbe avere un impatto negativo, mentre la completezza potrebbe avere un
      impatto positivo. Valutazione della Checklist:'
  - block_id: backbone-b3b33dd87
    type: list
    content: '- **Composizione della Checklist:** Una checklist è composta da diverse
      domande, ciascuna con quattro possibili risposte valutate con un punteggio.
      Le domande non considerate applicabili o che non possono essere valutate sono
      escluse dal calcolo.

      - **Team di Valutazione della Checklist:** La valutazione della checklist coinvolge
      un team composto da almeno quattro persone, ognuna con competenze diverse. Questa
      diversità di punti di vista aiuta a garantire una valutazione più precisa. La
      composizione consigliata del team comprende uno specialista di assicurazione
      della qualità, un leader di progetto, un ingegnere di sistema e un analista
      del software. Calcolo del Punteggio degli Attributi: Per ogni attributo, eccetto
      "Modularità", il punteggio viene calcolato prendendo in considerazione le risposte
      alle domande associate all''attributo. Questo punteggio normalizzato riflette
      la valutazione dell''attributo basata sulle risposte fornite nel questionario.
      Valutazione del Livello di Qualità dell''Indice: Il livello di qualità dell''indice
      è calcolato sommando i punteggi normalizzati degli attributi che influenzano
      positivamente e negativamente l''indice. Il risultato è quindi diviso per il
      numero totale di attributi associati all''indice. Questo fornisce un indicatore
      normalizzato del livello di qualità dell''indice.'
- section_id: sec-8781987e
  heading: SOFTWARE QUALITY ASSURANCE – SQA
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > SOFTWARE QUALITY ASSURANCE – SQA
  blocks:
  - block_id: backbone-bef49e3f7
    type: paragraph
    content: 'Il Software Quality Assurance è un approccio pianificato e sistematico
      per garantire che sia il processo software che il prodotto software siano conformi
      agli standard, processi e procedure stabiliti. L''obiettivo principale di SQA
      è migliorare la qualità del software monitorando sia il software stesso che
      il processo di sviluppo per assicurare la piena conformità agli standard e alle
      procedure prestabilite. Ruolo del SQA:'
  - block_id: backbone-bdc5231fa
    type: list
    content: '- **Fornire l''assicurazione alla gestione:** Il SQA ha il compito di
      garantire alla direzione che il processo software ufficialmente stabilito viene
      effettivamente implementato. Questa assicurazione è fondamentale per garantire
      la qualità del software e la conformità agli standard e alle procedure definite.

      - **Garantire l''adozione di una metodologia di sviluppo appropriata:** Il SQA
      verifica che sia in atto una metodologia di sviluppo adeguata. Ciò significa
      che il processo di sviluppo segue una struttura organizzata e controllata che
      è in linea con gli standard e le best practice dell''industria.

      - **Utilizzare standard e procedure nei progetti:** Il SQA si assicura che i
      progetti seguano gli standard e le procedure definiti. Questo contribuisce a
      garantire coerenza e coesione nel lavoro svolto, riducendo la possibilità di
      errori e garantendo una maggiore prevedibilità nei risultati.

      - **Condurre revisioni e audit:** Il SQA è responsabile di organizzare e condurre
      revisioni e audit. Questi possono includere revisioni di codice, revisioni di
      documentazione e audit di processo. L''obiettivo è identificare eventuali problemi
      o non conformità e correggerli tempestivamente.

      - Produrre documentazione di supporto per la manutenzione e l''aggiornamento:
      Il SQA assicura che siano prodotti documenti adeguati per supportare le attività
      di manutenzione e miglioramento del software nel tempo.

      - **Gestire la configurazione del software per controllare i cambiamenti:**
      Il SQA verifica che sia in atto un sistema di gestione della configurazione
      del software. Questo implica il controllo rigoroso dei cambiamenti al software
      per garantire che ogni modifica sia documentata, autorizzata e tracciata.

      - **Eseguire e superare i test:** Il SQA si assicura che siano eseguiti test
      appropriati e che il software superi tali test. Questo è essenziale per garantire
      che il software funzioni correttamente e soddisfi i requisiti definiti.

      - Identificare, documentare e portare all''attenzione della direzione le deficienze
      e le deviazioni: Nel caso in cui vengano identificate deficienze o deviazioni
      rispetto agli standard e alle procedure, il SQA è responsabile di documentarle
      e portarle all''attenzione della direzione. Questo consente di prendere provvedimenti
      correttivi tempestivi. Obiettivi del SQA:'
  - block_id: backbone-b00762caf
    type: list
    content: '- **Riduzione dei rischi:** L''obiettivo principale del SQA è ridurre
      i rischi associati allo sviluppo del software. Ciò implica l''identificazione
      e la gestione proattiva di potenziali problemi che potrebbero verificarsi durante
      il processo di sviluppo.

      - **Monitoraggio appropriato del software e del processo di sviluppo:** Il SQA
      si impegna a monitorare attentamente sia il software che il processo di sviluppo.
      Questo monitoraggio è finalizzato a garantire che il software e il processo
      siano in linea con gli standard e le procedure definiti.'
  - block_id: backbone-bb79b7dad
    type: paragraph
    content: <!-- Pagina PDF 86 -->
  - block_id: backbone-bf8e9d144
    type: list
    content: '- **Assicurare la piena conformità agli standard e alle procedure:**
      Il SQA si assicura che ci sia una conformità completa agli standard e alle procedure
      stabiliti per il software e il processo di sviluppo. Questo contribuisce a garantire
      la coerenza, la qualità e la trasparenza nel processo di sviluppo.

      - Portare all''attenzione della direzione eventuali carenze nel prodotto, processo
      o standard: Il SQA è responsabile di identificare e segnalare alla direzione
      eventuali carenze nel prodotto software, nel processo di sviluppo o negli standard.
      Questo è fondamentale per consentire alla gestione di prendere provvedimenti
      correttivi tempestivi e migliorare continuamente il processo.

      - **Non responsabile della produzione di prodotti di qualità:** Va notato che
      il SQA non è direttamente responsabile della produzione di prodotti di qualità.
      La sua responsabilità principale è quella di condurre audit approfonditi (ossia
      esaminare il prodotto in dettaglio, confrontandolo con gli standard e le procedure
      stabiliti) sulle azioni di qualità e di segnalare alla gestione eventuali deviazioni.

      - **Audit delle azioni di qualità e segnalazione di deviazioni:** Il SQA si
      occupa di eseguire audit sulle azioni di qualità, verificando che siano conformi
      agli standard e alle procedure. Qualora vengano identificate deviazioni, il
      SQA è responsabile di segnalarle alla direzione, consentendo così l''adozione
      di misure correttive. Standard: Gli standard rappresentano i criteri a cui i
      prodotti software devono essere confrontati. In altre parole, gli standard definiscono
      ciò che dovrebbe essere fatto per garantire la qualità e la coerenza dei prodotti
      software. Nell''ambito del SQA, ci sono diversi tipi di standard, e alcuni dei
      requisiti minimi includono:'
  - block_id: backbone-b5cbb872f
    type: list
    content: '- **Standard di Documentazione:** Questi standard specificano la forma
      e il contenuto della documentazione utilizzata per la pianificazione, il controllo
      e la produzione del prodotto software. L''obiettivo è fornire coerenza nell''approccio
      alla documentazione durante tutto il progetto.

      - **Standard di Progettazione:** Gli standard di progettazione definiscono la
      forma e il contenuto del prodotto di progettazione. Questi standard stabiliscono
      regole per tradurre i requisiti software nella progettazione del software e
      rappresentarli nella documentazione di progettazione. L''obiettivo è garantire
      una progettazione coerente e di alta qualità.

      - **Standard di Codifica:** Gli standard di codifica specificano il linguaggio
      in cui il codice deve essere scritto e definiscono eventuali restrizioni sull''uso
      delle caratteristiche del linguaggio. Questi standard definiscono la struttura
      legale del linguaggio, le convenzioni di stile, le regole per le strutture dati
      e la documentazione interna del codice. L''obiettivo è garantire un codice coerente,
      leggibile e manutenibile. Procedure: Le procedure rappresentano i criteri a
      cui i processi di sviluppo e controllo devono essere confrontati. In altre parole,
      le procedure definiscono come il lavoro deve essere effettivamente svolto, chi
      deve svolgerlo, quando e cosa fare con i risultati ottenuti. Alcuni esempi di
      procedure includono:'
  - block_id: backbone-b51939baa
    type: list
    content: '- **Procedure di Sviluppo:** Queste procedure specificano come dovrebbe
      essere effettuato il processo di sviluppo del software. Ciò può includere fasi
      di pianificazione, progettazione, implementazione, test e manutenzione. Le procedure
      di sviluppo delineano chi è responsabile di ciascuna fase, quando svolgerla
      e quali risultati dovrebbero essere prodotti.

      - **Procedure di Controllo:** Queste procedure stabiliscono come dovrebbero
      essere controllati e gestiti i cambiamenti nel software. Ciò include il controllo
      delle versioni del codice, la gestione delle modifiche, e le procedure di revisione
      e approvazione per garantire che ogni modifica sia gestita in modo controllato
      e documentato. SQA Plan: Il piano SQA è un documento che specifica gli obiettivi
      del Software Quality Assurance, le attività da svolgere e gli standard e le
      procedure in base ai quali il lavoro di sviluppo deve essere valutato. Questo
      piano fornisce una guida dettagliata su come il processo di sviluppo del software
      sarà gestito e controllato per garantire la qualità del prodotto finale.'
  - block_id: backbone-bcf3d3acf
    type: paragraph
    content: <!-- Pagina PDF 87 -->
- section_id: sec-e3edbca5
  heading: TESTING
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > TESTING
  blocks:
  - block_id: backbone-b0d37fbb0
    type: paragraph
    content: 'Verification (Verifica): La verifica è il processo di assicurarsi che
      il software sia costruito correttamente, conformemente alle specifiche. In altre
      parole, risponde alla domanda "Stiamo costruendo il prodotto in modo corretto?".
      Durante la verifica, vengono eseguite attività come revisioni del codice, ispezioni
      dei documenti e analisi statica per garantire che il software sia conforme alle
      specifiche. Validation (Validazione): La validazione è il processo di assicurarsi
      che il software soddisfi effettivamente le esigenze dell''utente e che stia
      costruendo il prodotto giusto. Risponde alla domanda "Stiamo costruendo il prodotto
      giusto?". La validazione è spesso eseguita attraverso attività dinamiche come
      il testing del software, in cui il sistema viene eseguito con dati di test per
      osservare il suo comportamento operativo. Ispezioni del Software: Le ispezioni
      del software sono un processo di verifica che si concentra sull''analisi della
      rappresentazione statica del sistema per scoprire problemi. Questo approccio
      utilizza tecniche statiche, come la revisione del codice e l''ispezione della
      documentazione, per individuare errori, discrepanze o problemi potenziali nella
      fase di sviluppo. Testing del Software: Il testing del software è un processo
      di validazione che coinvolge l''esecuzione del sistema con dati di test per
      osservare il suo comportamento operativo. Questo approccio dinamico mira a scoprire
      errori nel software attraverso l''esecuzione e l''osservazione del suo comportamento
      in vari scenari. Il testing del software può includere test di unità, test di
      integrazione, test di sistema e test di accettazione. In breve, la verifica
      si concentra su "costruire il prodotto correttamente", garantendo che il software
      sia conforme alle specifiche, mentre la validazione si concentra su "costruire
      il prodotto giusto", assicurandosi che il software soddisfi le esigenze dell''utente.
      Le ispezioni del software sono attività di verifica che analizzano staticamente
      il sistema, mentre il testing del software è un''attività dinamica che esercita
      e osserva il comportamento del software in esecuzione. Entrambi i processi sono
      essenziali per garantire la qualità del software durante lo sviluppo. Tipi di
      Testing:'
  - block_id: backbone-b9d1f36fd
    type: list
    content: '- **Validation Testing:** È un tipo di testing inteso a dimostrare che
      un sistema soddisfa i requisiti dell''utente. Durante il validation testing,
      si cercano di eseguire test di accettazione che dimostrino che il sistema funziona
      correttamente secondo i casi di test definiti. Il successo di un test di validazione
      richiede che il sistema si comporti correttamente secondo i criteri di accettazione
      prestabiliti.

      - **Defect Testing:** È un tipo di testing progettato per scoprire difetti o
      difetti nel sistema. Mentre il validation testing mira a dimostrare che il sistema
      funziona correttamente, il defect testing mira a individuare difetti, il che
      significa che un test di difetto avrà successo se rileva la presenza di difetti
      nel sistema. In altre parole, il defect testing si concentra sulla ricerca di
      anomalie o problemi nel comportamento del software.

      - **Statistical Testing:** È un tipo di testing progettato per riflettere la
      frequenza delle operazioni dell''utente. Questo tipo di testing è spesso utilizzato
      per stime di affidabilità, cercando di modellare e testare il software in modo
      da riflettere le condizioni reali di utilizzo. Fasi del Defect Testing:'
  - block_id: backbone-b98235051
    type: list
    content: '- **Component Testing (Testing del Componente):** È il testing di singoli
      componenti di software, come moduli o unità. Solitamente, la responsabilità
      di questo tipo di testing è affidata allo sviluppatore del componente. I test
      vengono derivati dall''esperienza del programmatore e mirano a garantire che
      ogni componente funzioni correttamente in isolamento.

      - **Integration Testing (Testing di Integrazione):** È il testing di gruppi
      di componenti integrati per creare un sistema o sottosistema. La responsabilità
      di questo tipo di testing è spesso affidata a un team di testing indipendente.
      I test sono basati su una specifica di sistema e mirano a garantire che i componenti
      interagiscano correttamente quando vengono combinati.

      - **User Testing (Testing dell''Utente):** Non fa parte del processo di defect
      testing, ma è menzionato come parte del processo di validation testing. Questo
      tipo di testing, noto anche come validation o acceptance testing, coinvolge
      gli utenti finali nel testare il sistema per garantire che soddisfi i requisiti
      utente e funzioni come previsto in un ambiente di produzione.'
  - block_id: backbone-bfaab4efb
    type: paragraph
    content: <!-- Pagina PDF 88 -->
- section_id: sec-79033ead
  heading: POLITICHE DI TESTING
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > POLITICHE DI TESTING
  blocks:
  - block_id: backbone-ba2763fba
    type: paragraph
    content: 'Il testing esaustivo, che copre tutte le possibili combinazioni di input,
      percorsi e condizioni, è teoricamente ideale ma impraticabile nella realtà a
      causa del numero spesso vastissimo di casi di test possibili per un software
      complesso. Poiché il testing esaustivo è impossibile, si fa affidamento su un
      sottoinsieme rappresentativo di casi di test. La selezione di questo sottoinsieme
      dovrebbe seguire politiche obiettive formulate dal team di verifica e validazione,
      garantendo un approccio imparziale al testing. Le politiche di testing dovrebbero
      essere definite dal team di verifica e validazione, non dal team di sviluppo.
      Questo assicura che il processo di testing sia indipendente e miri a garantire
      l''obiettività e l''imparzialità nei confronti del software. È importante testare
      situazioni tipiche in modo da identificare e correggere i difetti che sono più
      probabili di verificarsi durante l''utilizzo normale del software. Test Cases
      (Casi di Test): I casi di test sono input progettati per testare il sistema
      e le relative uscite previste se il sistema opera secondo le specifiche. Di
      solito, i casi di test sono generati manualmente perché è difficile derivare
      automaticamente l''output di test da specifiche informali. Test Data (Dati di
      Test): I dati di test sono input progettati specificamente per testare il sistema.
      Possono essere generati automaticamente e sono essenziali per eseguire i casi
      di test. I dati di test devono coprire una varietà di scenari per garantire
      una copertura adeguata durante il testing. Black-Box Testing: Il black-box testing
      è un approccio al testing in cui il programma viene considerato come una "scatola
      nera". In questo contesto, il tester non conosce i dettagli interni dell''implementazione
      del software; si concentra solo sugli input e sugli output del sistema.'
  - block_id: backbone-b6347d081
    type: list
    content: '- **Derivazione dei Casi di Test:** I casi di test per il black-box
      testing vengono derivati dalla specifica del sistema. Il tester presenta input
      al componente o al sistema, esamina l''output corrispondente e verifica se gli
      output sono conformi a quelli specificati nella specifica del sistema.

      - **Scoperta dei Problemi:** Se gli output non corrispondono a quelli specificati,
      il test ha rilevato un problema nel software. Il black-box testing è anche chiamato
      functional testing poiché il tester è interessato solo alla funzionalità del
      software e non alla sua implementazione interna. Equivalence Partitioning: L''equivalence
      partitioning è una tecnica di progettazione dei test in cui i dati di input
      e i risultati di output sono suddivisi in classi di equivalenza. Ogni classe
      di equivalenza è un insieme di input o output che dovrebbero essere trattati
      in modo equivalente dal software.'
  - block_id: backbone-b82dc247a
    type: list
    content: '- **Partizionamento in Classi di Equivalenza:** Nel partizionamento
      per equivalenza, si suddividono gli input e gli output del sistema in "partizioni
      di equivalenza". Ogni partizione rappresenta un insieme di input o output che
      dovrebbero produrre risultati simili o equivalenti.

      - **Selezione dei Casi di Test:** I casi di test dovrebbero essere scelti da
      ciascuna partizione per garantire una copertura adeguata. Ad esempio, se un
      input deve essere un numero compreso tra 10.000 e 99.999, le partizioni di equivalenza
      potrebbero essere < 10.000, 10.000-99.999, > 99.999. I casi di test saranno
      quindi selezionati dai confini di queste partizioni e vicino al punto medio
      con input validi. Testing Strutturale: Il testing strutturale, talvolta indicato
      come white-box testing, consiste nella creazione di casi di test basati sulla
      struttura interna del programma. I casi di test derivano dal codice sorgente
      del programma, e la conoscenza della logica interna del programma viene utilizzata
      per identificare scenari di test aggiuntivi. L''obiettivo principale del testing
      strutturale è eseguire tutte le istruzioni del programma, garantendo che ciascuna
      riga di codice venga eseguita almeno una volta. Non si occupa necessariamente
      di testare tutte le possibili combinazioni di percorsi attraverso il programma,
      ma piuttosto di assicurarsi che ciascuna istruzione sia coperta. Testing dei
      Percorsi: Il testing dei percorsi mira a garantire che ciascun percorso attraverso
      il programma, e di conseguenza ciascuna istruzione, venga eseguito almeno una
      volta. Un grafo di flusso del programma, che rappresenta nodi per le decisioni
      del programma e archi per il flusso di controllo, è spesso utilizzato come punto
      di partenza per il testing dei percorsi. Questa tecnica è più fattibile nelle
      fasi di testing delle unità o dei moduli, poiché il numero di percorsi attraverso
      un programma tende a crescere con la sua dimensione. Percorsi Indipendenti:
      I percorsi indipendenti si riferiscono a sequenze uniche di istruzioni e rami
      in un programma. Nel testing, è essenziale progettare casi di test che coprano
      questi percorsi indipendenti per garantire una copertura completa del codice.'
  - block_id: backbone-bfea71425
    type: paragraph
    content: <!-- Pagina PDF 89 -->
  - block_id: backbone-b8a8be8a2
    type: paragraph
    content: 'Testing di Integrazione: Il testing di integrazione è un livello di
      testing del software in cui sistemi o sottosistemi completi, composti da componenti
      integrate, vengono testati. L''obiettivo è verificare che le componenti integrate
      funzionino insieme come previsto per raggiungere la funzionalità del sistema.
      Il testing di integrazione è tipicamente un testing black-box, il che significa
      che i casi di test sono derivati dalla specifica del sistema piuttosto che dai
      dettagli interni del codice. Approcci al Testing di Integrazione:'
  - block_id: backbone-be33f6c5e
    type: list
    content: '- **Testing Top-Down:** Questo approccio inizia con l''alto livello
      del sistema e integra le componenti dall''alto verso il basso. Le singole componenti
      vengono sostituite da stub (versioni simulate semplici) quando appropriato.
      Questo metodo consente di testare i percorsi di controllo principali in anticipo
      nel processo.

      - **Testing Bottom-Up:** Al contrario, il testing bottom-up integra le singole
      componenti a livelli, progredendo fino a quando il sistema completo è costruito.
      Le componenti stub vengono sostituite da componenti effettive man mano che progredisce
      il testing. Questo approccio consente il testing dei dettagli a basso livello
      in anticipo nel processo.

      - **Combination of Strategies:** In pratica, molti sforzi di testing di integrazione
      coinvolgono una combinazione di strategie top-down e bottom-up. Questo approccio
      ibrido mira a sfruttare i vantaggi di entrambi i metodi e può includere tecniche
      aggiuntive come big-bang integration (integrazione di tutte le componenti in
      una sola volta) o incremental integration (integrazione e testing in modo incrementale).'
- section_id: sec-9d7c80da
  heading: TESTING DELLE INTERFACCE
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > TESTING DELLE INTERFACCE
  blocks:
  - block_id: backbone-b84cee690
    type: paragraph
    content: 'Il testing delle interfacce avviene quando moduli o sottosistemi vengono
      integrati per formare sistemi più ampi. Gli obiettivi del testing delle interfacce
      sono rilevare errori derivanti da errori di interfaccia o da supposizioni non
      valide sulle interfacce. Questo tipo di testing è particolarmente cruciale nello
      sviluppo orientato agli oggetti, dove gli oggetti sono definiti dalle loro interfacce.
      Tipi di Interfacce:'
  - block_id: backbone-b045b79c5
    type: list
    content: '- **Interfacce Parametriche:** Coinvolge il passaggio di dati da una
      procedura a un''altra attraverso parametri.

      - **Interfacce con Memoria Condivisa:** In questo tipo, un blocco di memoria
      è condiviso tra procedure o componenti.

      - **Interfacce Procedurali:** Il sottosistema racchiude un insieme di procedure
      da chiamare da altri sottosistemi.

      - **Interfacce di Passaggio Messaggi:** I sottosistemi richiedono servizi ad
      altri sottosistemi attraverso il passaggio di messaggi. Errori delle Interfacce:'
  - block_id: backbone-b0a9dc017
    type: list
    content: '- **Abuso dell''Interfaccia:** Si verifica quando un componente chiamante
      commette un errore nell''uso dell''interfaccia di un altro componente, come
      fornire parametri nell''ordine sbagliato o del tipo sbagliato.

      - **Mancato Comprendimento dell''Interfaccia:** Si verifica quando un componente
      chiamante incorpora supposizioni incorrette sul comportamento del componente
      chiamato.

      - **Errori Temporali:** Sorgono quando i componenti chiamati e chiamanti operano
      a velocità diverse, portando all''accesso a informazioni obsolete.'
- section_id: sec-77ac3d9d
  heading: STRESS TESTING
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > STRESS TESTING
  blocks:
  - block_id: backbone-b881b70f4
    type: paragraph
    content: Lo stress testing implica di spingere il sistema oltre il suo carico
      massimo di progettazione. Questo viene fatto per scoprire difetti che potrebbero
      non essere evidenti in condizioni operative normali. Lo stress testing non riguarda
      solo il sovraccarico del sistema, ma anche il test del suo comportamento in
      caso di fallimento. I sistemi non dovrebbero fallire in modo catastrofico, e
      il fallimento non dovrebbe comportare una perdita inaccettabile di servizio
      o dati. Lo stress testing è particolarmente rilevante per i sistemi distribuiti.
      I sistemi distribuiti possono subire una grave degradazione quando le condizioni
      di rete diventano sovraccariche. Lo stress testing aiuta a identificare quanto
      bene il sistema può gestire tali scenari e se degrada in modo adeguato.
- section_id: sec-118b32f6
  heading: TESTING ORIENTATO AGLI OGGETTI
  level: 2
  heading_path: INGEGNERIA DEL SOFTWARE > TESTING ORIENTATO AGLI OGGETTI
  blocks:
  - block_id: backbone-b03216876
    type: paragraph
    content: Il testing orientato agli oggetti è un approccio complesso che richiede
      una strategia dettagliata per garantire l'integrità e la correttezza del sistema.
      Esso inizia con il testing degli oggetti a livello di metodi, assicurandosi
      che ciascun oggetto si comporti come previsto e che i suoi metodi e attributi
      funzionino correttamente. Successivamente, si estende al testing delle classi
      di oggetti, concentrandosi sulla copertura completa dei test per una classe,
      compresi i test delle operazioni, la configurazione e l'interrogazione degli
      attributi, e l'esecuzione dell'oggetto in tutti gli stati possibili. Questo
      processo continua con il testing dei cluster di oggetti cooperanti, che rappresentano
      il modo in cui gli oggetti collaborano per raggiungere la funzionalità del sistema.
      Infine, si arriva al testing del sistema orientato agli oggetti completo, che
      verifica il comportamento globale del sistema.
  - block_id: backbone-bd40d6365
    type: paragraph
    content: <!-- Pagina PDF 90 -->
  - block_id: backbone-bebef41f0
    type: paragraph
    content: Le sfide nel testing delle classi di oggetti includono la gestione dell'ereditarietà,
      poiché le informazioni da testare non sono localizzate in una singola classe,
      ma possono essere ereditate da classi superiori. L'ereditarietà rende fondamentale
      considerare l'intera gerarchia delle classi durante il processo di testing.
      Nel contesto dell'integrazione degli oggetti, i livelli di integrazione sono
      meno distinti rispetto ai sistemi tradizionali. Il testing coinvolge cluster
      di oggetti cooperanti anziché singole funzioni. L'approccio al testing è adattato
      alla natura della programmazione orientata agli oggetti. Gli approcci al testing
      di cluster comprendono il testing basato su casi d'uso o scenario, il thread
      testing e il testing delle interazioni degli oggetti. Il testing basato su casi
      d'uso si concentra sulle interazioni dell'utente con il sistema, derivando scenari
      di test dai casi d'uso. Il thread testing valuta la risposta del sistema agli
      eventi mentre progrediscono attraverso il sistema. Il testing delle interazioni
      degli oggetti testa le sequenze di interazioni degli oggetti, sottolineando
      le collaborazioni tra gli oggetti all'interno del sistema. Il testing basato
      su scenario implica l'identificazione di scenari dai casi d'uso, completando
      la rappresentazione con diagrammi di interazione come i diagrammi di sequenza.
      Ad esempio, in un sistema di stazione meteorologica, uno scenario potrebbe coinvolgere
      la generazione di un bollettino meteorologico. I banchi di lavoro per il testing
      svolgono un ruolo chiave nel mitigare le sfide e i costi associati al testing,
      fornendo strumenti e funzionalità per ridurre il tempo e i costi totali del
      processo di testing. Sono progettati come sistemi aperti, adattabili alle specifiche
      esigenze di testing di un'organizzazione. Questa flessibilità è essenziale dato
      che i requisiti di testing possono variare ampiamente tra diverse organizzazioni.
      In sintesi, il testing orientato agli oggetti richiede un approccio dettagliato
      e personalizzato, con il supporto di strumenti specifici per ridurre le complessità
      e i costi associati a questo processo.
