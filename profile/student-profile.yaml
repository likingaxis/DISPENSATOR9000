# Student Profile / Preferences - YAML Data Contract
# Ricavato dalla style-guide.md v1.0

style_rules:
  - "Nessun muro di testo: paragrafi discorsivi max 3-4 righe."
  - "Rapporto ~80% bullet point, ~20% testo."
  - "Ogni bullet contiene un'unità concettuale atomica, annidati fino a 4-5 livelli."
  - "Tono diretto, informale, non accademico."
  - "Mai usare transizioni verbose tra paragrafi."

terminology:
  - "Mantieni tutti i termini tecnici informatici in inglese."
  - "Metti in corsivo i termini inglesi alla prima occorrenza."
  - "Scrivi per esteso gli acronimi la prima volta (es. DMA (Direct Memory Access))."

structure_preferences:
  - "Gerarchia prevalente: H2 (##) per sezioni, H3 (###) per sotto-sezioni."
  - "Pattern Q&A in testa o inline: >[!question]- con >[!done]- annidato per le flashcard."
  - "Checklist di ripasso con Markdown task list: - [ ]"

formatting_preferences:
  - "Immagini esclusivamente in formato Obsidian: ![[nome_file.jpg|400]]"
  - "Grassetto SOLO per definizioni base e nomi di algoritmi/protocolli importanti."
  - "Matematica sempre rigorosamente in LaTeX ($ inline, $$ display)."
  - "Code block: ` per elementi tecnici, ``` per frammenti completi."

examples:
  - "profile/style-guide.md"
  - "profile/raw-examples/INFORMATION_RETRIEVAL/LISTA INFORMATION RETRIEVAL ESONERO 1.md"
  - "profile/raw-examples/SISTEMI_OPERATIVI/SISTEMI OPERATIVI LEZ.1.md"
